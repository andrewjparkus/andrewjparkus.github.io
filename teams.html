<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Ratings · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* page-unique: standings team cell */
  .conf{margin-top:24px}
  .conf h2{font-size:var(--fs-4);font-weight:700;letter-spacing:-.1px;margin:0 0 9px;color:var(--text)}
  .conf h2 span{color:var(--muted);font-weight:500;font-size:12px;margin-left:8px}
  .teamcell{display:flex;align-items:center;gap:9px}
  .teamcell img{width:22px;height:22px;flex:0 0 auto;object-fit:contain}
  .teamcell .ab{font-weight:700;font-size:13px;letter-spacing:.2px}
  .teamcell .nm{color:var(--muted);font-size:11.5px}
  table.tbl td.f,table.tbl td.net{font-size:12px}
  table.tbl th.f{font-size:11px}
  td.projw{font-weight:600;font-size:13px}
  td.projw .ci{color:var(--faint);font-size:10.5px;font-weight:400;margin-left:3px}
  td.actw{font-size:12.5px;color:#aebccd}
  :root[data-theme=light] td.actw{color:#33425a}
  td.po{font-size:11px;color:var(--muted)}
  tr.teamrow{cursor:pointer}
  tr.teamrow.cut>td{border-bottom:2px solid var(--faint)}    /* playoff cutoff (after 6) — stronger */
  tr.teamrow.cut2>td{border-bottom:1px dashed var(--muted)} /* play-in cutoff (after 10) — lighter */
  /* header ? tooltips live in a sticky thead inside the .scroll box; the shared
     tooltip renders upward and gets clipped — flip header tips DOWN */
  .scroll thead th .help[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .scroll thead th .help[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
</style></head>
<body>
<nav id="topnav" data-active="teams"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1 style="margin-top:6px">Measured team ratings, <b id="season">2025-26</b></h1>
  <p class="sub">Season-to-date team RAPM (pts/100) with model-win context. Click a team for its roster.
    <a href="projection.html" style="color:var(--accent)">See the forward 2026-27 projection →</a></p>

  <div id="standings"></div>
  <div class="msg" id="msg">Loading standings…</div>
</div>

<script>
"use strict";
const FACS = ["oTS","oTOV","oSC","dTS","dTOV","dSC"];
const FAC_TIP = {
  oTS:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (NBA scale).",
  oTOV:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive).",
  oSC:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions.",
  dTS:"Defensive true-shooting RAPM — suppressing opponent shot efficiency.",
  dTOV:"Defensive turnover RAPM — forcing turnovers / ball pressure.",
  dSC:"Defensive second-chance RAPM — limiting opponent offensive rebounds."
};
const NET_TIP = "Net RAPM = ORAPM (oTS+oTOV+oSC) + DRAPM (dTS+dTOV+dSC), points/100 on the NBA-equivalent scale.";

// number formatter: signed, fixed decimals, with sign-based color class
function fmt(v,dec){
  dec = (dec==null)?1:dec;
  if(v==null || isNaN(v)) return {txt:"–",cls:"zero"};
  const n = Number(v);
  const txt = (n>=0?"+":"−") + Math.abs(n).toFixed(dec);
  let cls = "zero";
  if(n >= 0.05) cls = "pos";
  else if(n <= -0.05) cls = "neg";
  return {txt,cls};
}
function cell(v,extraCls){
  const f = fmt(v,1);
  return '<td class="f '+(extraCls||"")+' '+f.cls+'">'+f.txt+'</td>';
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function num(v,dec){ return (v==null||isNaN(v))?"–":Number(v).toFixed(dec==null?1:dec); }

let DATA = null;

fetch('teams.json')
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ DATA = d; render(d); })
  .catch(err=>{
    const m = document.getElementById('msg');
    m.style.display='block';
    m.innerHTML = "Couldn't load the standings (teams.json). "+esc(err.message)+
      "<br><span style=\"font-size:12px;color:var(--faint)\">If you opened this file directly, serve the folder over http (e.g. <code>python3 -m http.server</code>).</span>";
  });

function render(d){
  document.getElementById('msg').style.display='none';
  const meta = (d && d.meta) || {};
  if(meta.season) document.getElementById('season').textContent = meta.season;

  const host = document.getElementById('standings');
  host.innerHTML = '';
  const confs = (d && d.conferences) || {};
  ["West","East"].forEach(name=>{
    const rows = Array.isArray(confs[name]) ? confs[name] : [];
    host.appendChild(buildConf(name, rows, d));
  });
}

function buildConf(name, rows, d){
  const sec = document.createElement('section');
  sec.className = 'conf';
  sec.id = 'conf-' + name.toLowerCase();

  const h = document.createElement('h2');
  h.innerHTML = esc(name);
  sec.appendChild(h);

  const scroll = document.createElement('div');
  scroll.className = 'scroll';

  const table = document.createElement('table');
  table.className = 'tbl';
  table.style.minWidth = '780px';
  table.id = 'table-' + name.toLowerCase();

  // header
  let thead = '<thead><tr>'
    + '<th class="l rank">#</th>'
    + '<th class="l">Team</th>'
    + '<th title="Model wins — mean of 10,000-season Monte-Carlo from measured 2025-26 team strength (p10–p90 in parens)">Model W</th>'
    + '<th title="Actual wins so far">Act W</th>';
  FACS.forEach(f=>{ thead += '<th class="f">'+f+' <span class="help" data-tip="'+esc(FAC_TIP[f])+'">?</span></th>'; });
  thead += '<th class="net">Net <span class="help" data-tip="'+esc(NET_TIP)+'">?</span></th>'
    + '</tr></thead>';
  table.innerHTML = thead;

  const tbody = document.createElement('tbody');
  rows.forEach((row,i)=>{
    const tr = document.createElement('tr');
    tr.className = 'teamrow' + (i===5 ? ' cut' : '') + (i===9 ? ' cut2' : '');
    tr.dataset.abbr = row.abbr || '';
    tr.dataset.conf = name;

    const ci = (row.p10!=null && row.p90!=null)
      ? '<span class="ci">'+num(row.p10,0)+'–'+num(row.p90,0)+'</span>' : '';
    const logo = row.logo
      ? '<img src="'+esc(row.logo)+'" width="22" height="22" loading="lazy" alt="" onerror="this.style.visibility=\'hidden\'">'
      : '';
    let html = '<td class="l rank">'+(i+1)+'</td>'
      + '<td class="l"><div class="teamcell">'+logo
        + '<span class="ab">'+esc(row.abbr||'')+'</span>'
        + '<span class="nm">'+esc(row.name||'')+'</span></div></td>'
      + '<td class="projw">'+num(row.proj_wins,1)+' '+ci+'</td>'
      + '<td class="actw">'+(row.actual_wins==null?'–':num(row.actual_wins,0))+'</td>';
    FACS.forEach(f=>{ html += cell(row[f]); });
    html += cell(row.net,'net');
    tr.innerHTML = html;

    // whole row -> team subpage
    tr.addEventListener('click', ()=>{
      if(row.abbr) location.href = 'team.html?abbr=' + encodeURIComponent(row.abbr);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  scroll.appendChild(table);
  sec.appendChild(scroll);
  return sec;
}
</script>
</body></html>
