<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draft Board · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* page-unique: draft board */
  .wrap{max-width:1100px}
  #tbl{min-width:880px}
  td.pcell .pn{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
  td.pcell a.pn:hover{color:var(--text);text-decoration:underline}
  td.pcell .pn.nolink{color:var(--muted);cursor:default}
  td.pcell .sub2{color:var(--muted);font-size:11px;margin-left:7px}
  td.f{font-size:12px}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;margin-left:6px;
    vertical-align:middle}
  .badge.thin{background:#3a2a16;color:#e8b86b}
  .badge.nodata{background:#2a1620;color:#e88}
  .whisk{display:inline-block;width:150px;height:12px;vertical-align:middle;margin-left:6px}
  /* header ? tooltips live in the sticky thead inside the .scroll box — flip tips DOWN */
  .scroll thead th .help[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .scroll thead th .help[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
</style></head>
<body>
<nav id="topnav" data-active="draft"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1 style="margin-top:6px">Draft <b>board</b> <span id="yr" style="color:var(--muted);font-weight:400"></span></h1>
  <!-- The keeper from the old methodology block: the bands are so wide they overlap for nearly
       every prospect, so this board is calibrated uncertainty, not a ranking to bet on. -->
  <p class="sub" id="sub">2026 prospects' college / G-League production translated to the NBA scale, with 95% bands —
    click a prospect to open them in the Explorer. Measured production, not a forecast of NBA careers: the bands
    overlap for nearly every prospect.</p>
  <div class="scroll"><table class="tbl" id="tbl"></table></div>
  <div class="msg" id="msg">Loading draft board…</div>
  <!-- REMOVED: the "Methodology & frozen NCAA→NBA translation" <details> and the foot legend.
       The translation table (per-factor slope / offset / Var_translate) is internal calibration
       output, still shipped in draft_board_2026.json meta.translation for anyone reading the feed.
       Its one reader-facing sentence — wide, overlapping bands, not a career forecast — is now the
       subhead. The foot's column and badge definitions moved to the header tips and badge titles. -->
</div>
<script>
"use strict";
const FACS=["oTS","oTOV","oSC","dTS","dTOV","dSC"];
let DATA=null, SORT={key:"pick",asc:true};
function fmt(v,dec){ dec=(dec==null)?2:dec;
  if(v==null||isNaN(v)) return {txt:"–",cls:"zero"};
  const n=Number(v); const txt=(n>=0?"+":"−")+Math.abs(n).toFixed(dec);
  let cls="zero"; if(n>=0.05)cls="pos"; else if(n<=-0.05)cls="neg"; return {txt,cls}; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

fetch('draft_board_2026.json').then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{DATA=d; init();})
  // Reader-facing failure text: no filenames, no HTTP status — the network tab has both.
  .catch(()=>{ document.getElementById('msg').textContent="Couldn't load the draft board."; });

function init(){
  document.getElementById('msg').style.display='none';
  document.getElementById('yr').textContent="· "+DATA.meta.year+" · "+DATA.meta.draft_date;
  render();
}

// global net domain for the whisker scale
function netDomain(){
  let lo=Infinity, hi=-Infinity;
  for(const p of DATA.prospects){ if(p.status!=="ok")continue;
    lo=Math.min(lo,p.net_lo); hi=Math.max(hi,p.net_hi); }
  if(!isFinite(lo)){lo=-1;hi=1;} const pad=(hi-lo)*0.04||0.5; return [lo-pad,hi+pad];
}
function whisker(p,dom){
  if(p.status!=="ok") return "";
  const W=150,H=12,[d0,d1]=dom, x=v=>(v-d0)/(d1-d0)*W;
  const xl=x(p.net_lo), xh=x(p.net_hi), xn=x(p.net), xz=x(0);
  let s='<svg class="whisk" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  if(xz>=0&&xz<=W) s+='<line x1="'+xz+'" y1="0" x2="'+xz+'" y2="'+H+'" stroke="var(--zero)" stroke-width="1" stroke-dasharray="2 2"/>';
  s+='<line x1="'+xl+'" y1="'+(H/2)+'" x2="'+xh+'" y2="'+(H/2)+'" stroke="var(--whisk)" stroke-width="1.5"/>';
  s+='<line x1="'+xl+'" y1="2" x2="'+xl+'" y2="'+(H-2)+'" stroke="var(--whisk)" stroke-width="1.5"/>';
  s+='<line x1="'+xh+'" y1="2" x2="'+xh+'" y2="'+(H-2)+'" stroke="var(--whisk)" stroke-width="1.5"/>';
  s+='<circle cx="'+xn+'" cy="'+(H/2)+'" r="2.6" fill="var(--accent)"/></svg>'; return s;
}
function facCell(p,f){
  if(p.status!=="ok") return '<td class="f zero">–</td>';
  const v=fmt(p[f],2), se=p["se_"+f];
  const ci=(se!=null&&!isNaN(se))?' <span style="color:var(--muted);font-size:10px">±'+(1.959964*se).toFixed(1)+'</span>':'';
  return '<td class="f '+v.cls+'">'+v.txt+ci+'</td>';
}

const COLDEF=[
  {key:"pick",label:"Pick",l:true,tip:"Consensus mock-draft slot."},{key:"name",label:"Prospect",l:true},
  {key:"our_rank",label:"Our#",tip:"Rank by translated net — an ordering of measured production, not a draft forecast."},
  {key:"net",label:"Net ±95% (NBA-eq)",tip:"Net RAPM = ORAPM (oTS+oTOV+oSC) + DRAPM (dTS+dTOV+dSC), points/100 on the NBA-equivalent scale."},
  {key:"oTS",label:"oTS",grp:true,tip:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (NBA scale)."},
  {key:"oTOV",label:"oTOV",tip:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive)."},
  {key:"oSC",label:"oSC",tip:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions."},
  {key:"dTS",label:"dTS",grp:true,tip:"Defensive true-shooting RAPM — suppressing opponent shot efficiency."},
  {key:"dTOV",label:"dTOV",tip:"Defensive turnover RAPM — forcing turnovers / ball pressure."},
  {key:"dSC",label:"dSC",tip:"Defensive second-chance RAPM — limiting opponent offensive rebounds."}];

function render(){
  const dom=netDomain();
  let head='<thead><tr>';
  for(const c of COLDEF){
    const arrow=SORT.key===c.key?(SORT.asc?' ▲':' ▼'):'';
    const help=c.tip?' <span class="help" data-tip="'+esc(c.tip)+'">?</span>':'';
    head+='<th class="sortable '+(c.l?'l ':'')+(c.grp?'grp':'')+'" onclick="setSort(\''+c.key+'\')">'+esc(c.label)+arrow+help+'</th>'; }
  head+='</tr></thead>';
  const rows=DATA.prospects.slice().sort(cmp);
  let body='<tbody>';
  for(const p of rows){
    const net=fmt(p.net,2);
    // Badge definitions ride on the badges themselves, not in a legend under the table.
    const badges=(p.thin_sample?'<span class="badge thin" title="Thin sample — little college / G-League playing time behind this estimate.">thin</span>':'')+
                 (p.status!=="ok"?'<span class="badge nodata" title="No college or G-League possessions on file for this prospect.">no data</span>':'');
    const linkable=p.status==="ok"&&p.gid;
    // Straight to the Explorer, which owns the real multi-series chart with a crosshair, the mode
    // toggle and the factor grid. The old in-page mini-curve was a second, worse renderer of the
    // same data/{gid}.json feed (owner 2026-07-26).
    const pn=linkable
      ? '<a class="pn" href="index.html?p='+encodeURIComponent(p.gid)+'">'+esc(p.name)+'</a>'
      : '<span class="pn nolink">'+esc(p.name)+'</span>';
    const netcell=p.status==="ok"
      ? '<td class="net '+net.cls+'">'+net.txt+'<span style="color:var(--muted);font-size:10px"> ±'+(1.959964*p.se_net).toFixed(1)+'</span>'+whisker(p,dom)+'</td>'
      : '<td class="net zero">–</td>';
    body+='<tr class="prow" id="row-'+esc(p.gid||('p'+p.pick))+'">'+
      '<td class="rank">'+p.pick+'</td>'+
      '<td class="l pcell">'+pn+badges+(p.team?'<span class="sub2">'+esc(p.team)+'</span>':'')+'</td>'+
      '<td class="rank">'+(p.our_rank!=null&&!isNaN(p.our_rank)?p.our_rank:'–')+'</td>'+
      netcell+
      facCell(p,"oTS").replace('class="f','class="f grp')+facCell(p,"oTOV")+facCell(p,"oSC")+
      facCell(p,"dTS").replace('class="f','class="f grp')+facCell(p,"dTOV")+facCell(p,"dSC")+
      '</tr>';
  }
  body+='</tbody>';
  document.getElementById('tbl').innerHTML=head+body;
}
function cmp(a,b){
  const k=SORT.key, s=SORT.asc?1:-1;
  let av=a[k], bv=b[k];
  // no_data rows sink to the bottom regardless of direction
  const an=(av==null||isNaN(av)&&typeof av!=="string"), bn=(bv==null||isNaN(bv)&&typeof bv!=="string");
  if(an&&!bn) return 1; if(bn&&!an) return -1;
  if(typeof av==="string"){ return s*String(av).localeCompare(String(bv)); }
  return s*((av||0)-(bv||0));
}
function setSort(k){ if(SORT.key===k) SORT.asc=!SORT.asc; else {SORT.key=k; SORT.asc=(k==="pick"||k==="name"||k==="our_rank");} render(); }

</script>
</body></html>
