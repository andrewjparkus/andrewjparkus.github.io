<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorer · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* ── page-unique CSS only (tokens/nav/search/grid/cell/seg live in site.css) ── */
  #player{display:none;margin-top:20px}
  .phead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:11px}
  .pname{font-size:var(--fs-6);font-weight:700;letter-spacing:-.5px}
  .pmeta{color:var(--muted);font-size:var(--fs-2)}
  .readout{margin-left:auto;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
  .readout b{color:var(--text)}
  .modehint{font-size:11.5px;color:var(--faint);margin:7px 0 -4px;line-height:1.55;max-width:840px}
  /* bespoke interactive crosshair charts (owned locally) */
  .crosshair{stroke:#3a4862;stroke-width:1;stroke-dasharray:3 3;pointer-events:none}
  .hdot{pointer-events:none;stroke:var(--bg);stroke-width:1.2}
  .grid svg,.netcard svg{touch-action:none}
  /* add-to-compare affordance in the player header */
  .cmpadd{font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:5px 11px;cursor:pointer;border-radius:var(--r-1)}
  .cmpadd:hover{color:var(--text);border-color:var(--accent)}
  .cmptray{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
  .cmptray .seglab{align-self:center}
  .cmpchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    padding:4px 9px;font-size:12px;border-radius:var(--r-1)}
  .cmpchip .sw{width:10px;height:10px;border-radius:2px}
  .cmpchip .x{cursor:pointer;color:var(--muted);font-weight:700;margin-left:1px}
  .cmpchip .x:hover{color:var(--neg)}
  .cmpgo{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border:none;
    padding:5px 12px;cursor:pointer;border-radius:var(--r-1)}
  .cmpgo:disabled{opacity:.4;cursor:not-allowed}
  /* ── production profile section ── */
  #profile{display:none;margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow .lab{width:48px;font-size:12.5px;font-weight:700;color:#cdd9e6;font-variant-numeric:tabular-nums}
  :root[data-theme=light] .barrow .lab{color:#33425a}
  .barrow .val{width:60px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .barrow .pctlab{width:38px;font-size:11.5px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .barwrap{flex:1;min-width:120px}
  /* two balanced columns: percentile bars (left) + radar (right), vertically centered to each other */
  .profcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 30px;align-items:start}
  .radarwrap{max-width:330px;margin:0 auto;width:100%}
  /* offense row 1, defense row 2 (FAC order is fixed) */
  #grid{grid-template-columns:repeat(3,1fr)}
  @media(max-width:640px){#grid{grid-template-columns:repeat(2,1fr)}}
  /* forward projection overlay (opt-in, ORANGE = projected, NOT measured) — 1-5yr trajectory, drawn on each chart */
  .projconn{stroke:var(--amber);stroke-width:1.4;fill:none;stroke-dasharray:4 2;stroke-linejoin:round;stroke-linecap:round;opacity:.65}
  .projci{stroke:var(--amber);stroke-width:1.6;stroke-linecap:butt}
  .projcap{stroke:var(--amber);stroke-width:1.6;stroke-linecap:round}
  .projdot{fill:var(--amber);stroke:var(--bg);stroke-width:1}
  /* ── impact waterfall (6 factors → off/def; continuous play across game-days) ── */
  #waterfall{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:6px}
  .wfbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 5px}
  .wfscrub{flex:1;min-width:130px;accent-color:var(--accent)}
  .wfsum{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 4px}
  .wfsum b{color:var(--text)}
  .wfstack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.wfstack{grid-template-columns:1fr}}
  .wfchart{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-1);padding:6px 9px 3px}
  .wfhd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;
    color:#aebccd;letter-spacing:.16em;padding:1px 2px 2px}
  :root[data-theme=light] .wfhd{color:#33425a}
  .wfsvg{width:100%;height:auto}
  .wfg{stroke:var(--grid);stroke-width:1}
  .wft{fill:var(--faint);font-size:9px;font-variant-numeric:tabular-nums}
  .wfax{stroke:var(--zero);stroke-width:1}
  .wftr{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4;opacity:.5}
  .wfb.pos{fill:var(--pos);opacity:.9}.wfb.neg{fill:var(--neg);opacity:.9}.wfb.zero{fill:var(--zero);opacity:.6}
  .wfb.tot.pos{fill:var(--pos);opacity:1}.wfb.tot.neg{fill:var(--neg);opacity:1}
  .wfl{fill:var(--muted);font-size:10.5px;font-weight:700}
  .wfv{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
  .wfv.pos{fill:var(--pos)}.wfv.neg{fill:var(--neg)}.wfv.zero{fill:var(--muted)}
</style></head>
<body>
<nav id="topnav" data-active="explorer"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1 style="margin-top:6px">Six-factor RAPM, <b>every game-day</b></h1>
  <p class="sub">For any NCAA, G-League or NBA player, on every game-day.</p>
  <div class="searchbox">
    <input id="q" autocomplete="off" placeholder="Search a player…  (e.g. LeBron James, Cooper Flagg)">
    <div class="drop" id="drop"></div>
  </div>
  <div class="cmptray" id="suggest"></div>

  <div id="player">
    <div class="phead">
      <span class="pname" id="pname"></span>
      <span class="pmeta" id="pmeta"></span>
      <span class="readout" id="readout"></span>
      <div id="modeseg" class="seg" style="margin-left:auto;display:none">
        <button data-mode="pure" type="button">Pure RAPM</button>
        <button data-mode="prior" type="button">Prior-informed</button>
        <button data-mode="box" type="button">Box prior</button>
        <button data-mode="latent" type="button" title="One continuous cross-league curve over the daily prior-informed board; colored by league. Display-only.">Latent</button>
      </div>
    </div>
    <div class="modehint" id="modehint"></div>

    <!-- add-to-compare affordance (single view only) — above the charts for easy access -->
    <div class="cmptray" id="cmptray" style="display:none">
      <span class="seglab">Compare:</span>
      <button class="cmpadd" id="cmpadd" type="button">+ Add this player</button>
      <span id="cmplist"></span>
      <button class="cmpgo" id="cmpgo" type="button" disabled>Compare →</button>
    </div>

    <div class="netcard">
      <div class="ctitle"><span>Net RAPM <span style="color:var(--faint);font-weight:400">· ORAPM + DRAPM</span> <span class="help" data-tip="Net RAPM = ORAPM (oTS+oTOV+oSC) + DRAPM (dTS+dTOV+dSC), points/100 on the NBA-equivalent scale. The grey band is the 95% CI on the estimate itself — how tightly the lineup data pins down what has already happened. It is not a forecast of next season; read that way it is about 4× too wide.">?</span></span>
        <span style="display:inline-flex;align-items:center;gap:8px;margin-left:auto">
          <span id="projseg" class="seg" style="display:none" title="Overlay the 1–5 year forward projection (per-factor XGBoost; off by default)">
            <button data-proj="off" type="button" class="on">Descriptive</button>
            <button data-proj="on"  type="button">+ Projection</button>
          </span>
          <span class="v" id="v_net"></span>
        </span></div>
      <div id="c_net"></div>
    </div>
    <div class="grid" id="grid"></div>

    <!-- ── IMPACT WATERFALL (single-player only) — 6 factors → off/def, continuous play across game-days ── -->
    <div id="waterfall">
      <div class="sectitle" style="margin-bottom:4px">Impact waterfall
        <span class="help" data-tip="The six factors stacked into Offense and Defense totals for one game-day. Press Play to morph the waterfall continuously across every game-day of this player's career.">?</span>
      </div>
      <div class="wfbar">
        <button class="btn" id="wfplay" type="button" style="font-weight:700">▶ Play</button>
        <input class="wfscrub" id="wfscrub" type="range" min="0" max="0" value="0" step="1" aria-label="Scrub game-day">
      </div>
      <div class="wfsum" id="wfsum"></div>
      <div class="wfstack" id="wfstack"></div>
    </div>

    <!-- ── PRODUCTION PROFILE (single-player only) ── -->
    <div id="profile">
      <div class="profcols">
        <div>
          <div class="sectitle" style="margin-top:0">Production profile</div>
          <div class="sectitle">Offense</div>
          <div id="off"></div>
          <div class="sectitle">Defense</div>
          <div id="def"></div>
          <div class="legend" id="proflegend"></div>
        </div>
        <div>
          <div class="sectitle" style="margin-top:0">Profile shape</div>
          <div class="radarwrap" id="radar"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="empty" id="empty">Search for a player to see their daily 6-factor RAPM trajectory.</div>

</div>

<script>
const FAC=[["oTS","oTS"],["oTOV","oTOV"],["oSC","oSC"],["dTS","dTS"],["dTOV","dTOV"],["dSC","dSC"]];
const TIP={
  oTS:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (NBA scale).",
  oTOV:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive).",
  oSC:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions.",
  dTS:"Defensive true-shooting RAPM — suppressing opponent shot efficiency.",
  dTOV:"Defensive turnover RAPM — forcing turnovers / ball pressure.",
  dSC:"Defensive second-chance RAPM — limiting opponent offensive rebounds."};
const FACK=["oTS","oTOV","oSC","dTS","dTOV","dSC"];
const OFFF=["oTS","oTOV","oSC"], DEFF=["dTS","dTOV","dSC"];
const LC={nba:'var(--nba)',gleague:'var(--gleague)',college:'var(--college)'};
const LNAME={nba:'NBA',gleague:'G-League',college:'NCAA'};
const q=document.getElementById('q'), drop=document.getElementById('drop');
let INDEX=[], curOpts=[], active=-1, CHARTS=[], SER=null;

// ── lazy-loaded, cached secondary data files ────────────────────────────────
let QUANT=null;
function lazy(file, cache){ return cache.p || (cache.p = fetch(file).then(r=>r.ok?r.json():null).catch(()=>null)); }
const _q={};
const getQuant = ()=>lazy('quantiles.json',_q).then(d=>QUANT=d);

// ── forward-projection overlay (opt-in; fetched ONCE, cached) ─────────────────
// projection_series.json: { meta:{factors,...}, players:{ "<pid>":{ last_season,
//   anchor:[net,se], next:[season,net,se], anchor_f:[6], next_f:[6], next_f_se:[6] } } }.
// 1-5yr trajectory. Rendered as ORANGE projected points + 80% CI on each chart. OFF by default.
let PROJ=null; const _p={};
const Z80=1.2816;                                  // 80% two-sided band half-width
let PROJON=false;                                  // always land on Descriptive; projection is opt-in, session-only
const getProj = ()=>lazy('projection_series.json',_p).then(d=>PROJ=d);
function projFor(){ return (PROJON && PROJ && PROJ.players && CURID && PROJ.players[CURID]) || null; }

fetch('players.json').then(r=>r.json()).then(d=>{
  INDEX=d;
  const u=new URLSearchParams(location.search),pid=u.get('p'),nq=u.get('q');
  // Multi-player comparison overlay: ?p=id1,id2,... (2-4 players). One id -> normal single view.
  const ids=(pid||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(ids.length>1){loadMulti(ids.slice(0,4));return;}
  let hit=pid?INDEX.find(x=>x.id===pid):(nq?INDEX.find(x=>x.n.toLowerCase()===nq.toLowerCase())||INDEX.find(x=>x.n.toLowerCase().includes(nq.toLowerCase())):null);
  if(hit){load(hit.id,hit.n);return;}
  // DEFAULT: open populated on Nikola Jokić so the home page is never empty.
  load('203999','Nikola Jokić');
});

q.addEventListener('input',()=>filt(q.value.trim()));
q.addEventListener('focus',()=>{if(q.value.trim())filt(q.value.trim())});
q.addEventListener('keydown',e=>{if(!curOpts.length)return;
  if(e.key==='ArrowDown'){active=Math.min(active+1,curOpts.length-1);paint()}
  else if(e.key==='ArrowUp'){active=Math.max(active-1,0);paint()}
  else if(e.key==='Enter'){const o=curOpts[active<0?0:active];if(o)load(o.id,o.n)}
  else if(e.key==='Escape')drop.style.display='none';});
document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))drop.style.display='none'});

function filt(query){if(!query){drop.style.display='none';return}
  const ql=query.toLowerCase();
  curOpts=INDEX.filter(x=>x.n.toLowerCase().includes(ql))
    .sort((a,b)=>{const ai=a.n.toLowerCase().startsWith(ql),bi=b.n.toLowerCase().startsWith(ql);return ai!==bi?(bi-ai):(b.net-a.net)}).slice(0,12);
  active=-1;paint();}
function paint(){if(!curOpts.length){drop.style.display='none';return}
  drop.innerHTML='';
  curOpts.forEach((o,i)=>{const badges=[...o.lg].map(c=>`<span class="badge b-${c}">${c==='n'?'NBA':c==='g'?'GL':'NCAA'}</span>`).join('');
    const el=document.createElement('div');el.className='opt'+(i===active?' active':'');
    el.innerHTML=`<span class="nm">${o.n}</span><span class="meta">${badges}<span>${o.s}–${o.e}</span><span style="color:#cbd5e1;font-weight:700">${o.net>=0?'+':''}${o.net}</span></span>`;
    el.onclick=()=>load(o.id,o.n);drop.appendChild(el);});
  drop.style.display='block';}

// Global data mode, persisted across players. Three daily series per player, swapped into the
// charts on toggle: 'pure' (prior-free), 'prior' (box-prior-informed, default), 'box' (the prior).
const MODEHINT={
  pure:'Pure RAPM — the prior-free six-factor decomp, calibrated to the public DataBallR ridge. One line per league.',
  prior:'Prior-informed RAPM — the same daily solve, with all six factors shrunk toward a daily box-score prior. Shrinkage is strongest where lineup data is thin (rookies, early season) and fades as exposure grows. The default.',
  box:'Box prior — the daily-refit box+EPM basis the prior-informed solve shrinks toward, re-fit every game-day on that day\'s prior-free cross-section (no seasonal steps). Shown at its honest scale, so it reads cooler than the board — especially on defense. Built from box stats across NCAA, G-League & NBA up to each day; all six factors, with a confidence band.',
  latent:'Latent — one continuous cross-league curve: a DARKO-style state-space pass over the daily prior-informed board, so a player who moves between leagues has a single line instead of disjoint per-league graphs. Colored by the league played each day. Display-only.'};
const MODEHINT_LATENT_ALIAS='Latent — single-league player: the latent equals the prior-informed board (no cross-league bridge needed).';
let SERIES={}, MODE=(localStorage.getItem('rapm_mode')||'prior'), PNAME='', CURID=null;
function load(id,name){drop.style.display='none';q.value=name;history.replaceState(null,'','?p='+id);
  if(typeof wfStop==='function')wfStop();           // cancel any waterfall sweep from the previous player
  CURID=id; MULTI=null;
  const opt=u=>fetch(u).then(r=>r.ok?r.json():null).catch(()=>null);
  Promise.all([
    fetch('data/'+id+'.json').then(r=>r.json()),     // prior-informed (base; carries name)
    opt('data/'+id+'_pure.json'),                    // pure
    opt('data/'+id+'_box.json'),                     // box prior (daily, multi-league curve + CI band)
    opt('data/'+id+'_latent.json')                   // latent (continuous cross-league fusion; piecewise-colored)
  ]).then(([prior,pure,box,latent])=>{
    PNAME=prior.name||name;
    const priorPrep=prep(prior);
    // plan45 B1 (D3): single-league players have no _latent.json; alias Latent to the prior board
    // (latent === board when there is no cross-league bridge) so the tab is never a dead greyed button.
    LATENT_ALIAS=!latent;
    SERIES={prior:priorPrep, pure:pure?prep(pure):null, box:box?prep(box):null,
            latent:latent?prep(latent):priorPrep};
    RAW={prior, pure, box, latent};
    show();
  });}
let RAW={}, LATENT_ALIAS=false;

function activeMode(){return SERIES[MODE]?MODE:'prior';}  // honor preference; fall back per-player without dropping it
function setMode(m){
  if(!SERIES[m])return;                              // ignore unavailable mode (button disabled anyway)
  MODE=m; localStorage.setItem('rapm_mode',m);
  syncSeg(); renderActive(); renderProfile();        // re-render on Pure / Prior-informed / Box toggle
}
function syncSeg(){
  const am=activeMode();
  document.querySelectorAll('#modeseg button').forEach(b=>{
    const avail=!!SERIES[b.dataset.mode];
    b.disabled=!avail; b.classList.toggle('on',avail&&b.dataset.mode===am);
  });
  document.getElementById('modehint').textContent=(am==='latent'&&LATENT_ALIAS)?MODEHINT_LATENT_ALIAS:MODEHINT[am];
}
document.querySelectorAll('#modeseg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

// ── projection toggle (opt-in forward overlay on the NET chart) ──────────────
function syncProjSeg(){
  document.querySelectorAll('#projseg button').forEach(b=>b.classList.toggle('on',(b.dataset.proj==='on')===PROJON));
}
function setProj(on){
  if(PROJON===on)return;
  PROJON=on;                                       // session-only; not persisted (Descriptive is the default landing)
  syncProjSeg();
  if(MULTI)return;                                 // projection overlay is single-player only
  if(on) getProj().then(renderActive);             // lazy-load then re-draw charts with orange overlay
  else   renderActive();                           // re-draw charts without the overlay
}
document.querySelectorAll('#projseg button').forEach(b=>b.addEventListener('click',()=>setProj(b.dataset.proj==='on')));

// collapse off-seasons: one row per date, sorted; d may be null (mode unavailable) -> null series
function prep(d){
  if(!d)return null;
  const byDate={};
  for(let i=0;i<d.d.length;i++){const k=d.d[i];
    if(!byDate[k]) byDate[k]={};
    const o=byDate[k];
    o.date=k;o.lg=d.lg[i];o.net=d.net[i];o.net_se=d.net_se[i];
    for(const[f]of FAC){o[f]=d[f][i];o[f+'_se']=d[f+'_se'][i];}
  }
  return Object.values(byDate).sort((a,b)=>a.date<b.date?-1:1);
}

const el=RC.el;
// resolve a CSS var to a concrete color for raw SVG attributes (lines/fills the helpers don't take vars for)
function cssvar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim()||'#888';}
function lgColor(lg){return cssvar(lg==='nba'?'--nba':lg==='gleague'?'--gleague':lg==='college'?'--college':'--accent');}

function Chart(mount,ser,key,proj){
  const W=mount.clientWidth||320, H=mount===document.getElementById('c_net')?190:150;
  const padL=30,padR=7,padT=8,padB=15, pw=W-padL-padR, ph=H-padT-padB;
  const n=ser.length;
  const v   = ser.map(s=>s[key]);
  const se  = ser.map(s=>s[key+'_se']);
  let pool=v.filter(x=>x!=null);
  // forward projection: a 1-5yr TRAJECTORY {traj:[{val,se,season}...]}; widen the y-domain so every
  // orange point + its 80% CI fits, and reserve a right-hand slice of the plot for the future path.
  let PT=null;
  if(proj && Array.isArray(proj.traj) && proj.traj.length){
    PT=proj.traj.filter(t=>t&&t.val!=null&&t.se!=null);
    if(!PT.length) PT=null;
    else PT.forEach(t=>{pool.push(t.val+Z80*t.se); pool.push(t.val-Z80*t.se);});   // fold every ±80% CI in
  }
  let lo=Math.min(...pool), hi=Math.max(...pool), c=(lo+hi)/2, half=Math.max((hi-lo)/2*1.06,0.15);
  const ymin=c-half, ymax=c+half;
  const histW=PT?pw*0.60:pw;                           // history occupies the left; the future the right
  const X=i=>padL+(n>1?i/(n-1):.5)*histW;
  const Y=val=>padT+ph-(Math.max(ymin,Math.min(ymax,val))-ymin)/(ymax-ymin)*ph;
  const futW=PT?(W-padR-(padL+histW)):0;               // px available to the right of history
  const XP=h=>padL+histW+futW*(h+1)/PT.length;         // horizon h (0-based) placed across the future slice
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  [0,.5,1].forEach(f=>{const yv=ymin+(ymax-ymin)*f, y=Y(yv);
    svg.appendChild(el('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=el('text',{x:padL-4,y:y+3,'font-size':9,fill:'var(--faint)','text-anchor':'end'});t.textContent=(yv>=0?'+':'')+yv.toFixed(1);svg.appendChild(t);});
  if(ymin<0&&ymax>0){const y=Y(0);svg.appendChild(el('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'var(--zero)','stroke-width':1}));}
  let py=ser[0].date.slice(0,4);
  for(let i=1;i<n;i++){const yr=ser[i].date.slice(0,4);if(yr!==py){
    svg.appendChild(el('line',{x1:X(i),y1:padT,x2:X(i),y2:padT+ph,stroke:'var(--line-2)','stroke-width':1}));
    const t=el('text',{x:X(i),y:H-4,'font-size':8.5,fill:'var(--faint)','text-anchor':'middle'});t.textContent="’"+yr.slice(2);svg.appendChild(t);py=yr;}}
  // CI band (95%, faint): the de-shrunk daily SE. This is a MEASUREMENT CI on the current estimate,
  // NOT a forward band — see research/arp/cal2_band_audit.md (CAL-2). Read as a next-season forecast
  // it covers 99.9% at nominal 95% (n=17,204): median se~3.13 vs median annual move ~0.54, i.e. ~4x
  // too wide for starters and ~26x for rotation players. It is honest as labeled, so do NOT narrow,
  // rescale or de-attenuate it (F1); the honest forward band is a separate artifact
  // (out/conformal_bands.parquet, daily_v5/conformal.py) and is not rendered here yet.
  // Drawn UNCLAMPED and clipped to the plot rect.
  // Early-career SE is huge (±1.96·17 ≈ ±34); the old value-clamped envelope folded flat against
  // the axis edge and, as SE wobbled day-to-day, tore into jagged dark blocks. Clipping lets the
  // envelope run off-plot cleanly, so the band hugs the line and washes where uncertain.
  // plan45 B3 (D3): suppress the band in latent mode — the latent sidecar's SE is a Kalman smoothing
  // SE (~29x tighter than the true ability CI), so a band there would be quantitatively misleading.
  if(activeMode()!=='latent'){const Yb=val=>padT+ph-(val-ymin)/(ymax-ymin)*ph;          // unclamped Y for the band envelope
    const idx=[];for(let i=0;i<n;i++)if(v[i]!=null&&se[i]!=null)idx.push(i);
    if(idx.length>1){
      const cid='ciclip_'+key, clip=el('clipPath',{id:cid}), defs=el('defs');
      clip.appendChild(el('rect',{x:padL,y:padT,width:W-padR-padL,height:ph}));
      defs.appendChild(clip);svg.appendChild(defs);
      let up='',dn='';
      idx.forEach(i=>{up+=`${X(i).toFixed(1)},${Yb(v[i]+1.96*se[i]).toFixed(1)} `;});
      for(let k=idx.length-1;k>=0;k--){const i=idx[k];dn+=`${X(i).toFixed(1)},${Yb(v[i]-1.96*se[i]).toFixed(1)} `;}
      svg.appendChild(el('polygon',{points:up+dn,fill:'#8aa0bb','fill-opacity':.07,stroke:'none','clip-path':`url(#${cid})`}));}}
  // Latent mode: ONE continuous cross-league line, colored per-segment by the league the player
  // was in that day (the DARKO fusion — no seam). Every other mode: one line PER league, no bridge.
  if(activeMode()==='latent'){
    for(let i=1;i<n;i++){if(v[i]==null||v[i-1]==null)continue;
      // plan45 B5: dash the connector across a >30-day cross-league gap (rookie debut / league switch
      // is information arrival, not smooth continuity) so a >1 net debut step reads as a gap, not a bug.
      const bridge=((new Date(ser[i].date)-new Date(ser[i-1].date))/864e5>30)&&ser[i].lg!==ser[i-1].lg;
      const a={x1:X(i-1).toFixed(1),y1:Y(v[i-1]).toFixed(1),x2:X(i).toFixed(1),y2:Y(v[i]).toFixed(1),
        stroke:lgColor(ser[i].lg),'stroke-width':1.8,'stroke-linecap':'round'};
      if(bridge){a['stroke-dasharray']='3,3';a['stroke-opacity']=0.5;}
      svg.appendChild(el('line',a));}
  }else{
    [...new Set(ser.map(s=>s.lg))].forEach(lg=>{
      const idx=[];for(let i=0;i<n;i++)if(ser[i].lg===lg)idx.push(i);
      if(idx.length>1)svg.appendChild(el('polyline',{points:idx.map(i=>`${X(i).toFixed(1)},${Y(v[i]).toFixed(1)}`).join(' '),
        fill:'none',stroke:lgColor(lg),'stroke-width':1.6,'stroke-linejoin':'round','stroke-linecap':'round'}));});
  }
  // ── FORWARD projection overlay (1-5yr trajectory, opt-in, ORANGE = projected, NOT measured) ──────
  // Drawn as a CONNECTED widening cone: a filled 80% band + one continuous dashed centre line + a dot
  // per horizon. PTg holds each point's geometry so the crosshair/readout can hover the future too.
  let PTg=null;
  if(PT){
    const lx=X(n-1), ly=Y(v[n-1]);                       // anchor at the live curve's last measured point
    // widening 80% CI band (a filled cone) from the anchor out through every horizon
    let up=`${lx.toFixed(1)},${ly.toFixed(1)} `, dn='';
    PT.forEach((t,h)=>{const xp=XP(h);up+=`${xp.toFixed(1)},${Y(t.val+Z80*t.se).toFixed(1)} `;});
    // lower edge back RIGHT->LEFT so the ring is anchor->top(L-R)->bottom(R-L); L->R here drew a bow-tie
    for(let h=PT.length-1;h>=0;h--){const xp=XP(h);dn+=`${xp.toFixed(1)},${Y(PT[h].val-Z80*PT[h].se).toFixed(1)} `;}
    svg.appendChild(el('polygon',{points:up+dn,fill:'var(--amber)','fill-opacity':.10,stroke:'none'}));
    // one continuous dashed centre line through the anchor and every projected point
    const mid=[`${lx.toFixed(1)},${ly.toFixed(1)}`].concat(PT.map((t,h)=>`${XP(h).toFixed(1)},${Y(t.val).toFixed(1)}`)).join(' ');
    svg.appendChild(el('polyline',{class:'projconn',points:mid}));
    // a dot + year tick at each horizon; keep the geometry for hover
    PTg=PT.map((t,h)=>{const xp=XP(h), yc=Y(t.val);
      svg.appendChild(el('circle',{class:'projdot',cx:xp,cy:yc,r:2.6}));
      if(t.season){const tk=el('text',{x:xp,y:H-4,'font-size':8,fill:'var(--amber)','text-anchor':'middle'});tk.textContent="’"+String(t.season).slice(2);svg.appendChild(tk);}
      return {x:xp, y:yc, val:t.val, se:t.se, season:t.season};});
  }
  const cross=el('line',{class:'crosshair',x1:0,y1:padT,x2:0,y2:padT+ph,visibility:'hidden'});svg.appendChild(cross);
  const dot=el('circle',{class:'hdot',r:3.2,visibility:'hidden'});svg.appendChild(dot);
  const ov=el('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});svg.appendChild(ov);
  mount.innerHTML='';mount.appendChild(svg);
  const obj={key,n,W,padL,pw,histW,futW,PTg,
    setHover(i,line){
      if(i>=n && PTg){                                   // projection-point hover (i-n = horizon 0..P-1)
        const g=PTg[i-n];
        if(!g){cross.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');return;}
        cross.setAttribute('x1',g.x);cross.setAttribute('x2',g.x);cross.setAttribute('visibility',line?'visible':'hidden');
        dot.setAttribute('cx',g.x);dot.setAttribute('cy',g.y);dot.setAttribute('fill','var(--amber)');dot.setAttribute('visibility','visible');return;}
      if(i<0||i>=n){cross.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');return;}
      cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('visibility',line?'visible':'hidden');
      dot.setAttribute('cx',X(i));dot.setAttribute('cy',Y(v[i]));dot.setAttribute('fill',lgColor(ser[i].lg));dot.setAttribute('visibility','visible');},
    valAt(i){return (i>=n&&PTg)?{v:PTg[i-n].val,se:PTg[i-n].se}:{v:v[i],se:se[i]};}};
  ov.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();
    const sx=(e.clientX-r.left)/r.width*W;
    if(PTg && sx>padL+histW+2){                          // future slice -> nearest projected horizon
      let h=Math.round((sx-(padL+histW))/futW*PTg.length-0.5);
      h=Math.max(0,Math.min(PTg.length-1,h)); setHoverAll(n+h,true);
    } else {                                             // history -> nearest measured game-day
      let i=Math.round((sx-padL)/histW*(n-1)); i=Math.max(0,Math.min(n-1,i)); setHoverAll(i,true);
    }});
  ov.addEventListener('pointerleave',()=>setHoverAll(n-1,false));  // default: last actual game
  return obj;
}

function setHoverAll(i,line){
  CHARTS.forEach(c=>c.setHover(i,line));
  const ro=document.getElementById('readout');
  const p=projFor();
  if(p&&Array.isArray(p.traj)&&i>=SER.length){          // projection-point readout (ORANGE = projected)
    const h=i-SER.length, t=p.traj[h];
    const fp=(val,sd)=>val==null?'—':`<b style="color:var(--amber)">${val>=0?'+':''}${val.toFixed(2)}</b> <span style="color:var(--faint)">±${(Z80*sd).toFixed(2)}</span>`;
    ro.innerHTML=`<span style="color:var(--amber)">projected&nbsp;</span><b style="color:var(--amber)">${t[0]}</b>`;
    document.getElementById('v_net').innerHTML=fp(t[1],t[2]);
    const fok=Array.isArray(p.traj_f)&&Array.isArray(p.traj_f_se);
    FAC.forEach(([f],k)=>{const e=document.getElementById('v_'+f);if(e)e.innerHTML=fok?fp(p.traj_f[h][k],p.traj_f_se[h][k]):'—';});
    return;
  }
  if(i<0||!SER||!SER[i]){ro.innerHTML='';document.getElementById('v_net').innerHTML='';
    FAC.forEach(([f])=>{const e=document.getElementById('v_'+f);if(e)e.innerHTML='';});return;}
  const s=SER[i];
  ro.innerHTML=`${line?'':'<span style="color:var(--faint)">latest&nbsp;</span>'}<b>${s.date}</b> · <span style="color:${LC[s.lg]}">${LNAME[s.lg]}</span>`;
  const fmt=(val,sd)=>val==null?'—':`<b>${val>=0?'+':''}${val.toFixed(2)}</b> <span style="color:var(--faint)">±${(1.96*sd).toFixed(2)}</span>`;
  document.getElementById('v_net').innerHTML=fmt(s.net,s.net_se);
  FAC.forEach(([f])=>{const e=document.getElementById('v_'+f);if(e)e.innerHTML=fmt(s[f],s[f+'_se']);});
  if(!wfPlaying&&WFDOM&&i>=0&&i<SER.length)wfRenderAt(i);   // waterfall follows the hovered game-day
}

function renderActive(){
  SER=SERIES[activeMode()]; const last=SER[SER.length-1];
  const lgset=[...new Set(SER.map(s=>s.lg))];
  const badges=['nba','gleague','college'].filter(l=>lgset.includes(l)).map(l=>`<span style="color:${LC[l]};font-weight:700">${LNAME[l]}</span>`).join(' · ');
  document.getElementById('pmeta').innerHTML=`${SER[0].date} – ${last.date} · ${badges}`;
  const p=projFor();                                 // null unless toggle ON + pid has a projection
  // Forward TRAJECTORY 1-5yr ahead (plan 25). NET chart -> {traj:[{val,se,season}...]}; factor i is the
  // same shape sliced from traj_f/traj_f_se. Falls back to the single `next` point if traj is absent.
  const trajOK=p&&Array.isArray(p.traj)&&p.traj.length>0;
  const facTrajOK=trajOK&&Array.isArray(p.traj_f)&&Array.isArray(p.traj_f_se)&&p.traj_f.length===p.traj.length&&p.traj_f[0].length===FAC.length;
  const netProj=trajOK?{traj:p.traj.map(t=>({season:t[0],val:t[1],se:t[2]}))}
               :(p?{traj:[{val:p.next[1],se:p.next[2],season:p.next[0]}]}:null);
  const facProj=i=>facTrajOK?{traj:p.traj.map((t,h)=>({season:t[0],val:p.traj_f[h][i],se:p.traj_f_se[h][i]}))}
               :(p&&Array.isArray(p.next_f)&&p.next_f.length===FAC.length?{traj:[{val:p.next_f[i],se:p.next_f_se[i],season:p.next[0]}]}:null);
  requestAnimationFrame(()=>{
    CHARTS=[Chart(document.getElementById('c_net'),SER,'net',netProj)];
    FAC.forEach(([f],i)=>CHARTS.push(Chart(document.getElementById('c_'+f),SER,f,facProj(i))));
    wfInit();                                        // (re)build the waterfall for this player/mode
    setHoverAll(SER.length-1,false);                 // default readout = most recent day (also paints the waterfall)
  });
}

function renderProfile(){

  getQuant().then(()=>{
    const lq=QUANT&&QUANT.leagues&&QUANT.leagues[lg];

      document.getElementById('radar').innerHTML='';
      document.getElementById('proflegend').innerHTML=`<span style="color:var(--box)">No quantile reference for ${LNAME[lg]||lg}.</span> Percentile bars hidden for this league.`;

    const wrap=document.createElement('div'); wrap.className='barwrap'; wrap.appendChild(RC.pctBar(v,pct,RC.redGreen(pct),f+' '+LNAME[lg]));
    const pl=document.createElement('span'); pl.className='pctlab'; pl.textContent=Math.round(pct*100)+'%';

}

let MULTI=null;   // [{id,name,ser,net,se}]
function loadMulti(ids){
  Promise.all(ids.map(id=>fetch('data/'+id+'.json').then(r=>r.ok?r.json():null).catch(()=>null)))
    .then(arr=>{
      MULTI=arr.map((d,k)=>d?{id:ids[k],name:d.name||ids[k],ser:prep(d),color:OKABE[k%OKABE.length],
                              net:d.net[d.net.length-1],se:d.net_se[d.net_se.length-1]||0.3}:null)
               .filter(Boolean);
      if(MULTI.length<2){if(MULTI.length===1){const m=MULTI[0];MULTI=null;load(m.id,m.name);}return;}
      history.replaceState(null,'','?p='+MULTI.map(m=>m.id).join(','));
      CMP=MULTI.map(m=>({id:m.id,name:m.name}));

let MCHARTS=[], MDATES=[];
function renderMulti(){
  const set=new Set();MULTI.forEach(m=>m.ser.forEach(s=>set.add(s.date)));
  MDATES=[...set].sort();
  MULTI.forEach(m=>{m.map={};m.ser.forEach(s=>m.map[s.date]=s);});

function ChartMulti(mount,key){
  const W=mount.clientWidth||320, H=mount===document.getElementById('c_net')?190:150;
  const padL=30,padR=7,padT=8,padB=15, pw=W-padL-padR, ph=H-padT-padB;
  const n=MDATES.length;
  let pool=[];MULTI.forEach(m=>MDATES.forEach(d=>{const s=m.map[d];if(s&&s[key]!=null)pool.push(s[key]);}));
  let lo=Math.min(...pool), hi=Math.max(...pool), c=(lo+hi)/2, half=Math.max((hi-lo)/2*1.06,0.15);
  const ymin=c-half, ymax=c+half;
  const X=i=>padL+(n>1?i/(n-1):.5)*pw;
  const Y=val=>padT+ph-(Math.max(ymin,Math.min(ymax,val))-ymin)/(ymax-ymin)*ph;
  const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  [0,.5,1].forEach(f=>{const yv=ymin+(ymax-ymin)*f, y=Y(yv);
    svg.appendChild(el('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=el('text',{x:padL-4,y:y+3,'font-size':9,fill:'var(--faint)','text-anchor':'end'});t.textContent=(yv>=0?'+':'')+yv.toFixed(1);svg.appendChild(t);});
  if(ymin<0&&ymax>0){const y=Y(0);svg.appendChild(el('line',{x1:padL,y1:y,x2:W-padR,y2:y,stroke:'var(--zero)','stroke-width':1}));}
  let py=MDATES[0].slice(0,4);
  for(let i=1;i<n;i++){const yr=MDATES[i].slice(0,4);if(yr!==py){
    svg.appendChild(el('line',{x1:X(i),y1:padT,x2:X(i),y2:padT+ph,stroke:'var(--line-2)','stroke-width':1}));
    const t=el('text',{x:X(i),y:H-4,'font-size':8.5,fill:'var(--faint)','text-anchor':'middle'});t.textContent="’"+yr.slice(2);svg.appendChild(t);py=yr;}}
  // Draw each player's OWN consecutive points (break only on a league change). Players are
  // downsampled independently, so their absolute dates rarely align — iterating the union and
  // flushing on every interleaved date shattered each line into invisible 1-point segments.
  // Connecting a player's own points (skipping union indices another player owns) keeps it whole.
  MULTI.forEach(m=>{let seg=[],lastLg=null;
    const flush=()=>{if(seg.length>1)svg.appendChild(el('polyline',{points:seg.join(' '),fill:'none',stroke:m.color,'stroke-width':1.6,'stroke-linejoin':'round','stroke-linecap':'round'}));seg=[];};
    for(let i=0;i<n;i++){const s=m.map[MDATES[i]];if(!s||s[key]==null)continue;
      if(lastLg!==null&&s.lg!==lastLg)flush();
      seg.push(`${X(i).toFixed(1)},${Y(s[key]).toFixed(1)}`);lastLg=s.lg;}
    flush();});
  const cross=el('line',{class:'crosshair',x1:0,y1:padT,x2:0,y2:padT+ph,visibility:'hidden'});svg.appendChild(cross);
  const dots=MULTI.map(()=>{const c=el('circle',{class:'hdot',r:3.2,visibility:'hidden'});svg.appendChild(c);return c;});
  const ov=el('rect',{x:0,y:0,width:W,height:H,fill:'transparent'});svg.appendChild(ov);
  mount.innerHTML='';mount.appendChild(svg);
  // each player's last union-index with a value for this key (the default "latest" marker)
  const lastIdx=MULTI.map(m=>{for(let i=n-1;i>=0;i--){const s=m.map[MDATES[i]];if(s&&s[key]!=null)return i;}return -1;});
  const showDot=(k,i)=>{const s=m_at(k,i);if(s&&s[key]!=null){dots[k].setAttribute('cx',X(i));dots[k].setAttribute('cy',Y(s[key]));dots[k].setAttribute('fill',MULTI[k].color);dots[k].setAttribute('visibility','visible');}else dots[k].setAttribute('visibility','hidden');};
  const m_at=(k,i)=>MULTI[k].map[MDATES[i]];
  const obj={key,n,setHover(i,line){
    if(line){
      if(i<0||i>=n){cross.setAttribute('visibility','hidden');dots.forEach(d=>d.setAttribute('visibility','hidden'));return;}
      cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('visibility','visible');
      MULTI.forEach((m,k)=>showDot(k,i));
    }else{                                    // default: each player's OWN latest point (not one shared date)
      cross.setAttribute('visibility','hidden');
      MULTI.forEach((m,k)=>{lastIdx[k]<0?dots[k].setAttribute('visibility','hidden'):showDot(k,lastIdx[k]);});
    }}};
  ov.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*W;let i=Math.round((sx-padL)/pw*(n-1));i=Math.max(0,Math.min(n-1,i));setHoverMulti(i,true);});
  ov.addEventListener('pointerleave',()=>setHoverMulti(n-1,false));
  return obj;
}
function setHoverMulti(i,line){
  MCHARTS.forEach(c=>c.setHover(i,line));
  const lastVal=(m,key)=>{for(let j=m.ser.length-1;j>=0;j--){if(m.ser[j][key]!=null)return m.ser[j][key];}return null;};
  const swatch=m=>`<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${m.color};margin-right:3px;vertical-align:middle"></span>`;
  const put=(id,key,fn)=>{const e=document.getElementById(id);if(!e)return;
    e.innerHTML=MULTI.map(m=>{const v=fn(m,key);
      return `<span style="color:${m.color}">${v==null?'—':(v>=0?'+':'')+v.toFixed(2)}</span>`;}).join(' ');};
  if(line){                                              // hover: snap to one shared date
    const date=MDATES[i];
    document.getElementById('readout').innerHTML=`<b>${date}</b>`;
    const at=(m,key)=>{const s=m.map[date];return s?s[key]:null;};
    put('v_net','net',at); FAC.forEach(([f])=>put('vm_'+f,f,at));
  }else{                                                 // default: each player's OWN latest
    document.getElementById('readout').innerHTML='<span style="color:var(--faint)">latest per player&nbsp;</span>'+MULTI.map(m=>swatch(m)+m.name).join(' · ');
    put('v_net','net',lastVal); FAC.forEach(([f])=>put('vm_'+f,f,lastVal));
  }
}

// ===== Impact waterfall (6 factors → off/def; Play morphs continuously across game-days) ==========
// Renders the active-mode daily series (SER) as two waterfalls. It follows the line-chart hover, and
// Play sweeps a single fractional position 0→last in one rAF loop, interpolating factors between the
// two bracketing game-days — so the bars morph continuously with no per-step holds.
const WF_OFF=['oTS','oTOV','oSC'], WF_DEF=['dTS','dTOV','dSC'];
let WFDOM=null, wfPlaying=false, wfRAF=null, wfStart=0, wfPos=0, wfSweepMs=12000;
const wfSign=v=>(v>=0?'+':'')+v.toFixed(2);
const wfCls=v=>Math.abs(v)<0.005?'zero':(v>0?'pos':'neg');

// stable y-domain per side across the whole series, so bars don't rescale during a sweep
function wfComputeDomain(ser){
  const dom={off:{min:0,max:0},def:{min:0,max:0}};
  for(const s of ser){
    for(const[side,facs]of[['off',WF_OFF],['def',WF_DEF]]){
      let run=0;for(const f of facs){run+=s[f]||0;if(run<dom[side].min)dom[side].min=run;if(run>dom[side].max)dom[side].max=run;}
    }
  }
  for(const side of['off','def']){
    let{min,max}=dom[side];
    if(max-min<1){const mid=(max+min)/2;min=mid-0.5;max=mid+0.5;}
    const pad=Math.max(0.25,(max-min)*0.12);dom[side]={min:min-pad,max:max+pad};
  }
  return dom;
}
function wfInterp(i0,i1,t){const a=SER[i0],b=SER[i1]||a,r={};
  for(const f of[...WF_OFF,...WF_DEF])r[f]=(a[f]||0)+(((b[f]||0)-(a[f]||0)))*t;return r;}

function wfSvg(row,facs,title,dom){
  const W=560,H=232,m={t:40,r:14,b:22,l:36},pw=W-m.l-m.r,ph=H-m.t-m.b;
  const steps=facs.map(f=>({label:f,value:row[f]||0}));
  const total=steps.reduce((a,s)=>a+s.value,0), rng=dom.max-dom.min, Y=v=>m.t+(dom.max-v)/rng*ph;
  const count=steps.length+1, slot=pw/count, bw=Math.min(56,slot*0.5), cx=i=>m.l+slot*i+slot/2;
  let ticks='';
  for(let k=0;k<5;k++){const tv=dom.min+rng*k/4,yy=Y(tv);
    ticks+=`<line class="wfg" x1="${m.l}" x2="${W-m.r}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"/><text class="wft" x="${m.l-6}" y="${(yy+3).toFixed(1)}" text-anchor="end">${tv.toFixed(1)}</text>`;}
  const drawBar=(x,v,cls,extra)=>{const y0=Y(0+(extra?extra.base:0)),y1=Y((extra?extra.base:0)+v);
    const h=Math.max(2.5,Math.abs(y1-y0)),ry=Math.abs(y1-y0)<2.5?y1-h/2:Math.min(y0,y1);
    const labY=v>=0?Math.max(13,ry-8):Math.min(H-m.b-2,ry+h+14);
    return`<g><rect class="wfb ${extra&&extra.tot?'tot ':''}${cls}" x="${(x-bw/2).toFixed(1)}" y="${ry.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="3"><title>${extra&&extra.name||''} ${wfSign(v)}</title></rect>`
      +`<text class="wfv ${cls}" x="${x.toFixed(1)}" y="${labY.toFixed(1)}" text-anchor="middle">${wfSign(v)}</text></g>`;};
  let run=0,bars='',trace=[`${cx(0).toFixed(1)},${Y(0).toFixed(1)}`];
  steps.forEach((s,i)=>{const x=cx(i);
    bars+=drawBar(x,s.value,wfCls(s.value),{base:run,name:s.label})
      +`<text class="wfl" x="${x.toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle">${s.label}</text>`;
    run+=s.value;trace.push(`${x.toFixed(1)},${Y(run).toFixed(1)}`);});
  const tx=cx(steps.length);
  bars+=drawBar(tx,total,wfCls(total),{base:0,tot:1,name:title})
    +`<text class="wfl" x="${tx.toFixed(1)}" y="${(H-8).toFixed(1)}" text-anchor="middle">${title}</text>`;
  const zeroY=Y(0);
  return`<svg class="wfsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${ticks}`
    +`<line class="wfax" x1="${m.l}" x2="${W-m.r}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}"/>`
    +`<polyline class="wftr" points="${trace.join(' ')}"/>${bars}</svg>`;
}
function wfRenderAt(pos){
  if(!SER||!SER.length||!WFDOM)return;
  const n=SER.length;pos=Math.max(0,Math.min(n-1,pos));
  const i0=Math.floor(pos),i1=Math.min(n-1,Math.ceil(pos)),t=pos-i0;
  const row=t===0?SER[i0]:wfInterp(i0,i1,t);
  const off=WF_OFF.reduce((a,f)=>a+(row[f]||0),0), def=WF_DEF.reduce((a,f)=>a+(row[f]||0),0), net=off+def;
  document.getElementById('wfstack').innerHTML=
    `<div class="wfchart"><div class="wfhd"><span>OFFENSE</span><span class="${wfCls(off)}">${wfSign(off)}</span></div>${wfSvg(row,WF_OFF,'Off',WFDOM.off)}</div>`
   +`<div class="wfchart"><div class="wfhd"><span>DEFENSE</span><span class="${wfCls(def)}">${wfSign(def)}</span></div>${wfSvg(row,WF_DEF,'Def',WFDOM.def)}</div>`;
  const s=SER[Math.round(pos)];
  document.getElementById('wfsum').innerHTML=
    `<b>${s.date}</b> · <span style="color:${LC[s.lg]}">${LNAME[s.lg]}</span> · `
   +`<span class="${wfCls(off)}">Off ${wfSign(off)}</span> · <span class="${wfCls(def)}">Def ${wfSign(def)}</span> → <span class="${wfCls(net)}">Net ${wfSign(net)}</span>`;
  const sc=document.getElementById('wfscrub');if(sc&&document.activeElement!==sc)sc.value=String(Math.round(pos));
}
function wfSetBtn(p){const b=document.getElementById('wfplay');if(b){b.textContent=p?'❚❚ Pause':'▶ Play';b.classList.toggle('active',p);}}
function wfStop(){wfPlaying=false;if(wfRAF)cancelAnimationFrame(wfRAF);wfRAF=null;wfSetBtn(false);}
function wfLoop(now){
  if(!wfPlaying)return;
  const n=SER.length, frac=Math.min(1,(now-wfStart)/wfSweepMs);
  wfPos=frac*(n-1);
  wfRenderAt(wfPos);
  setHoverAll(Math.round(wfPos),true);       // sweep the line-chart crosshair + readout in sync
  if(frac<1){wfRAF=requestAnimationFrame(wfLoop);}
  else{wfStop();wfPos=n-1;setHoverAll(n-1,false);}  // settle on the latest day
}
function wfPlay(){
  if(!SER||SER.length<2)return;
  if(wfPlaying){wfStop();return;}
  const n=SER.length;
  if(wfPos>=n-1)wfPos=0;                       // restart from the top if parked at the end
  wfSweepMs=Math.max(6000,Math.min(16000,n*8));
  wfPlaying=true;wfSetBtn(true);
  wfStart=performance.now()-(wfPos/(n-1))*wfSweepMs;
  wfRAF=requestAnimationFrame(wfLoop);
}
function wfInit(){                             // called from renderActive (single-player); setHoverAll paints it
  const wf=document.getElementById('waterfall');
  wfStop();
  if(!SER||!SER.length){wf.style.display='none';return;}
  wf.style.display='block';
  WFDOM=wfComputeDomain(SER);
  wfPos=SER.length-1;
  const sc=document.getElementById('wfscrub');if(sc){sc.max=String(SER.length-1);sc.value=String(wfPos);}
}
document.getElementById('wfplay').addEventListener('click',wfPlay);
document.getElementById('wfscrub').addEventListener('input',e=>{
  wfStop();const i=Math.max(0,Math.min((SER?SER.length:1)-1,Math.round(Number(e.target.value)||0)));
  wfPos=i;setHoverAll(i,true);
});

</script>
</body></html>
