<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorer · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* ── page-unique CSS only (tokens/nav/search/grid/cell/seg live in site.css) ── */
  #player{display:none;margin-top:20px}
  .phead{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:11px}
  .pname{font-size:var(--fs-6);font-weight:700;letter-spacing:-.5px}
  /* ── player card (headshot + name + age + per-game box line) — Explorer-only ── */
  /* align-items:stretch, not center: the headshot spans the full height of the two-row body, so its
     top edge is flush with the name and its bottom with the shooting line. Centering left it
     floating against a body it no longer matched (owner 2026-07-26: "should be flush"). */
  .pcard{display:none;gap:var(--sp-4);align-items:stretch;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r-2);padding:var(--sp-3) var(--sp-4);margin-bottom:14px}
  /* Height comes from `stretch` so the image is flush with both rows; the width is FIXED at the
     height those two rows come to (100px, measured), which makes it square.
     ponytail: the 100 is a hand-matched constant, not derived. CEILING, stated plainly: change the
     type scale or the row gap and the headshot goes slightly off-square -- object-fit:cover keeps
     it looking right, it just stops being a perfect square. aspect-ratio:1 was tried first and does
     NOT work here: on a flex item with width:auto the flex algorithm sizes from content, so the
     monogram collapsed to the width of the two letters. */
  .pc-face,.pc-mono{width:100px;flex:0 0 100px;align-self:stretch;border-radius:var(--r-2);
    background:var(--panel-3);border:1px solid var(--line)}
  .pc-body{min-height:76px}
  .pc-face{object-fit:cover;object-position:top}
  .pc-mono{display:flex;align-items:center;justify-content:center;font-family:var(--font);
    font-weight:700;font-size:27px;color:var(--muted);letter-spacing:.5px}
  /* WHERE THE NAME->SUB GAP ACTUALLY COMES FROM (owner 2026-07-28: "reduce it"). It measured
     21.89px at desktop, and only 2px of that was this rule's gap. 18.39px was the PTS/REB/AST
     stat group's SECOND line -- the uppercase .pc-lab -- hanging below the baseline the name is
     aligned to inside row 1, and 1.50px was row 2's own baseline alignment. So the levers are
     down there, not here: .pc-lab's line-height (it inherited 1.5 from site.css, i.e. 17.25px of
     box for an 11.5px glyph) and .pc-cell's internal gap. Those three together take it to ~13px
     without moving the two stat groups, which the comments below say were deliberately placed. */
  .pc-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:0}
  /* one text line on the left, its stat group on the right, baselines shared */
  .pc-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-5)}
  .pc-name{font-size:var(--fs-6);font-weight:700;letter-spacing:-.5px;line-height:1.08}
  .pc-sub{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:var(--fs-2);
    color:var(--muted)}
  .pc-sub .pos{font-weight:700;color:var(--text);letter-spacing:.02em}
  .pc-sub .tm{color:var(--text)}   /* team reads as identity, like the position, not as metadata */
  /* The two stat groups sit at the right end of their own row, so the ragged-length rows still share
     one flush right edge. `.pc-cell:last-child{padding-right:0}` is what lands that edge — do not
     give the last cell its padding back. */
  .pc-group{display:flex;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .pc-cell{display:flex;flex-direction:column;gap:0;padding:0 11px;border-right:1px solid var(--line)}
  .pc-cell:first-child{padding-left:0}.pc-cell:last-child{border-right:none;padding-right:0}
  .pc-val{font-size:var(--fs-3);font-weight:600;color:var(--text)}
  /* line-height:1 is load-bearing, not cosmetic: this is the box that sets how far row 1 hangs
     below the name's baseline, and therefore most of the name->sub gap. See .pc-body above. */
  .pc-lab{font-size:11.5px;line-height:1;letter-spacing:.08em;color:var(--faint);text-transform:uppercase}
  .pc-shoot .pc-val{color:var(--muted)}
  /* The paired rows are a desktop affordance and do not survive the phone: under the 60px headshot
     the body is ~239px wide at 375px (~184px at 320px) against ~256px of counting cells, so a row
     holding the name AND five stats would clip. Below 520px each row breaks in two and everything
     falls back to a LEFT edge — a ragged right beats a clipped one. */
  @media(max-width:520px){.pcard{align-items:flex-start}.pc-name{font-size:var(--fs-5)}
    .pc-face,.pc-mono{width:60px;height:60px;flex:0 0 60px;align-self:flex-start}
    .pc-row{flex-direction:column;align-items:flex-start;gap:var(--sp-1)}
    .pc-cell{padding:0 8px}
    .pc-group{flex-wrap:wrap;row-gap:6px}}
  .pmeta{color:var(--muted);font-size:var(--fs-2)}
  .readout{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:150px;text-align:left}
  .readout b{color:var(--text)}
  .modehint{font-size:13px;color:var(--faint);margin:7px 0 -4px;line-height:1.55;max-width:840px}
  /* bespoke interactive crosshair charts (owned locally).
     .crosshair is NOT redeclared here. It used to be, as `stroke:#3a4862`, and because this
     <style> follows the site.css <link> the local copy WON — which quietly killed the themed fix
     site.css:244-248 documents. That hairline measures 9.20 against the light --panel but 2.01
     against the dark one, so on the DEFAULT theme the affordance that tells you which date you are
     reading sat under the 3:1 mark floor. site.css's var(--faint) lands at 5.5 light / 5.1 dark.
     .hdot is kept local because the charts here own the hover dot's geometry. */
  .hdot{pointer-events:none;stroke:var(--bg);stroke-width:1.2}
  .grid svg,.netcard svg{touch-action:none}
  /* ── cursor tooltip on the crosshair ──────────────────────────────────────────────────────────
     The crosshair and the hover dots already existed; what did not was a readout AT the pointer, so
     reading a value meant looking away from the day you were pointing at, up to the panel header.
     ONE node, position:fixed, reused by whichever chart the pointer is over: the bubble belongs to
     the pointer, not to a panel, and a fixed node cannot be clipped by a panel's radius or overflow.
     pointer-events:none so it can never swallow the pointermove that drives it. */
  #ctip{position:fixed;left:0;top:0;z-index:70;display:none;pointer-events:none;white-space:nowrap;
    border:1px solid var(--line);border-radius:var(--r-1);padding:6px 8px;
    box-shadow:0 6px 18px rgba(0,0,0,.45)}
  /* The SURFACE is theme-split on purpose and the reason is measurable. The swatches are MARKS
     (3:1 floor) and the binding one is light --off #0e9e8c: 3.34:1 on --panel (#ffffff) but 2.99 on
     --panel-2 and 2.78 on --panel-3 — so in LIGHT this bubble cannot reuse [data-tip]'s --panel-2
     surface without putting a swatch under the floor. DARK has the opposite problem: it floats over
     .cell/--panel, and --panel-2 sits 1.02:1 against that (no visible step at all), so it takes
     --panel-3 at 1.10 and lifts.
     RE-MEASURED after the swatches became live tokens (see tipShow), by sampling the RENDERED PNG
     at 1280 — the swatch pixel and the modal bubble-interior pixel, both themes, single-row bubble
     on ?p=c4896963's oTS cell: LIGHT surface (255,255,255), swatch --off (14,158,140) = 3.34:1;
     DARK surface (20,30,43) = --panel-3, swatch --off (45,212,191) = 9.02:1. Text on the same
     samples: value ink 17.80:1 light / 14.37:1 dark, and the weakest, the ± qualifier in --faint,
     5.52:1 light / 4.60:1 dark. Over 3:1 for marks and 4.5:1 for text in both themes.
     SCOPE, HONESTLY. Those numbers cover the LEAGUE and SIDE swatches, which are tokens. They do
     NOT cover the COMPARE view, whose swatches are the Okabe-Ito slots — theme-independent
     literals, baked identically into the polyline they label. Pixel-sampled on the same rig
     (?p=203999,1630169,201939,1628369, light): #0072B2 (0,114,178) 5.19:1, #CC79A7 (204,121,167)
     3.06:1, and #E69F00 (230,159,0) 2.25:1 — that last one is UNDER the 3:1 mark floor on the light
     bubble. It is under it on every light surface on the site, not just here, because the palette
     is chosen for dichromat SEPARATION rather than for luminance against white, and it paints the
     compare LINES too; nothing this tooltip can do fixes it without moving the palette everywhere.
     What keeps it honest meanwhile is that the compare bubble is the one place colour is never the
     sole encoder — every row prints the player's NAME beside the swatch at 5.52:1. Recorded as a
     palette decision for the owner, not papered over here with a border. */
  #ctip{background:var(--panel-3)}
  :root[data-theme=light] #ctip{background:var(--panel);box-shadow:0 6px 18px rgba(14,24,40,.16)}
  #ctip .d{font-size:var(--fs-1);color:var(--muted);margin-bottom:4px}
  /* LOCKUP, not space-between. The rows used to be independent flex lines with `margin-left:auto`
     on the number, which pinned every value to the bubble's right edge — so in a 4-way compare the
     numbers sat a variable distance from the name they belong to and did not line up with each
     other. One grid for ALL rows fixes both at once: the four columns are sized once, so the label
     column is as wide as the longest label and every number starts at the same x. The gap after
     the label is the grid's own 7px (the same 7px the swatch gets), which is a lockup gap, and the
     number still outranks its label by weight and colour. */
  #ctip .rows{display:grid;grid-template-columns:9px minmax(0,max-content) max-content max-content;
    align-items:center;gap:2px 7px;
    font-family:var(--font-mono);font-size:var(--fs-2);font-variant-numeric:tabular-nums;line-height:1.5}
  #ctip .sw{width:9px;height:9px;border-radius:2px}
  /* the compare view puts full player names in here, so the label truncates and the number does not */
  #ctip .k{color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:150px}
  #ctip .n{color:var(--text);font-weight:600;text-align:right}
  #ctip .e{color:var(--faint)}
  /* add-to-compare affordance in the player header */
  .cmpadd{font-size:13.5px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    padding:5px 11px;cursor:pointer;border-radius:var(--r-1)}
  .cmpadd:hover{color:var(--text);border-color:var(--accent)}
  .cmptray{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
  .cmptray .seglab{align-self:center}
  .cmpchip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    padding:4px 9px;font-size:13.5px;border-radius:var(--r-1)}
  .cmpchip .sw{width:10px;height:10px;border-radius:2px}
  .cmpchip .x{cursor:pointer;color:var(--muted);font-weight:700;margin-left:1px}
  .cmpchip .x:hover{color:var(--neg)}
  .cmpgo{font-size:13.5px;font-weight:700;color:var(--accent-ink);background:var(--accent);border:none;
    padding:5px 12px;cursor:pointer;border-radius:var(--r-1)}
  .cmpgo:disabled{opacity:.4;cursor:not-allowed}
  /* ── production profile section ── */
  #profile{display:none;margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
  .barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
  .barrow .lab{width:58px;font-size:14.5px;font-weight:700;color:#cdd9e6;font-variant-numeric:tabular-nums}
  :root[data-theme=light] .barrow .lab{color:#33425a}
  .barrow .val{width:70px;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
  .barrow .pctlab{width:48px;font-size:13.5px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
  .barwrap{flex:1;min-width:120px}
  /* two balanced columns: percentile bars (left) + radar (right), both top-aligned (align-items:start) */
  .profcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px 30px;align-items:start}
  /* Owner 2026-07-26: keep the radar INSIDE the vertical run of the six percentile bars.
     RC.radar() draws a square viewBox and site.css sets svg{width:100%;height:auto}, so the
     rendered height IS this max-width. Left column measures ~300px at 1040: two .sectitle blocks
     (21px line + collapsed 22px/8px margins) + six .barrow rows (20.25px + 7px margins) + the
     ~19px legend line. The "Profile shape" title above the radar eats 21+8 = 29px, leaving 271px
     — capped at 270 (was 330). This is a LAYOUT cap only: the viewBox is untouched, and
     RC.radar() is shared with the team pages, so nothing there moves. */
  .radarwrap{max-width:270px;margin:0 auto;width:100%}
  /* The radar's factor labels are sized in viewBox units, so the 270/320 = 0.84 scale would have
     shrunk them from 11.9px to 9.7px rendered. 14 units x 0.84 = 11.8px — same as before the cap. */
  #radar svg text{font-size:14px}
  /* plan49 W1: 3x2 grid — offence DOWN column 1 (oTS,oTOV,oSC), defence DOWN column 2.
     Column flow + the FIXED FAC insertion order at :471-473 does this with no JS change.
     Do NOT reorder FAC to get here: facProj(i) indexes traj_f[h][i] POSITIONALLY. */
  #grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,auto);grid-auto-flow:column}
  @media(max-width:640px){#grid{grid-template-columns:1fr;grid-auto-flow:row}}
  /* ── atoms expanded ────────────────────────────────────────────────────────────────────────
     Drilling into oTS/dTS gives that one factor the whole grid and takes the other five off
     screen. The point is width: seven component charts across a 493px half-cell are 150px each,
     which is where the year labels had to be hidden. Across the full 996px they are ~240px.
     grid-template-rows is overridden to `auto` because the 3-row template would otherwise hold
     two empty rows open under the expanded cell. */
  #grid.atoms-open>.cell{display:none}
  #grid.atoms-open>.cell.atom-open{display:block;grid-column:1/-1}
  #grid.atoms-open{grid-template-rows:auto}
  /* The morph itself. 260ms is long enough to read as motion and short enough not to sit in the
     way of a second click; the five leaving cells fade a touch faster than the survivor grows. */
  ::view-transition-old(root),::view-transition-new(root){animation-duration:260ms}
  @media(prefers-reduced-motion:reduce){
    ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  }
  /* plan49 W1: in the SIX FACTOR charts the LINE colour encodes SIDE, not league (owner's ask).
     Teal is the existing --amp token. Measured with a Vienot dichromat sim + dE76:
     teal/violet separate at dE 51.8 deuteranopia / 68.0 protanopia, and both sit >64 from
     --amber, the projection overlay drawn on the same chart. Accepted cost, stated plainly:
     violet collapses onto --nba under deuteranopia (dE 3.2). Every hue at usable lightness does
     — the palette already spends blue/orange/rose on leagues. It is tolerable here only because
     the factor charts no longer draw league colour at all, so there is nothing to confuse it
     WITH inside the grid; the net chart above is a separate panel and keeps league colour. */
  :root{--off:#2dd4bf;--def:#a78bfa}
  :root[data-theme=light]{--off:#0e9e8c;--def:#7c3aed}
  .swoff{color:var(--off);font-weight:700}.swdef{color:var(--def);font-weight:700}
  /* plan49 W2: the net card's title row now carries THREE controls (off/def, projection, readout).
     Measured at 375px: adding #odseg pushed documentElement.scrollWidth to 447 against a 375
     clientWidth — a real horizontal page scroll. The shared `.ctitle` rule in site.css is a nowrap
     flex row (cited by SELECTOR, never by line number — that file is edited under us), so let this
     ONE row (and the control group inside it) wrap instead. Scoped to .netcard so the six factor
     cells keep their single-line titles. */
  .netcard .ctitle{flex-wrap:wrap;row-gap:6px}
  .netcard .ctitle>span{flex-wrap:wrap;max-width:100%}
  /* Owner 2026-07-26: the six factor headers (oTS/oTOV/oSC/dTS/dTOV/dSC) read too small. Label
     12.5px -> 15.5px (+24%, and now ON the --fs-* scale instead of off it). Raising the label to
     15.5 crosses the old 15px number, so the number moves with it (15 -> 18) to keep the site.css
     lockup rule intact: the NUMBER outranks its label. Settled ratio 18/15.5 = 1.16 (was 1.20).
     The trailing ±SE / O-D split stays a qualifier at 13px = 0.72 of the number (was 0.77).
     Scoped to #player so this can only ever touch the Explorer — .ctitle is a shared site.css
     component and other pages' panels must keep the 12.5/15 default. Applies to the net card too,
     which is the same lockup; measured at 1040 the net title row is 876px of 980px available and
     still does not wrap. */
  #player .ctitle{font-size:var(--fs-4)}
  #player .ctitle .v{font-size:var(--fs-4)}
  #player .ctitle .v b ~ span{font-size:var(--fs-2)}
  /* A DELIBERATE LOOK, NOT AN OVERFLOW GUARD. The single-line decision above was settled on the
     single-player readout, which holds one number; a 4-way compare puts four in the same .v.
     Below the grid's 1-column breakpoint that reads as a cramped label+numbers run, so the numbers
     are allowed to drop under their label. Nothing overflows without this rule — an earlier version
     of this comment claimed a 375px page scroll and it does not reproduce. Do not re-justify it as
     a scroll fix; delete it if the wrapped look is ever unwanted. */
  @media(max-width:640px){#player .ctitle{flex-wrap:wrap;row-gap:2px}}
  /* plan49 W3: TS -> atom drill-down. The panel lives INSIDE the .cell so the 3x2 column-flow
     grid keeps working — the cell simply grows and its column reflows. minmax(0,1fr) is a cheap
     guard against a grid item refusing to shrink below its content, NOT a fix for an observed
     bug: measured at 1280, plain `repeat(3,1fr)` yields the identical 151px tracks and the same
     scrollWidth 1280 == clientWidth. Kept because it costs one token; do not cite it as a fix. */
  .drill{font:inherit;font-size:12px;font-weight:600;letter-spacing:.02em;margin-left:6px;
    padding:1px 6px;border:1px solid var(--line);border-radius:999px;background:none;
    color:var(--faint);cursor:pointer;vertical-align:middle}
  .drill:hover{color:var(--text);border-color:var(--faint)}
  .drill.on{color:var(--bg);background:var(--faint);border-color:var(--faint)}
  .atompanel{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
  .atomnote{font-size:13px;line-height:1.5;color:var(--faint);margin-bottom:8px}
  .atomgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 12px}
  @media(max-width:640px){.atomgrid{grid-template-columns:minmax(0,1fr)}}
  .atitle{display:flex;align-items:baseline;gap:7px;
    font-size:13px;color:var(--faint);margin-bottom:3px}
  .atitle .v{font-variant-numeric:tabular-nums;color:var(--text)}
  /* At 151px wide an 11-season career puts Chart()'s year ticks 6.7px apart with 15.3px labels —
     measured overlap, unreadable. Hide the LABELS only; the year GRIDLINES stay, and the parent
     TS chart sits directly above on the identical x-axis with its years legible (25.8px apart).
     Selector targets middle-anchored text, which in Chart() is the year tick and the projection
     season tick; atom charts are built with proj=null, so only year ticks can match here.
     ponytail: CSS instead of a `noYearLabels` flag threaded through Chart(). CEILING, stated
     plainly: nothing enforces this coupling — if Chart() ever draws another middle-anchored
     label, or these panels are ever given a projection, it disappears here silently.
     Scoped to the 3-up layout: at <=640px the panel is single-column (331px wide at a 375px
     viewport), the ticks are ~4x further apart and the labels are legible, so they stay. */
  @media(min-width:641px){.atomcell svg text[text-anchor="middle"]{display:none}}
  /* forward projection overlay (opt-in, ORANGE = projected, NOT measured) — 1-5yr trajectory, drawn on each chart */
  .projconn{stroke:var(--amber);stroke-width:1.4;fill:none;stroke-dasharray:4 2;stroke-linejoin:round;stroke-linecap:round;opacity:.65}
  .projci{stroke:var(--amber);stroke-width:1.6;stroke-linecap:butt}
  .projcap{stroke:var(--amber);stroke-width:1.6;stroke-linecap:round}
  /* ── impact waterfall (6 factors → off/def; continuous play across game-days) ── */
  #waterfall{display:none;margin-top:24px;border-top:1px solid var(--line);padding-top:6px}
  .wfbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 5px}
  .wfscrub{flex:1;min-width:130px;accent-color:var(--accent)}
  .wfsum{font-family:var(--font-mono);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin:0 0 4px}
  .wfsum b{color:var(--text)}
  .wfstack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.wfstack{grid-template-columns:1fr}}
  .wfchart{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-1);padding:6px 9px 3px}
  .wfhd{display:flex;align-items:baseline;gap:9px;font-size:12.5px;font-weight:700;
    color:#aebccd;letter-spacing:.16em;padding:1px 2px 2px}
  :root[data-theme=light] .wfhd{color:#33425a}
  .wfsvg{width:100%;height:auto}
  .wfg{stroke:var(--grid);stroke-width:1}
  .wft{fill:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .wfax{stroke:var(--zero);stroke-width:1}
  .wftr{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4;opacity:.5}
  .wfb.pos{fill:var(--pos);opacity:.9}.wfb.neg{fill:var(--neg);opacity:.9}.wfb.zero{fill:var(--zero);opacity:.6}
  .wfb.tot.pos{fill:var(--pos);opacity:1}.wfb.tot.neg{fill:var(--neg);opacity:1}
  .wfl{fill:var(--muted);font-size:13px;font-weight:700}
  .wfv{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .wfv.pos{fill:var(--pos)}.wfv.neg{fill:var(--neg)}.wfv.zero{fill:var(--muted)}
</style></head>
<body>
<nav id="topnav" data-active="explorer"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1 style="margin-top:6px">Six-factor RAPM, <b>every game-day</b></h1>
  <p class="sub">For any NCAA, G-League or NBA player, on every game-day.</p>
  <div class="searchbox">
    <input id="q" autocomplete="off" placeholder="Search a player…  (e.g. LeBron James, Cooper Flagg)">
    <div class="drop" id="drop"></div>
  </div>
  <div class="cmptray" id="suggest"></div>

  <div id="player">
    <div class="pcard" id="pcard"></div>
    <div class="phead">
      <span class="pname" id="pname"></span>
      <span class="pmeta" id="pmeta"></span>
      <span class="readout" id="readout"></span>
      <div id="modeseg" class="seg" style="margin-left:auto;display:none">
        <button data-mode="pure" type="button">Pure RAPM</button>
        <button data-mode="prior" type="button">Prior-informed</button>
        <button data-mode="box" type="button">Box prior</button>
