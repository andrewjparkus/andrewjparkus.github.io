    + switcherHTML('head') + '</div>';
  // The only caveat this page cannot drop: nothing here has happened yet. One sentence, above the
  // fold, next to the "2026-27 projected" badge.
  html += '<p class="sub">A forward projection, not a measured result. '
    + 'See all 30 teams in the <a href="projection.html">2026-27 standings</a>.</p>';

  html += '<div class="dash">';

  // ---- PANEL 1 · hero: projected wins + the win distribution --------------
  // The distribution used to be printed as the string "14-45" — the richest thing in the feed,
  // rendered as text. It is now the shape it always was.
  // FENCE: these five quantiles come from THIS feed. projection_2026_27_distribution.json carries
  // an 83-bin win_hist per team, but it is a DIFFERENT Monte Carlo run (distribution minutes mode)
  // that disagrees with the numbers published here — CHI 28.7 / 12–48 / 13.1% against 28.6 / 14–45
  // / 8.7%. Drawing that shape under these captions would put a picture on screen that contradicts
  // its own labels. Five quantiles, this feed, nothing else.
  const p025 = (team.p2_5!=null?team.p2_5:team.p10), p975 = (team.p97_5!=null?team.p97_5:team.p90);
  const X = v => clamp((Number(v)/WIN_MAX)*100, 0, 100);
  // The playoff cut-off is a conference property, read straight off the same board: the 8th team's
  // projected wins (the field is 16, the play-in decides 7-10 into 8 per conference).
  const confList = (d.conferences && d.conferences[team.conf]) ? d.conferences[team.conf] : [];
  const cutTeam = confList[7] || null;
  const cut = cutTeam ? Number(cutTeam.proj_wins) : null;
  const po = (team.playoff_prob!=null) ? (team.playoff_prob*100).toFixed(1)+'%' : '–';

  html += '<section class="panel hero-panel">'
    + '<div class="phead"><h2>Projected wins</h2>'
    + '<span class="psub">82 games · 10,000 simulated seasons</span></div>'
    + '<div class="pbody"><div class="hero">';

  // no repeated "Projected wins" label here — the panel header above already says it, and a label
  // stacked on its own heading is exactly the kind of duplication this rebuild is removing.
  const strF = fmt(team.strength - leagueNet,1);
  const wTxt = num(team.proj_wins,1).split('.');
  html += '<div class="heroid">'
    + '<div class="bignum">'+wTxt[0]+(wTxt.length>1?'<span class="dec">.'+wTxt[1]+'</span>':'')+'</div>'
    + '<div class="x">'+(rkWins?'<b>'+ord(rkWins)+'</b> of '+N+' in the league':'')
    + (cr.rank?' · <b>'+ord(cr.rank)+'</b> in the '+esc(team.conf):'')+'</div>'
    + '<div class="netlock">Projected net <b class="'+strF.cls+'">'+strF.txt+'</b>'
      + rankPill(rkNet, N, 'Projected net')
      + ' <span class="help" data-tip="Points per 100 possessions above or below the league average '
      + 'of all 30 teams.">?</span></div>'
    + '</div>';

  // the band: 95% span, the 10-90 span darker inside it, median tick, mean caret, cut-off line
  let bandHTML = '<div class="band" role="img" aria-label="Win distribution on a fixed 0 to 82 scale.'
    + ' Mean ' + num(team.proj_wins,1) + ', median ' + num(team.p50,0)
    + ', middle 80% ' + num(team.p10,0) + ' to ' + num(team.p90,0)
    + ', 95% ' + num(p025,0) + ' to ' + num(p975,0)
    + (cut!=null ? '. Playoff cut-off ' + num(cut,1) + ' wins, odds ' + po : '') + '.">';
  bandHTML += '<div class="bandanno">';
  if(cut!=null){
    const cx = X(cut);
    const pos = cx > 66 ? 'right:'+(100-cx).toFixed(2)+'%;text-align:right'
              : (cx < 34 ? 'left:'+cx.toFixed(2)+'%' : 'left:'+cx.toFixed(2)+'%;transform:translateX(-50%)');
    bandHTML += '<span class="cutlab" style="'+pos+'">Playoff cut-off <b>'+num(cut,1)+'</b> · '
      + 'odds <b>'+po+'</b></span>';
  }
  bandHTML += '</div><div class="bandmarks">'
    + '<span class="bmean" style="left:'+X(team.proj_wins).toFixed(2)+'%" data-tip="Mean of the '
      + '10,000 simulated seasons: '+num(team.proj_wins,1)+' wins."></span></div>';
  bandHTML += '<div class="bandrail">'
    + '<span class="b95" style="left:'+X(p025).toFixed(2)+'%;width:'+(X(p975)-X(p025)).toFixed(2)+'%" '
      + 'data-tip="95% of simulated seasons land between '+num(p025,0)+' and '+num(p975,0)+' wins."></span>'
    + '<span class="b80" style="left:'+X(team.p10).toFixed(2)+'%;width:'+(X(team.p90)-X(team.p10)).toFixed(2)+'%" '
      + 'data-tip="The middle 80%: '+num(team.p10,0)+' to '+num(team.p90,0)+' wins."></span>'
    + '<span class="b500" style="left:50%"></span>'
    + '<span class="bmed" style="left:'+X(team.p50).toFixed(2)+'%" data-tip="Median season: '
      + num(team.p50,0)+' wins."></span>'
    + (cut!=null ? '<span class="bcut" style="left:'+X(cut).toFixed(2)+'%"></span>' : '')
    + '</div>';
  bandHTML += '<div class="bandaxis"><span style="left:0">0</span>'
    + '<span style="left:50%;transform:translateX(-50%)" data-tip="A .500 season — 41-41.">41</span>'
    + '<span style="right:0">82</span></div>';
  bandHTML += '<div class="bandcap">'
    + '<span class="caplock">Middle 80% <b>'+num(team.p10,0)+'–'+num(team.p90,0)+'</b></span>'
    + '<span class="caplock">95% range <b>'+num(p025,0)+'–'+num(p975,0)+'</b>'
      // 88–97%, not 89–98%: re-read from out/oos/team_band_gate.json 2026-07-28 -> cov95 0.8833
      // (carry_forward) and 0.9722 (realized), both n_team_seasons=360. The old pair had drifted a
      // point in each direction. projection.html carries the SAME sentence and was corrected in the
      // same commit -- two pages disagreeing about a gate-scored number is worse than either being
      // stale, so they move together or not at all.
      + ' <span class="help" data-tip="Measured coverage of this band on 360 replayed team-seasons '
      + 'is 88–97%, re-scored before every deploy.">?</span></span>'
    + '<span class="caplock">Median <b>'+num(team.p50,0)+'</b></span>'
    + '</div></div>';
  html += '<div class="heroband">'+bandHTML+'</div>';
  html += '</div>';   // /.hero
  // the mini-header trigger rides the hero card's bottom edge, out of the grid's flow entirely
  html += '</div><div class="herofoot" id="herofoot"></div></section>';    // /.pbody /.panel

  // ---- PANEL 2 · factor profile, offence beside defence -------------------
  // The radar is DELETED. It restated the diverging bars 40px to their right, on a shape-only
  // scale, worse; the bars now take the full width and carry the league's spread behind them.
  html += '<section class="panel"><div class="phead"><h2>Factor profile</h2>'
    + '<span class="psub">vs league average · rank of '+N+'</span>'
    + ' <span class="help" data-tip="Bar length = distance from the league average, on ONE scale '
    + 'shared by all six rows in both columns, so an offensive bar and a defensive bar of the same '
    + 'length are the same number of points. The two upright rules mark the middle 80% of the 30 '
    + 'teams, so a bar that stops inside them is ordinary and a bar past one is not.">?</span></div>'
    + '<div class="pbody" id="facmount"></div></section>';

  // ---- PANEL 3 · roster: a stacked wins bar, then the list ----------------
  const roster = Array.isArray(team.roster) ? team.roster : [];
  const winsSum = roster.reduce((a,p)=>a+((p && p.proj_wins!=null && !isNaN(p.proj_wins))?Number(p.proj_wins):0),0);
  const totalWins = (team.proj_wins!=null) ? Number(team.proj_wins) : winsSum;
  // Owner 2026-07-26: ONE flag survives the cull as a chip, and only the discriminating one.
  // many_replacement_rows fires on 14 of 30 teams, so it separates a projection built on rated
  // veterans from one built largely on replacement-level fill — which changes how every number in
  // this table should be read. many_rookies (18/30) is already visible per-row as the R badge, and
  // high_rating_uncertainty fires on 30/30, i.e. it discriminates nothing. Neither gets a chip.
  const thin = Array.isArray(team.fallback_flags) && team.fallback_flags.indexOf('many_replacement_rows') >= 0;
  // The flag counts ROWS (it fires at 2), which says nothing about how much of the season those
  // rows actually play. Minute-weighted, the 14 flagged teams run 1.7% (MEM, MIL) to 13.0% (DAL) —
  // so "much of this roster" was told to Boston at 97.5% rated minutes. The chip now publishes the
  // figure it is claiming, computed from the same roster the list below renders.
  let repMin = 0, allMin = 0;
  roster.forEach(p=>{
    const w = (Number(p && p.mpg)||0) * (Number(p && p.exp_gp)||0);
    if(!(w>0)) return;
    allMin += w;
    if(p.model_source === 'replacement') repMin += w;
  });
  const repShare = allMin>0 ? (repMin/allMin)*100 : 0;
  html += '<section class="panel"><div class="phead"><h2>Roster</h2>'
    + '<span class="psub">'+roster.length+' players · grouped by position</span>'
    // Why a listed CENTRE can sit under WINGS. The depth chart these minutes were allocated on files
    // a roster as guards, wings and bigs, and that assignment disagrees with the listed position on
    // 110 of the 444 published rows that carry both — so the reader meets the explanation at the
    // grouping itself. The tip used to offer only the mild case ("a shooting guard who plays on the
    // wing"), which does not prepare anyone for the three loud ones: NYK Andre Drummond (C, 20.8
    // MPG) and OKC Jalen Williams (PG, 33.8) and ATL Devin Carter (PG, 19.8) all render under WINGS.
    // New York is the worst of it, because taking its one wing-filed centre out of BIGS leaves that
    // group with exactly one player (Karl-Anthony Towns) — the only one-player family group in the
    // league, and a shape that reads as a broken join unless the reader was told to expect it. The
    // tip now names the loud case and its consequence, in that order.
    + ' <span class="help" data-tip="Groups are the depth chart\'s own — guards, wings and bigs —'
    + ' not the five listed positions. The two disagree on 110 of the 444 rows carrying both,'
    + ' sometimes loudly: a listed centre or point guard can be filed under WINGS, which can leave'
    + ' BIGS with a single player. Each player\'s listed position, where he has one, sits beside his'
    + ' role.">?</span>'
    + (thin ? ' <span class="badge b-g" data-tip="'+num(repShare,1)+'% of this roster\'s projected'
              + ' minutes go to players with no rated history, filled in at replacement level.">'
              + num(repShare,1)+'% replacement minutes</span>' : '')
    + '</div><div class="pbody">';

  html += winsStackHTML(roster, totalWins);

  // ---- the two chip scales, derived and LEAGUE-WIDE -----------------------
  // Both are solved over every published row on all 30 teams, exactly as drawFactors solves its own
  // domain, for the same two reasons: the page never invents a number it can read, and a fixed
  // league scale is what lets Memphis's chips and New York's mean the same thing. Measured
  // 2026-07-28 on the shipped feed: max mpg 38.5 -> a 40-minute track; max |net| 8.61 -> +/-9.0.
  const allRows = teams.reduce((a,t)=>a.concat(Array.isArray(t.roster)?t.roster:[]), []);
  const maxOf = fn => allRows.reduce((m,p)=>{ const v = fn(p); return (v!=null && !isNaN(v) && v>m) ? v : m; }, 0);
  const MIN_DOM = Math.max(5, Math.ceil(maxOf(p=>Number(p.mpg))/5)*5);
  const NET_DOM = Math.max(0.5, Math.ceil(maxOf(p=>Math.abs(Number(p.net)))*2)/2);
  // REPLACEMENT LEVEL, derived rather than typed in. Wins contributed is a product — fitted over
  // the 538 rows, proj_wins = 0.0429 x season_mpg x (net + 4.20), r = 0.9974 — so it changes sign at
  // one net value and nowhere else, and the published rows separate there CLEANLY: the highest net
  // among the 36 rows with negative wins is -4.21 and the lowest among the 501 positive rows is
  // -4.19, so the boundary is their midpoint, -4.20. Read that way it cannot go stale, and if a
  // future feed ever makes the two sets overlap the rule is simply not drawn rather than drawn wrong.
  const netsWhere = f => allRows.filter(p=>f(Number(p.proj_wins))).map(p=>Number(p.net)).filter(v=>!isNaN(v));
  let REPL = null;
  const negNet = netsWhere(w=>w<0), posNet = netsWhere(w=>w>0);
  if(negNet.length && posNet.length){
    const hiNeg = Math.max.apply(null,negNet), loPos = Math.min.apply(null,posNet);
    if(hiNeg < loPos) REPL = (hiNeg + loPos) / 2;
  }
  const D = {min:MIN_DOM, net:NET_DOM, repl:REPL};

  // plan 50 W3c: MPG is MODELLED, never curated — ZERO of the 538 published rows carry a proj_min in
  // depthcharts_2026_27.csv. The chart supplies the roster and the role; the minutes are ours. That
  // distinction used to live in a column header's tip; it lives here now, where the reader meets the
  // track. The four ? tips this sentence carries are the four the .rhead strip used to carry.
  html += '<p class="rotcap">Two tracks per player, on scales shared by all 30 teams. '
    + '<b>Minutes</b> — his projected minutes per team game across all 82, in the team colour, '
    + 'with a tick at his rate in the games he actually plays '
    // DO NOT "SIMPLIFY" THIS TIP BACK INTO bar = tick x ExpGP / 82. It is not. Measured over the 538
    // published rows, season_mpg / mpg differs from exp_gp / 82 by more than 5 points on 291 of them:
    // starters run about 4 points HIGH (they absorb minutes when teammates sit) and buried bodies as
    // much as 26 points LOW (Jayden Quaintance: implied 0.28 against 44/82 = 0.54, because a deep
    // name-only body is allocated on rotation rank, not on availability). The two published minutes
    // are two separate modelled quantities; the tip states each of them and names the gap without
    // asserting an equation between the three.
    + '<span class="help" data-tip="Modeled, never curated: the depth chart supplies the roster and '
    + 'the role, not the minutes. The bar is his minutes per team game averaged over a whole 82; the '
    + 'tick is his minutes per game in the games he plays. The gap between them is the playing time '
    + 'he does not get — nights he is unavailable, and for deep-bench players the nights the rotation '
    + 'never reaches him.">?</span>'
    + '. <b>Net</b> — projected points per 100 possessions either side of the league average '
    + '<span class="help" data-tip="Projected on-court net for 2026-27. Cold-start rookies use a '
    + 'replacement-level prior. Bar length is the distance from league average; the sign is carried '
    + 'by the direction and by the + or − on the figure, not by colour alone.">?</span>'
    + (REPL!=null ? ', with a dashed rule at replacement level '
        + '<span class="help" data-tip="Replacement level, ' + num(REPL,1) + ' points per 100 — read '
        + 'off this feed, not assumed. A player\'s wins are his minutes times his net above this '
        + 'line, so every player left of the rule gives wins back, and those are exactly the ones in '
        + 'the strip under the bar above.">?</span>' : '')
    + '. The two multiply to the <b>wins</b> beside his name '
    + '<span class="help" data-tip="Each player\'s share of the team\'s projected wins. The group '
    + 'subtotals sum to the team total on the bar above.">?</span>.</p>';

  // The family is a CURATED fact, read straight off the feed — the page does not re-derive one from
  // `pos`. A row with no family is a row nothing in the data can place, never a row we declined to
  // classify.
  const groups = Object.fromEntries(FAMILIES.map(f=>[f[0],[]]));
  const unplaced = [];
  roster.forEach(p=>{ const f = p && p.pos_family; if(groups[f]) groups[f].push(p); else unplaced.push(p||{}); });
  const byContrib = (a,b)=>((b.proj_wins||0)-(a.proj_wins||0));
  // The share denominator is the team's OWN projected minutes, never 240 — see the .rot comment.
  const teamMin = roster.reduce((a,p)=>a+(Number(p && p.season_mpg)||0), 0);
  const emitGroup = (label, list, tip, wide)=>{
    if(!list.length) return '';
    // a group is a unit: it owns its head count, its share of the minutes and its share of the wins
    const gw = list.reduce((a,p)=>a+((p && p.proj_wins!=null && !isNaN(p.proj_wins))?Number(p.proj_wins):0),0);
    const gm = list.reduce((a,p)=>a+(Number(p && p.season_mpg)||0), 0);
    // THE EXPLANATION GETS THE SAME CARRIER AS EVERY OTHER EXPLANATION ON THE PAGE: a circled ?
    // beside the heading. It used to be the heading itself wearing .help with
    // border:none;width:auto;height:auto — which keeps the cursor:help and the bubble but deletes
    // the ring, i.e. deletes the only thing that tells a reader an explanation exists.
    let h = '<div class="rotcol'+(wide?' wide':'')+'"><div class="rothead"><b>'+esc(label)+'</b>'
      + (tip?' <span class="help" data-tip="'+esc(tip)+'">?</span>':'')
      + '<div class="rotstats">'
      + '<span class="rotstat"><em>'+list.length+'</em> player'+(list.length===1?'':'s')+'</span>'
      + (teamMin>0 ? '<span class="rotstat"><em>'+num((gm/teamMin)*100,0)+'%</em> of minutes</span>' : '')
      // a group can be net-negative (Brooklyn's two point guards run −1.1); num() prints the −
      + '<span class="rotstat"><em>'+num(gw,1)+'</em> wins</span>'
      + '</div></div><div class="rotbody">';
    list.slice().sort(byContrib).forEach(p=>{ h += playerChip(p, totalWins, D); });
    return h + '</div></div>';
  };
  html += '<div class="rot">';
  FAMILIES.forEach(f=>{ html += emitGroup(f[1], groups[f[0]], null, false); });
  // THE HEADING NAMES WHAT IS ACTUALLY TRUE OF THESE ROWS AND OF NO OTHERS (fixed 2026-07-27).
  // It used to read NO POSITION LISTED, which is true of them — and of 75 rows that are NOT under
  // it: measured on the published feed, 94 of the 538 roster rows carry pos=null and 75 of those
  // (32 guard / 17 wing / 26 big) sit happily inside the three family groups on 29 of the 30 teams,
  // because the curated chart placed them without needing a listed position. Golden State puts both
  // sets on one screen — two pos=null players under GUARDS, one under BIGS, five under the residual,
  // all five rows looking identical — so the old heading named a property the reader could see was
  // shared, which reads as a bug in the grouping.
  // What the 19 residual rows uniquely share is the CONJUNCTION in the heading: the curated depth
  // chart has no row for them at all (verified: 0 of the 19 appear in depthcharts_2026_27.json by
  // franchise+key, by pid or by normalised name), AND no listed position exists to fall back on.
  // Both clauses are load-bearing. Six further rows are also missing from the chart but do carry a
  // listed position and are filed by it (PHI LeBron James SF, ATL Jacob Toppin F, CHA Mouhamadou
  // Gueye PF, MIL Pete Nance PF, SAC Adam Flagler PG, UTA Mo Bamba C) — they fail the second clause,
  // which is exactly why they are not here. Drop either clause and the heading over-claims again.
  // 19 of 538 across the league, on 11 of the 30 teams. Nothing is guessed into a group to make the
  // heading disappear.
  html += emitGroup('NOT ON THE DEPTH CHART · NO POSITION LISTED', unplaced,
    'Not on the depth chart these groups come from, and no listed position anywhere either — so '
    + 'nothing in the data can call them a guard, a wing or a big. A gap, not a position. A player '
    + 'the chart also misses but who does have a listed position is filed by that instead, so he is '
    + 'not here.', true);
  html += '</div>';   // /.rot
  html += '</div></section>';   // /.pbody /.panel

  html += '</div>';   // /.dash

  // meta.note is an exporter-side provenance blob (minutes contract, GP model, artifact wording).
  // It is written for us, not for a reader, so it no longer renders; it stays in the JSON.

  document.getElementById('wrap').innerHTML = html;
  drawFactors(teamF, leagueAvg, facDev, facBand, N, [
    {label:'Offense', facs:OFF, val:oR, rank:rkOff,
     tip:'ORAPM: oTS + oTOV + oSC, each measured against the league average.'},
    {label:'Defense', facs:DEF, val:dR, rank:rkDef,
     tip:'DRAPM: dTS + dTOV + dSC, each measured against the league average. Higher is better.'}
  ]);
  fitStackLabels();
  fitHeadTips();
  mountMiniHeader(team, abbr, logoImg, strF);
  wireSwitchers();
}

/* ---- factor rows -------------------------------------------------------- */
function drawFactors(teamF, leagueAvg, facDev, facBand, N, sides){
  const host = document.getElementById('facmount');
  if(!host) return;
  // ONE shared domain across all six rows — and therefore across BOTH columns. Solved over every
  // team's deviation on every factor, exactly as when the six were one stack, so splitting the
  // block in two changed the layout and nothing else: a bar of a given length still means the same
  // number of points whichever column it is in. Per-column domains would have been the easy thing
  // to write and would have quietly made offence and defence unreadable against each other.
  let dom = 0;
  FACS.forEach(f=>{
    facDev[f].forEach(v=>{ dom = Math.max(dom, Math.abs(v)); });
    dom = Math.max(dom, Math.abs(facBand[f][0]), Math.abs(facBand[f][1]));
  });
  dom = Math.max(0.5, Math.ceil(dom*2)/2);
  const X = v => clamp(50 + (v/dom)*50, 0, 100);

  const rowHTML = f=>{
    const raw = teamF[f], mu = leagueAvg[f];
    const dev = (raw==null||isNaN(raw)) ? 0 : raw - mu;
    const rank = rankHigh(raw, facDev[f].map(v=>v+mu));
    const b = facBand[f], x0 = X(b[0]), x1 = X(b[1]), xv = X(dev), x50 = 50;
    const v = fmt(dev,2);
    const tip = FAC_TIP[f] + ' This team ' + num(raw,2) + ', league average ' + num(mu,2) + '.';
    return '<div class="frow">'
      + '<div class="flab">'+f+' <span class="help" data-tip="'+esc(tip)+'">?</span></div>'
      + '<div class="ftrack" data-tip="'+esc(tip)+'">'
        + '<span class="fband" style="left:'+x0.toFixed(2)+'%;width:'+(x1-x0).toFixed(2)+'%"></span>'
        + '<span class="fedge" style="left:'+x0.toFixed(2)+'%"></span>'
        + '<span class="fedge" style="left:'+x1.toFixed(2)+'%"></span>'
        + '<span class="faxis"></span>'
        // the bar wears the SAME pos/neg/zero class as the number to its right and takes its fill
        // from currentColor, so the two can never drift apart
        + '<span class="fbar '+v.cls+'" style="left:'+Math.min(x50,xv).toFixed(2)+'%;width:'
          + Math.abs(xv-x50).toFixed(2)+'%"></span>'
      + '</div>'
      + '<div class="fval '+v.cls+'">'+v.txt+'</div>'
      + '<div class="frank">'+rankPill(rank, N, f)+'</div>'
      + '</div>';
  };

  let h = '<div class="fgrid">';
  sides.forEach(s=>{
    const sv = fmt(s.val,1);
    h += '<div class="fcol"><div class="fchead"><h3>'+esc(s.label)+'</h3>'
      + '<span class="n '+sv.cls+'">'+sv.txt+'</span>'
      + rankPill(s.rank, N, s.label)
      + ' <span class="help" data-tip="'+esc(s.tip)+'">?</span></div>'
      + s.facs.map(rowHTML).join('')
      + '</div>';
  });
  host.innerHTML = h + '</div>';
}

/* ---- the stacked wins bar ----------------------------------------------- */
function winsStackHTML(roster, totalWins){
  const rows = (Array.isArray(roster)?roster:[])
    .filter(p=>p && p.proj_wins!=null && !isNaN(p.proj_wins))
    .map(p=>({name:String(p.name||''), w:Number(p.proj_wins)}))
    .sort((a,b)=>b.w-a.w);
  const pos = rows.filter(r=>r.w > 0), neg = rows.filter(r=>r.w < 0);
  const P = pos.reduce((a,r)=>a+r.w, 0);
  const Nn = neg.reduce((a,r)=>a-r.w, 0);
  if(!(P > 0)) return '';
  const last = n => { const p = n.trim().split(/\s+/); return p.length>1 ? p.slice(1).join(' ') : n; };
  const seg = (r,cls)=>{
    const w = Math.abs(r.w);
    const share = totalWins>0 ? ' · '+num((r.w/totalWins)*100,0)+'% of the projected total' : '';
    return '<span class="'+cls+'" style="width:'+((w/P)*100).toFixed(3)+'%" data-tip="'
      + esc(r.name)+' · '+num(r.w,2)+' wins contributed'+esc(share)+'"><span>'
      + esc(last(r.name))+'</span></span>';
  };
  const T = clamp(((P-Nn)/P)*100, 0, 100);          // where the published total falls on this axis
  let h = '<div class="wstack"><div class="wsbody">'
    + '<div class="wsbar" role="img" aria-label="Wins contributed by player, '
    + 'largest first, summing to '+num(totalWins,1)+' projected wins'
    + (Nn>0 ? ' after '+neg.length+' player'+(neg.length===1?'':'s')+' below replacement give back '
              + num(Nn,1) : '') + '.">'
    + pos.map(r=>seg(r,'wseg')).join('')
    + '</div>';
  if(Nn > 0){
    h += '<div class="wsback">' + neg.slice().reverse().map(r=>seg(r,'wnseg')).join('') + '</div>'
      + '<span class="wsmark" style="left:'+T.toFixed(3)+'%"></span>';
  }
  h += '</div><div class="wsaxis"><span class="z">0</span>'
    + '<span class="t" style="right:'+(100-T).toFixed(3)+'%"><b>'+num(totalWins,1)+'</b> projected wins</span>'
    + '</div>'
    + '<p class="wscap">Each block is one player\'s wins contributed, largest first.'
    + (Nn>0 ? ' The strip beneath is what the '+(neg.length===1?'one player':neg.length+' players')
              + ' below replacement give back.' : '')
    + '</p></div>';
  return h;
}
// A name is drawn inside its block only when the block is wide enough to hold it — measured after
// layout, not guessed from a percentage, because the same 3% block is 29px at 390 and 96px at 1280.
// The label span is absolutely positioned to its block, so scrollWidth > clientWidth is exactly
// "the text does not fit". Re-run on resize; an ellipsis'd "Dilli…" is noise, not a label.
// The same pass also decides which end of a block its tooltip hangs from — both answers depend on
// the block's real width in pixels, so they are settled together, after layout and again on resize.
function fitStackLabels(){
  document.querySelectorAll('.wseg > span, .wnseg > span').forEach(lab=>{
    lab.style.display = '';                       // measure it shown, before the browser paints
    if(lab.scrollWidth > lab.clientWidth) lab.style.display = 'none';
  });
  document.querySelectorAll('.wseg, .wnseg').forEach(seg=>{
    const host = seg.offsetParent;                // .wsbody — the only positioned ancestor
    const w = host ? host.clientWidth : 0;
    if(!(w > 0)) return;
    const centre = (seg.offsetLeft + seg.offsetWidth/2) / w;
    seg.classList.toggle('tipR', centre > 0.72);
    seg.classList.toggle('tipL', centre < 0.28);
  });
}
// Which end a PANEL-HEADER tooltip hangs from. The CSS flip above fixes the vertical clip at every
// width; the horizontal one only appears narrow, where a 260px bubble centred on a chip near one
// edge of a 362px panel loses a chunk off that side. Same .tipL/.tipR the stacked bar defines, same
// reason, and like it, assigned from measured geometry — which carrier sits near an edge depends on
// how the header wraps. 131 = half the bubble's own max width (260 + its 1px borders); erring
// towards anchoring is harmless, a bubble that would have fitted centred still fits hung off an end.
// .rothead, .rotcap and EVERY CHIP join the list. The chips are the reason this pass now matters at
// every width rather than only narrow: three columns put ~20 tooltip carriers per team hard against
// the panel's right edge, and a 260px bubble centred on a value at the right column's right margin
// runs ~127px past a 964px panel at 1280 — clipped, because .panel owns overflow:hidden. Measured on
// MEM, whose 24 chips fill all three columns. They keep the UPWARD bubble (the flip-down CSS above
// is keyed on .phead/.fchead only, and a chip sits mid-body with room above it); they borrow only
// the horizontal anchoring.
function fitHeadTips(){
  document.querySelectorAll('.phead [data-tip], .fchead [data-tip], .rothead [data-tip],'
    + ' .rotcap [data-tip], .pl [data-tip]').forEach(el=>{
    const panel = el.closest('.panel');
    if(!panel) return;
    const r = el.getBoundingClientRect(), p = panel.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const overR = (cx + 131) - p.right, overL = p.left - (cx - 131);
    el.classList.toggle('tipR', overR > 0 && overR >= overL);
    el.classList.toggle('tipL', overL > 0 && overL > overR);
  });
}
let fitTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(fitTimer);
  fitTimer = setTimeout(()=>{ fitStackLabels(); fitHeadTips(); }, 120);
});

/* ---- roster rows -------------------------------------------------------- */
// The roster groups by the THREE families the curated depth chart actually uses, not by the five
// listed positions (owner 2026-07-26). Grouping by five left 107 of the league's 538 rows in an
// orphan bucket — 94 of them, mostly incoming rookies, carry no listed position at all — while the
// chart the projection is built on had already filed 513 of the 538 as a guard, a wing or a big
// (a further 6 are placed by their listed position; 19 by nothing, see the residual heading below).
// The exporter does that join and ships `pos_family`; this page only renders it.
const FAMILIES = [["guard","GUARDS"],["wing","WINGS"],["big","BIGS"]];
// The feed's model_source is an internal id ("xgb"), and the tooltip was printing it raw as
// "· source xgb". Reader words, or nothing — an id the reader cannot look up is worse than silence.
const SRC_WORDS = { xgb:"from rated history", rookie:"from a rookie prior", replacement:"at replacement level" };
function playerChip(p, teamW, D){
  p = p || {};
  const f = Array.isArray(p.f) ? p.f : [];
  const ftip = f.length===6 ? (' · ' + FACS.map((nm,i)=>nm+' '+num(f[i],1)).join(' · ')) : '';
  const ntip = 'Projected net '+num(p.net,1)+' pts/100'
    + (p.age!=null ? ' · age '+num(p.age,0) : '')
    + (p.n_seasons ? ' · '+p.n_seasons+' prior season'+(p.n_seasons===1?'':'s') : '')
    + (SRC_WORDS[p.model_source] ? ' · '+SRC_WORDS[p.model_source] : '') + ftip;
  const rookie = '<span class="rk" title="Cold-start rookie — net is a replacement-level prior,'
    + ' no rated history yet.">R</span>';
  // ONE LINK RULE, UNCHANGED. 32 of the 538 published rows resolve to neither a pid the Explorer
  // will answer to nor a gid, and they get plain text rather than a dead href — a rookie who is not
  // in the daily board yet has nothing to link TO. Do not add a second rule beside this one.
  let nm;
  if(!p.cold && p.pid!=null){
    nm = '<a class="plnm" href="index.html?p='+encodeURIComponent(p.pid)+'" title="'+esc(ntip)+'">'+esc(p.name||'')+'</a>';
  } else if(p.gid!=null){
    nm = '<a class="plnm" href="index.html?p='+encodeURIComponent(p.gid)+'" title="'+esc(ntip)+'">'+esc(p.name||'')+'</a>'+rookie;
  } else {
    nm = '<span class="plnm" title="'+esc(ntip)+'">'+esc(p.name||'')+'</span>'+rookie;
  }
  // The red-to-green swatch that used to sit beside the net figure is gone with the table. It
  // restated the number's own sign and magnitude in a second channel. What carries the sign now is
  // the + / − glyph fmt() prints on the figure, plus the direction of the bar from the axis — the
  // figure itself stays --text on both themes, because the light --pos measured 2.79:1 on the
  // tinted hover row when it briefly took the sign colour.
  const nf = fmt(p.net,1);
  const wins = (p.proj_wins!=null) ? Number(p.proj_wins) : null;
  const shareTip = (wins!=null && teamW>0)
    ? num(wins,2)+' wins contributed · '+num((wins/teamW)*100,0)+'% of the team\'s projected wins'
    : 'Wins contributed';
  const gp = (p.exp_gp==null) ? null : num(p.exp_gp,0);
  // The listed position did not vanish with the grouping, it moved: it rides beside the role for
  // the 444 of 538 rows that genuinely have one (431 of the five, 13 a bare G or F) and is simply
  // absent for the other 94. Expected games joins them because it is what the minutes tick below is
  // explained BY — three words, no numbers to align, all of it --muted.
  const pos = ["PG","SG","SF","PF","C","G","F"].indexOf(String(p.pos||"").toUpperCase()) >= 0
    ? String(p.pos).toUpperCase() : "";
  const sub = [(p.role||'').replace(/^\w/,c=>c.toUpperCase()), pos,
               (gp!=null ? gp+' games' : '')].filter(Boolean).join(' · ');

  // ---- the minutes track ----
  const dom = (D && D.min) || 40;
  const sm = Number(p.season_mpg), mp = Number(p.mpg);
  const W = v => clamp(((isNaN(v)?0:v)/dom)*100, 0, 100);
  const rngTxt = (p.gp_lo!=null && p.gp_hi!=null) ? ' (80% range '+num(p.gp_lo,0)+'–'+num(p.gp_hi,0)+')' : '';
  // three published figures, stated as three figures. See the .rotcap tip: bar x games / 82 does NOT
  // reproduce the tick, so this must not read as if it did.
  const mtip = num(sm,1)+' minutes per team game averaged over all 82 · '+num(mp,1)
    + ' per game in the games he plays'
    + (gp!=null ? ' · '+gp+' games expected'+rngTxt : '') + '.';
  let mtrack = '<span class="pltrack" data-tip="'+esc(mtip)+'">';
  if(!isNaN(mp)) mtrack += '<span class="plghost" style="width:'+W(mp).toFixed(2)+'%"></span>';
  if(!isNaN(sm)) mtrack += '<span class="plfill" style="width:'+W(sm).toFixed(2)+'%"></span>';
  if(!isNaN(mp)) mtrack += '<span class="pltick" style="left:'+W(mp).toFixed(2)+'%"></span>';
  mtrack += '</span>';

  // ---- the net track ----
  const nd = (D && D.net) || 9;
  const X = v => clamp(50 + ((isNaN(v)?0:v)/nd)*50, 0, 100);
  const nv = Number(p.net), xv = X(nv);
  // no bar at all when there is no net. .plbar carries min-width:2px so a missing value would
  // otherwise paint a 2px --zero mark sitting exactly on the axis — i.e. it would draw "precisely
  // league average", which is the one thing an absent number does not mean. The figure prints "–".
  let ntrack = '<span class="pltrack '+nf.cls+'" data-tip="'+esc(ntip)+'">'
    + '<span class="plaxis"></span>'
    + (isNaN(nv) ? '' : '<span class="plbar" style="left:'+Math.min(50,xv).toFixed(2)+'%;width:'
      + Math.abs(xv-50).toFixed(2)+'%"></span>')
    + ((D && D.repl!=null) ? '<span class="plrepl" style="left:'+X(D.repl).toFixed(2)+'%"></span>' : '')
    + '</span>';

  return '<div class="pl">'
    + '<div class="plid"><div class="plwho">'+nm+'</div>'
      + '<span class="plw" data-tip="'+esc(shareTip)+'">'+num(wins,1)+' <i>wins</i></span></div>'
    + '<div class="plsub">'+esc(sub)+'</div>'
    + '<div class="plrow"><span class="vh">Minutes per team game </span>'
      + mtrack + '<b class="plval">'+num(sm,1)+'</b></div>'
    + '<div class="plrow"><span class="vh">Projected net </span>'
      + ntrack + '<b class="plval">'+nf.txt+'</b></div>'
    + '</div>';
}

/* ---- sticky mini-header + switcher wiring ------------------------------- */
function mountMiniHeader(team, abbr, logoImg, strF){
  const mount = document.getElementById('minimount');
  if(!mount) return;
  mount.innerHTML = '<div class="minibar" id="minibar">'
    + '<div class="mininner">'+logoImg('',24)
    + '<span class="ab">'+esc(abbr)+'</span>'
    + '<span class="mstat"><i>Wins</i><b>'+num(team.proj_wins,1)+'</b></span>'
    + '<span class="mstat"><i>Net</i><b class="'+strF.cls+'">'+strF.txt+'</b></span>'
    + '<span class="minispace"></span>'+switcherHTML('mini')+'</div></div>';
  const bar = document.getElementById('minibar'), foot = document.getElementById('herofoot');
  if(!bar || !foot || !window.IntersectionObserver) return;
  new IntersectionObserver(entries=>{
    entries.forEach(e=>{ bar.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0); });
  }, {rootMargin:'-56px 0px 0px 0px', threshold:0}).observe(foot);
}
function wireSwitchers(){
  document.querySelectorAll('.switch .nav').forEach(b=>{
    b.addEventListener('click', ()=>goTeam(b.getAttribute('data-go')));
  });
  document.querySelectorAll('.switch select').forEach(s=>{
    s.addEventListener('change', ()=>goTeam(s.value));
  });
}
// Left / right step the standings the same way the arrows do. Skipped whenever the user is typing
// or has a control focused (a focused <select> uses the same keys to change its own option), and
// whenever a modifier is held, so browser and OS shortcuts still work.
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target, tag = t && t.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (t && t.isContentEditable)) return;
  if(!ORDER.length || !ABBR) return;
  const i = ORDER.findIndex(x=>x.abbr===ABBR);
  if(i < 0) return;
  e.preventDefault();
  goTeam(ORDER[(i + (e.key==='ArrowRight'?1:-1) + ORDER.length) % ORDER.length].abbr);
});
// Team colour is theme-dependent (teamAccent/teamInk both account for it), so re-derive it when
// the theme toggle flips the attribute rather than leaving a dark-theme hex on a white page.
new MutationObserver(()=>{ if(ABBR) applyTeamColor(ABBR); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
</script>
</body></html>
