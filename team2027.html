<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team · 2026-27 Projection · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* ===========================================================================
     2026-27 TEAM DASHBOARD (rebuilt 2026-07-26, reworked 2026-07-27).
     The page it replaces was four sections on four different rhythms — a 6-box
     KPI strip, a 320px radar beside a bar chart that started at an unrelated x,
     a full-width roster table, and a 5-column depth chart repeating the same 16
     players. Nothing shared a grid, so the page read as a pile.
     ONE 12-column grid (.dash) now owns the page, ONE card style (.panel) with
     ONE header treatment (.phead) sits on it, and every section is a panel. All
     spacing comes from --sp-*, all type from --fs-*; the only derived size is
     the hero headline, and it is derived FROM --fs-6 so it moves with the ramp.
     2026-07-27: the roster stopped being a table (a stacked wins bar leads it,
     and the rows are a list), the factor block split into an offence column and
     a defence column, and the team accent went back onto the player names.
     =========================================================================== */

  /* ---- page header: identity + team switcher ------------------------------ */
  .thead{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-2) 0 0;flex-wrap:wrap}
  .thead img{width:46px;height:46px;object-fit:contain;flex:0 0 auto}
  .thead .tn{flex:1 1 260px;min-width:0}
  .thead .tn h1{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1)}
  .thead .tn h1 .nm{color:var(--team-ink,var(--accent))}
  .thead .tn .conf{color:var(--muted);font-size:var(--fs-1);margin-top:2px}
  .thead .tn .conf b{color:var(--text);font-weight:600}
  /* the badge wears the franchise fill, with --team-on for its label: pure white or pure black,
     whichever measures further from the fill (see onFill() — 4.58:1 worst case over 30 teams). */
  .forwardtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;
    color:var(--team-on,var(--accent-ink));background:var(--team,var(--accent));padding:2px 8px;
    border-radius:999px;vertical-align:middle;margin-left:var(--sp-2);text-transform:uppercase}

  /* Prev / next / jump. A native <select> is the jump target on purpose: it is keyboard- and
     screen-reader-complete for free, and it is the one control that must not swallow the
     ArrowLeft/ArrowRight hotkeys — the global handler skips it by tagName. */
  .switch{display:flex;align-items:center;gap:var(--sp-1);flex:0 0 auto;min-width:0}
  .switch .nav{font:inherit;font-size:var(--fs-3);line-height:1;color:var(--muted);cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-1);padding:6px 10px}
  .switch .nav:hover{color:var(--text);border-color:var(--team,var(--accent))}
  .switch select{font:inherit;font-size:var(--fs-1);color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r-1);padding:6px 8px;max-width:190px;cursor:pointer}
  .switch select:hover{border-color:var(--team,var(--accent))}
  /* the franchise owns the focus ring on this page too — scoped to the page body and the mini
     header so the shared top nav keeps the site's own ring. */
  .wrap :focus-visible,.minibar :focus-visible{outline:2px solid var(--team,var(--accent));
    outline-offset:2px;border-radius:2px}
  .wrap .help:hover{border-color:var(--team,var(--accent))}

  /* ---- sticky mini-header -------------------------------------------------- */
  /* Fixed at 52px = the topnav's own height, and z-index 40 < the topnav's 50, so it can never
     cover the nav and never fights the nav's position:sticky (two stickies in one scroll parent
     is where that goes wrong). visibility:hidden in the off state keeps its select unfocusable. */
  .minibar{position:fixed;top:52px;left:0;right:0;z-index:40;background:var(--navbg);
    border-bottom:1px solid var(--line);visibility:hidden;opacity:0;transform:translateY(-8px);
    transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}
  .minibar.on{visibility:visible;opacity:1;transform:none;transition:opacity .16s ease,transform .16s ease}
  .mininner{max-width:var(--maxw);margin:0 auto;padding:0 22px;height:46px;
    display:flex;align-items:center;gap:var(--sp-3);min-width:0}
  .mininner img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .mininner .ab{font-weight:700;font-size:var(--fs-2);letter-spacing:.3px;flex:0 0 auto;
    color:var(--team-ink,var(--text))}
  .mstat{display:flex;align-items:baseline;gap:var(--sp-1);flex:0 0 auto;white-space:nowrap}
  .mstat i{font-style:normal;font-size:var(--fs-1);color:var(--muted)}
  .mstat b{font-family:var(--font-mono);font-size:var(--fs-2);font-variant-numeric:tabular-nums}
  .minispace{flex:1 1 auto;min-width:0}
  /* On a phone the bar carries logo + abbr + two readouts + the switcher in 362px, so the one
     elastic piece (the jump menu) is what gives — the arrows and the numbers stay full size. */
  @media(max-width:560px){
    .mininner{padding:0 14px;gap:var(--sp-2)}
    .minibar .switch select{max-width:76px;padding:6px 4px}
    .minibar .switch .nav{padding:5px 8px}
  }

  /* ---- the grid + the one card style -------------------------------------- */
  .dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4);margin-top:var(--sp-4)}
  .panel{grid-column:1/-1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-2);overflow:hidden}
  /* THE 2px TEAM RULE ALONG THE TOP OF THIS CARD IS GONE (owner de-slop pass, 2026-07-27): it was a
     decorative bar carrying no data, and it is not replaced by another one. The franchise still
     owns this card through things that mean something — the distribution band, the mean caret, the
     headline name — plus a tint of the accent solved to stay inside the luminance range every ink
     on the page was certified against (see boundedWash). position:relative so the mini-header
     sentinel can hang off the bottom edge without being laid out — see .herofoot. */
  .panel.hero-panel{position:relative;background:var(--team-tint,var(--panel))}
  /* The sticky mini-header's trigger. It used to be a direct child of .dash, which made it a GRID
     ITEM: a zero-height row that still ate a full var(--sp-4) gap, so the hero sat 32px above the
     factor panel where every other seam is 16px. Out of flow entirely now, pinned to the bottom of
     the hero card, which is the line it was always meant to represent. */
  .herofoot{position:absolute;left:0;right:0;bottom:0;height:1px;pointer-events:none}
  .phead{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
    padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--team-soft,var(--line))}
  /* section heads wear the franchise ink, which teamInk() certifies at >=4.5:1 on every surface of
     the theme. With team_colors.js absent this falls back to the site accent, still a link-grade ink. */
  .phead h2{margin:0;font-size:var(--fs-3);font-weight:700;letter-spacing:.2px;
    color:var(--team-ink,var(--accent))}
  .phead .psub{font-size:var(--fs-1);color:var(--faint);font-weight:400}
  .phead .badge{cursor:help}
  .pbody{padding:var(--sp-4)}
  /* TOOLTIPS INSIDE A PANEL HEADER FLIP DOWN. .panel carries overflow:hidden (it owns a border-
     radius), so it clips the site tooltip's UPWARD bubble out of anything sitting in the panel's own
     header — and that is where this round put the two explanations the panels most depend on.
     Measured at 1280 on CHI: the Factor-profile "?" bubble is 188px tall with 17.5px of room above
     it, so 11.5px of it survived; the Roster chip's is 75px with 15.5px of room, so 9.5px did.
     Flipping down is the same device .wseg already uses, and for the same reason.
     .fchead is in the panel BODY but only 69px below the same clipping edge, so the Defense column's
     75px bubble lost 12px off the top — small enough to miss by eye and still a cut sentence.
     The same border clips SIDEWAYS too, which only bites narrow: at a real 390 the factor bubble ran
     72.3px past the panel's right edge and the roster chip's 33.4px past its left. fitHeadTips()
     hangs those off the near end with the .tipL/.tipR the stacked bar already defines. */
  .phead [data-tip]:hover::after,.fchead [data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .phead [data-tip]:hover::before,.fchead [data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}

  /* league rank — the same pill wherever a number claims a rank. The BORDER carries the franchise
     (solved to exactly 3:1 on the panel, the mark floor, so it is visible without shouting); the
     TEXT stays --muted on purpose. Team ink here would put a near-red numeral one space away from a
     --neg numeral on a red franchise, which is the exact collision this page is fighting. */
  .lgrank{font-family:var(--font-mono);font-size:var(--fs-1);color:var(--muted);white-space:nowrap;
    border:1px solid var(--team-line,var(--line));border-radius:999px;padding:1px 7px;cursor:help}

  /* ---- hero: headline wins + the win distribution ------------------------- */
  .hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4);align-items:start}
  .heroid{grid-column:span 4;min-width:0}
  .heroband{grid-column:span 8;min-width:0}
  @media(max-width:880px){ .heroid,.heroband{grid-column:1/-1} }
  /* Display size, derived from the scale rather than invented beside it: the type ramp still owns
     the page, this is --fs-6 stepped up for the one number the page exists to publish. The decimal
     is set smaller because a mono '.' carries a full character advance — at 50px "28.6" opened a
     visible hole on both sides of the point. */
  .heroid .bignum{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.03em;line-height:1;color:var(--text);font-size:calc(var(--fs-6) * 1.8);
    margin:0 0 var(--sp-2);display:flex;align-items:baseline}
  .heroid .bignum .dec{font-size:.5em;color:var(--muted);letter-spacing:-.02em}
  .heroid .x{font-size:var(--fs-1);color:var(--faint)}
  .heroid .x b{color:var(--text);font-weight:600}
  /* Projected net used to be one of three cells in a footer strip across the bottom of this card,
     beside Offense and Defense. Those two moved to the factor panel, where they now head the three
     rows each of them is the sum of; printing them twice on one page was duplication, not summary.
     What is left is one lockup — label and value adjacent, value outranking label. */
  .netlock{display:flex;align-items:baseline;gap:var(--sp-1);flex-wrap:wrap;
    margin-top:var(--sp-4);font-size:var(--fs-1);color:var(--muted)}
  .netlock b{font-family:var(--font-mono);font-size:var(--fs-4);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px}

  .band{position:relative;min-width:0}
  .bandanno{position:relative;height:19px}
  .cutlab{position:absolute;top:0;font-size:var(--fs-1);color:var(--muted);white-space:nowrap}
  .cutlab b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .bandmarks{position:relative;height:9px}
  .bmean{position:absolute;bottom:0;width:0;height:0;margin-left:-5px;
    border-left:5px solid transparent;border-right:5px solid transparent;
    border-top:7px solid var(--team,var(--accent));cursor:help}
  .bandrail{position:relative;height:30px;border:1px solid var(--line);border-radius:var(--r-1);
    background:var(--panel-2);overflow:hidden}
  /* WHY THIS IS A BOX-AND-WHISKER AND NOT TWO WASHES OF ONE HUE.
     Both regions used to be the accent at a low alpha (.18/.46 dark, .26/.55 light). Composited on
     --panel-2 that is 1.12-1.38:1 for the 95% span and 1.81-3.44:1 for the middle 80% — 0 of 30
     teams cleared 3:1 on either theme, so the headline of the page was a band you could not see
     (CHI dark: the wash composites to #301423, 1.12:1 on a #0c121b rail).
     Fixed twice over. (a) STRENGTH: the middle 80% is now the accent at FULL strength — team_colors
     already certifies every accent at >=3:1 on the lightest surface of its theme, so on the darker
     rail it lands 3.60-8.53:1 dark / 3.83-7.00:1 light, 30/30 — and the 95% alpha is SOLVED in JS
     against the rail's real composite (solveAlpha), not guessed, landing .50-.88 dark / .56-.83
     light for exactly 3:1. (b) SHAPE: colour alone still could not separate the two regions —
     for the worst accent the two composites differ by only 1.19:1 — so HEIGHT carries the
     distinction. The 95% span is a whisker, the middle 80% is the full-height box on top of it. */
  /* the fallback is the SOLID site accent, not a guessed alpha: if the script never runs, the
     whisker is still a certified >=3:1 mark rather than a wash nobody measured */
  .b95{position:absolute;top:10px;bottom:10px;z-index:1;background:var(--team-wash,var(--accent))}
  .b80{position:absolute;top:0;bottom:0;z-index:1;background:var(--team,var(--accent))}
  /* .500 is a backdrop gridline, so it sits UNDER the distribution and is neutral --zero rather
     than --text at .18 (which measured 1.63:1 dark / 1.45:1 on the bare rail — not a visible mark).
     --zero: 3.46:1 dark, 3.15:1 light. Where the box covers it the axis tick below still says 41. */
  .b500{position:absolute;top:0;bottom:0;z-index:0;width:1px;background:var(--zero)}
  /* the median lands on the box by definition, so it is inked AGAINST the box: --team-on is pure
     white or pure black, whichever measures further from the fill — 4.58:1 worst case. */
  .bmed{position:absolute;top:4px;bottom:4px;z-index:2;width:2px;margin-left:-1px;
    background:var(--team-on,var(--text));border-radius:1px;cursor:help}
  /* The playoff cut-off crosses three different backings — bare rail, the box, and the panel above
     the rail — and no single ink clears 3:1 on all of them (plain --text over the box is 1.42:1).
     A TWO-TONE dash does: the --bg segments are >=3:1 on any certified accent, the --text segments
     are >=14:1 on rail and panel, so one tone or the other is always the visible one. */
  .bcut{position:absolute;top:-9px;bottom:0;z-index:3;width:1.5px;margin-left:-.75px;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--text) 0 3px,var(--bg) 3px 6px)}
  .bandaxis{position:relative;height:17px;margin-top:3px;font-size:11px;color:var(--faint);
    font-family:var(--font-mono)}
  .bandaxis span{position:absolute;top:0}
  .bandcap{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-2)}
  /* label + value adjacent = the house lockup; never space-between (owner, 2026-07-26) */
  .caplock{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-1);color:var(--muted)}
  .caplock b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* ---- factor profile: two columns, offence and defence ------------------- */
  /* One deviation domain is shared by all SIX rows across BOTH columns (see drawFactors) — split
     per column, an oTS bar and a dTS bar of equal length would mean different numbers of points
     and the two sides would stop being comparable, which is the only reason to put them side by
     side. The column head carries that side's total, so each column is a sum and its three rows. */
  .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4) var(--sp-5)}
  @media(max-width:760px){ .fgrid{grid-template-columns:minmax(0,1fr);gap:var(--sp-5)} }
  .fcol{min-width:0}
  .fchead{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
    padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
  .fchead h3{margin:0;font-size:var(--fs-2);font-weight:700;letter-spacing:.2px;
    color:var(--team-ink,var(--accent))}
  .fchead .n{font-family:var(--font-mono);font-size:var(--fs-3);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .frow{display:grid;grid-template-columns:52px minmax(0,1fr) 58px 44px;align-items:center;
    gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--line-2)}
  .frow:last-child{border-bottom:none}
  .flab{font-size:var(--fs-1);font-weight:700;color:#aebccd;display:flex;align-items:center;
    justify-content:flex-end;gap:3px}
  :root[data-theme=light] .flab{color:#33425a}
  .ftrack{position:relative;height:20px;border:1px solid var(--line);border-radius:3px;min-width:0}
  /* the answer to "is −1.06 unusual or ordinary" — the middle 80% of the 30 teams, behind the bar.
     The FILL can only ever be a hint, not the mark: on the light theme any tint dark enough to be
     seen drops a --pos bar sitting on it below 3:1 (the arithmetic caps a legible tint at 1.12:1
     against the panel), so the tint stops at --panel-3 on dark (1.10:1) and --panel-2 on light
     (1.12:1), where a --pos/--neg/--zero bar keeps >=3.01:1. The EDGES are the real mark. */
  .fband{position:absolute;top:0;bottom:0;z-index:0;background:var(--panel-3)}
  :root[data-theme=light] .fband{background:var(--panel-2)}
  /* The edges have to survive ANY bar length — before this they were emitted before the bar with no
     z-index, so on OKC the right edge was painted over on 4 of 6 rows and the oTS row showed only
     the 26-50% remnant of a 26-77% band, i.e. it said the league's middle 80% is entirely below
     average. Two independent guarantees now: they paint ABOVE the bar, and they overshoot the track
     by 3px top and bottom into the row's own padding, where nothing can ever reach them.
     --line (1.19:1 on --panel) could not carry a mark either; --muted measures 5.39 on panel and
     4.90 on band in dark, 6.03 and 5.41 in light. */
  .fedge{position:absolute;top:-3px;bottom:-3px;z-index:3;width:1px;background:var(--muted)}
  .faxis{position:absolute;top:0;bottom:0;z-index:2;left:50%;width:1px;background:var(--zero)}
  /* THE FILL RAMP IS GONE. drawFactors fed RC.rdbu — a diverging ramp built for a WHITE ground —
     onto a #0e141d panel, so contrast ran backwards: the ramp's extremes (#053061 / #67001f, the
     biggest deviations) measured 1.41 and 1.40:1 while its middle (#f7f7f7, no deviation at all)
     measured 17.25:1. OKC's best factor was its faintest bar. Light inverted the failure — the
     middle measured 1.07:1 on white. An inset hairline patched one side of it and its comment had
     the cause backwards.
     Sign is now --pos/--neg, magnitude is bar length alone, and the bar simply takes currentColor
     from the same pos/neg/zero class the row's number already wears — so the bar and the figure
     beside it are literally one colour, and both extremes are the LOUDEST marks in the panel
     (>=5.98:1 dark, >=3.35:1 light). Green/red is not the sole encoder: direction from the centre
     axis and an explicit +/- on the number both carry the sign independently.
     min-width replaces the hairline: a team a tenth of a point off average rounds to a sub-pixel
     bar, and a mark that rounds away is the same defect in a smaller size. */
  .fbar{position:absolute;top:5px;bottom:5px;z-index:1;min-width:2px;border-radius:2px;
    background:currentColor}
  .fval{font-family:var(--font-mono);font-size:var(--fs-1);text-align:right;
    font-variant-numeric:tabular-nums;font-weight:600}
  .frank{text-align:right}
  @media(max-width:560px){ .frow{grid-template-columns:44px minmax(0,1fr) 54px 42px} }

  /* ---- roster · the stacked wins bar -------------------------------------- */
  /* WHY A STACK AND NOT A SCATTER. Wins contributed is exactly additive: the column sums to the
     projected total the hero prints, so one bar cut into 16-20 pieces is a true picture of where
     the wins come from. Nothing else on this page has that property — minutes here are per-game
     when active and sum to ~393 for Chicago, so anything drawn as a share of a 240-minute game
     would be a lie about its own axis.
     THE SCALE IS THE POSITIVE SUM, not the total. Chicago has two players below replacement; if
     the axis were the published 28.6 the positive blocks would overflow it. So the bar runs
     0..(sum of positives) and the players who give wins BACK are the strip beneath it, right-
     aligned, in --neg — their left edge is where the published total lands, marked by the dashed
     rule. Positives minus that strip is the number in the axis label, every time. */
  .wstack{margin:0 0 var(--sp-5)}
  .wsbody{position:relative}
  .wsbar{display:flex;height:40px;border:1px solid var(--line);border-radius:var(--r-1);
    background:var(--panel-2)}
  /* the giveback strip has NO track of its own — an empty full-width tray under the bar would draw
     a scale where there is no data. Only the blocks hang, flush under the bar's right end.
     SHAPE, NOT COLOUR, is what separates them from the stack: --neg against a red franchise's
     accent measures 1.88:1 (CHI dark) and 1.55:1 (CHI light), i.e. colour alone could not carry it
     — so the blocks are a third the height and hang below the baseline, the same device the win
     distribution uses for its whisker. --neg is still correct here; these ARE negative. */
  .wsback{display:flex;justify-content:flex-end;height:12px}
  /* no overflow:hidden anywhere in here on purpose — the per-segment tooltip is an ::after on the
     segment, and a clipping ancestor eats it. The end caps are rounded per-segment instead. */
  .wseg,.wnseg{position:relative;min-width:2px;cursor:help}
  .wseg{background:var(--team,var(--accent));box-shadow:inset -1px 0 0 var(--panel)}
  .wseg:last-child{box-shadow:none;border-radius:0 3px 3px 0}
  .wseg:first-child{border-radius:3px 0 0 3px}
  .wnseg{background:var(--neg);box-shadow:inset 1px 0 0 var(--panel)}
  .wnseg:first-child{box-shadow:none}
  .wnseg:last-child{border-radius:0 0 3px 0}
  .wseg > span,.wnseg > span{position:absolute;inset:0;display:flex;align-items:center;
    padding:0 6px;overflow:hidden;white-space:nowrap;pointer-events:none;
    font-size:11px;font-weight:700;letter-spacing:.1px;color:var(--team-on,var(--accent-ink))}
  .wnseg > span{color:var(--neg-on,#000000);font-size:9.5px}
  /* tooltips flip DOWN: the bar is the first thing in the panel body, so an upward bubble would
     land on the panel header (same rule as a sticky thead). */
  .wseg[data-tip]:hover::after,.wnseg[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .wseg[data-tip]:hover::before,.wnseg[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
  /* ...and blocks at either end anchor to that end rather than centring on themselves: the card
     clips at its own border, and the site tooltip has no edge logic. The giveback blocks are
     ALWAYS at the right end, so without this the two rows that most need explaining were the two
     whose explanation ran off the card. .tipL/.tipR are assigned from measured geometry, not
     nth-child, because which blocks sit near an end depends on the roster. */
  .tipR[data-tip]:hover::after{left:auto;right:0;transform:none}
  .tipR[data-tip]:hover::before{left:auto;right:7px;transform:none}
  .tipL[data-tip]:hover::after{left:0;transform:none}
  .tipL[data-tip]:hover::before{left:7px;transform:none}
  /* the published total, marked where it actually falls. Two-tone for the same reason as .bcut:
     it crosses the accent fill, the --neg strip and the bare rail, and no single ink clears 3:1
     on all three. */
  .wsmark{position:absolute;top:-3px;bottom:-3px;z-index:4;width:1.5px;margin-left:-.75px;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--text) 0 3px,var(--bg) 3px 6px)}
  .wsaxis{position:relative;height:17px;margin-top:5px;font-size:11px;color:var(--faint);
    font-family:var(--font-mono)}
  .wsaxis .z{position:absolute;left:0;top:0}
  .wsaxis .t{position:absolute;top:0;white-space:nowrap;text-align:right}
  .wsaxis .t b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .wscap{margin:var(--sp-2) 0 0;font-size:var(--fs-1);color:var(--muted);line-height:1.5;max-width:840px}

  /* ---- roster · the list -------------------------------------------------- */
  /* It was a table and it read like one: six ruled columns, the numbers spread across the full
     width, the name no louder than the role beside it. Now the name is the line and everything
     else is subordinate — no vertical rules anywhere, the four numerics clustered hard right at
     fixed widths so they still form scannable columns without being drawn as a grid. */
  .rhead{display:flex;align-items:flex-end;gap:var(--sp-3);padding:0 var(--sp-2) var(--sp-2);
    border-bottom:1px solid var(--line);font-size:var(--fs-1);color:var(--muted);font-weight:600}
  .rhead .rnum{white-space:nowrap}          /* "Exp GP ?" must not wrap its own tip onto line two */
  .rrow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-2);
    border-radius:var(--r-1)}

     it is never a worse ground than the site's own table row-hover, and every ink the row puts on it
     is re-measured against it rather than against --panel. CHI dark #2a1523: --text 14.61:1, --muted
     6.42:1, name 10.80:1. CHI light #f7e7ec: 14.91:1, 6.16:1, 4.65:1. Those three are the only inks
     a roster row uses. */
  .rrow:hover{background:var(--team-hover,var(--panel-2))}
  .rid{flex:1 1 auto;min-width:0}
  .rnums{display:flex;align-items:baseline;gap:var(--sp-3);flex:0 0 auto}
  .rnum{position:relative;text-align:right;font-family:var(--font-mono);
    font-variant-numeric:tabular-nums;line-height:1.25}
  /* THESE PER-CELL LABELS ARE HIDDEN VISUALLY, NOT REMOVED (fixed 2026-07-27). They were
     display:none above 560px, which also takes them out of the accessibility tree — and when the
     roster stopped being a table it lost the thead, the row and the columnheader semantics that had
     been naming these numbers. A screen reader was left reading "Jalen Smith Deep 24.1 62 48–74
     +1.5 4.5". The .rhead line cannot stand in: it is a sibling div with no programmatic
     association to any cell. So every cell names itself, at every width, and the visual goal — no
     ruled 20-row table — is untouched.
     --muted, not --faint: below 560px the same labels become the ONLY thing naming the columns
     (the header line is gone there), so 3.03:1 was not good enough for them. */
  .rnum i{font-style:normal;font-family:var(--font);font-size:10px;color:var(--muted);font-weight:600}
  .rnum i,.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  /* EVERY FIGURE IN THIS CLUSTER IS --text, HOVERED OR NOT, ON BOTH THEMES (fixed 2026-07-27).
     These numerals briefly took the sign colour onto the glyph itself, and on the light theme that
     put them under the 4.5:1 text floor on most rows of every team: the light --pos of the day
     (#11a06a) measured 3.35:1 on a plain row and 2.79:1 on the tinted hover row, and even --neg
     (#d4393a), which cleared 4.72:1 plain, fell to 3.93:1 hovered. Measured on the rendered pixel,
     not on the token.
     THE SIGN IS NOT LOST, because in this cluster it was never colour alone: fmt() prints an
     explicit + or − on the net value and num() an explicit − on the wins value. That non-chromatic
     carrier is also what lets the cluster share a row with a name in the franchise ink — a red
     numeral one space from a red name is the collision .lgrank already refuses to make.
     WHY --text AND NOT A DARKER GREEN. The sign tokens were re-solved site-wide the same day (light
     --pos is now #0d784f, 4.58:1 on the worst surface), so a sign-coloured figure would pass today.
     It would pass because of a token this page does not own, and it would go back under the floor
     the moment that token moved. --text is 17.80:1 plain / 14.91:1 hovered on light and 15.81:1 /
     14.61:1 on dark, before and after that change and whatever it becomes next. */
  .rnum b{font-size:var(--fs-2);font-weight:600;color:var(--text)}
  /* the 80% range is secondary, but secondary text is still text, and as --faint it was 2.93:1 light
     / 3.03:1 on the panel and 2.44:1 on the hover row. --muted is the ink the role line was promoted
     to one comment below, for the same reason, and it cleared the floor on the old palette (6.03 /
     5.02 light) as well as this one (7.36 / 6.16) — so the row does not depend on --faint's rescue. */
  .rnum .rng{display:block;font-size:10px;line-height:1.1;color:var(--muted)}
  .rn-mpg{width:52px}.rn-gp{width:74px}.rn-net{width:58px}.rn-w{width:56px}
  /* THE PLAYER NAMES WEAR THE FRANCHISE INK AGAIN (owner, 2026-07-27), reversing yesterday's call.
     The hazard is real: on a red franchise the name ink and --neg are the same FAMILY of red, and
     no amount of derivation makes them different colours. So every mitigation here is NON-COLOUR.
     The name is 14px in the body face at 600 weight; every number is mono, tabular and right-
     aligned in a fixed-width cluster at the opposite end of the row; the net value carries an
     explicit sign glyph no name contains; and the line under the name is a word, not a number.
     Since the fix at .rnum b there is also no sign-coloured numeral left in the row to collide with.
     THE INK IS team_colors.js's TO CHOOSE and this page reads whatever it certifies — including its
     refusal: on light it now declines to brand a red or green franchise at all and hands back the
     site accent, so CHI light is #1b68c0 (5.54:1 on the row, 4.65:1 hovered) while CHI dark keeps
     #ffbdbf (11.69:1 / 10.80:1). Both are read as "the name", not as a sign, because nothing else in
     the row is coloured. Do not re-derive that floor here; it lives in team_colors.js. */
  .rnm{font-size:var(--fs-2);font-weight:600;color:var(--team-ink,var(--accent));text-decoration:none}
  .rnm:hover{color:var(--text);text-decoration:underline}
  /* the role is a datum, not a whisper: --muted (6.95:1 dark / 7.36:1 light on the panel), where the
     --faint it first got demoted to measured 3.03:1 — below the text floor, and worse than the table
     cell it replaced. */
  .rsub{font-size:var(--fs-1);color:var(--muted);margin-top:1px}
  /* THE ROOKIE CHIP IS NO LONGER AMBER (fixed 2026-07-27). --amber had no light value at all, so
     #f0b429 measured 1.86:1 on --panel #ffffff and 1.55:1 on the tinted hover row — and the 1px
     border was the same ink, so at 9.5px/800 the entire chip was under the 3:1 MARK floor on light,
     never mind the 4.5:1 text floor. --amber has since been given a light value site-wide, which
     would rescue it; --muted needed no rescue, clearing the floor on the palette that shipped the
     bug (6.03:1 / 5.02:1 light) and on the one that fixed it (7.36:1 / 6.16:1 light, 6.95:1 / 6.42:1
     dark, panel then hover row). One ink for the whole chip, glyph and ring, so the ring is a
     measured mark instead of the --line hairline it would otherwise be — 1.33:1 on white, and a chip
     nobody can see is not an improvement on a chip nobody can read. */
  .rk{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;letter-spacing:.3px;
    color:var(--muted);border:1px solid var(--muted);border-radius:3px;padding:0 4px;
    vertical-align:middle;cursor:help}
  /* a position group is a unit with its own subtotal, not a divider between rows */
  .rgrp{margin-top:var(--sp-4)}
  .rgrp:first-of-type{margin-top:var(--sp-3)}
  .rgrphead{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;padding:0 var(--sp-2) var(--sp-1)}
  .rgrphead b{font-size:var(--fs-1);letter-spacing:.7px;font-weight:800;
    color:var(--team-ink,var(--accent))}
  /* value before label, value louder than label — the house lockup. A group can be net-negative
     (Brooklyn's two point guards run −1.1) and it reads the way a negative ROW reads — which, since
     the fix above, is an explicit − glyph on a --text figure, not a red one. One rule for the sign
     inside this panel, not one for rows and another for their subtotals. */
  .rgrphead .gs{font-size:var(--fs-1);color:var(--muted)}
  .rgrphead .gs em{font-style:normal;font-family:var(--font-mono);font-weight:600;color:var(--text);
    font-variant-numeric:tabular-nums}
  .rrow.rtot{margin-top:var(--sp-4);border-top:1px solid var(--line);border-radius:0;
    background:var(--team-tint,var(--panel-2))}
  .rrow.rtot .rnm{color:var(--text);font-weight:800;letter-spacing:.5px}
  .rrow.rtot .rnum b{font-weight:800}
  @media(max-width:560px){

    .rhead{display:none}

  }

<script>
"use strict";

const DEFAULT_ABBR = "OKC";
const FACS = ["oTS","oTOV","oSC","dTS","dTOV","dSC"];
const OFF = ["oTS","oTOV","oSC"], DEF = ["dTS","dTOV","dSC"];
const FAC_TIP = {
  oTS:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (projected).",
  oTOV:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive).",
  oSC:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions.",
  dTS:"Defensive true-shooting RAPM — suppressing opponent shot efficiency.",
  dTOV:"Defensive turnover RAPM — forcing turnovers / ball pressure.",
  dSC:"Defensive second-chance RAPM — limiting opponent offensive rebounds."
};
// Every factor is already sign-aligned in the feed — dTS "suppressing opponent shot efficiency" is
// POSITIVE when good, same as oTS — so higher is better on all six, and rank 1 = the highest value
// everywhere on this page. Verified against the old strip, which colours +z blue (good) for defence
// as well as offence, and against ORAPM/DRAPM, which are plain sums of the three.
const WIN_MAX = 82;                  // the win axis is pinned 0..82 so teams are comparable

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// ONE minus glyph on the page. fmt() has always emitted U+2212; num() emitted whatever toFixed
// gave it, so a roster row could show "−1.4" under Proj net and "-0.3" under Wins contributed —
// two different symbols for one idea, in the same row, at 12.5px.
function num(v,dec){
  if(v==null||isNaN(v)) return "–";
  return Number(v).toFixed(dec==null?1:dec).replace("-","−");
}
function fmt(v,dec){
  dec = (dec==null)?1:dec;
  if(v==null || isNaN(v)) return {txt:"–",cls:"zero"};
  const n = Number(v);
  const txt = (n>=0?"+":"−") + Math.abs(n).toFixed(dec);
  let cls = "zero";
  if(n >= 0.05) cls = "pos"; else if(n <= -0.05) cls = "neg";
  return {txt,cls};
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function qparam(k){ return new URLSearchParams(location.search).get(k); }
function logoURL(abbr){
  const M={UTA:'utah',NOP:'no',GSW:'gs',SAS:'sa',NYK:'ny',WAS:'wsh'};
  const k=String(abbr||'').toUpperCase();
  return "https://a.espncdn.com/i/teamlogos/nba/500/"+(M[k]||k.toLowerCase())+".png";
}
function ord(n){ if(n==null) return ""; const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
// rank among 30, higher = better (see the sign-alignment note above). Ties share the better rank.
function rankHigh(v, arr){
  if(v==null || isNaN(v)) return null;
  let better = 0;
  arr.forEach(x=>{ if(x!=null && !isNaN(x) && Number(x) > Number(v)) better++; });
  return better + 1;
}
function rankPill(rank, n, label){
  if(rank==null) return '';
  return '<span class="lgrank" data-tip="'+esc(label)+': '+ord(rank)+' of '+n+' teams. 1 = best.">'
    + ord(rank) + '</span>';
}
// linear-interpolated quantile of a SORTED array
function quant(sorted, p){
  const n = sorted.length; if(!n) return 0;
  const i = p*(n-1), lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi]-sorted[lo])*(i-lo);
}

// team six-factor profile = minute-weighted (mpg x exp_gp) mean of roster per-factor values,
// x5 on-floor so the six sum ~ the team's projected net (strength). Computed client-side from
// the roster's f[0..5], so no separate team-factor field is needed.
function teamFactors(team){
  const r = (team && Array.isArray(team.roster)) ? team.roster : [];
  const F = [0,0,0,0,0,0]; let W = 0;
  r.forEach(p=>{
    const w = (Number(p.mpg)||0) * (Number(p.exp_gp)||0);
    if(!(w>0) || !Array.isArray(p.f) || p.f.length!==6) return;
    W += w; for(let k=0;k<6;k++){ const v=Number(p.f[k]); if(!isNaN(v)) F[k]+=w*v; }
  });
  const out = {};
  FACS.forEach((f,k)=>{ out[f] = W>0 ? 5*F[k]/W : 0; });
  return out;
}

/* ---- team colour ---------------------------------------------------------
   Contract (team_colors.js, built alongside this page):
     window.TEAM_COLORS[abbr] -> {name, primary, secondary}
     window.teamAccent(abbr)  -> hex safe for marks/fills on the current theme
     window.teamInk(abbr)     -> hex safe for TEXT on the current theme
   The whole feature is optional: with the file missing every var below resolves to the site
   accent and the page is indistinguishable from an untinted one. Sign colours (--pos/--neg) are
   never touched — red/green encode meaning here and must not become decoration. */
function toRGB(c){
  c = String(c||"").trim();
  let m = c.match(/^#([0-9a-f]{3})$/i);
  if(m) return [0,1,2].map(i=>parseInt(m[1][i]+m[1][i],16));
  m = c.match(/^#([0-9a-f]{6})$/i);
  if(m) return [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16));
  m = c.match(/rgba?\(([^)]+)\)/i);
  if(m){ const p = m[1].split(","); return [+p[0]||0, +p[1]||0, +p[2]||0]; }
  return null;
}
/* WCAG maths, so an alpha on this page is SOLVED rather than picked. Same shape as the bisection
   team_colors.js runs on lightness, and for the same reason: measure the value you actually ship. */
function srgbLin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function relLum(p){ return 0.2126*srgbLin(p[0]) + 0.7152*srgbLin(p[1]) + 0.0722*srgbLin(p[2]); }
function contrast(a,b){
  const x = relLum(a), y = relLum(b);
  return (Math.max(x,y)+0.05) / (Math.min(x,y)+0.05);
}
function over(fg, alpha, bg){ return [0,1,2].map(i=>Math.round(fg[i]*alpha + bg[i]*(1-alpha))); }
function hexOf(p){ return "#" + p.map(v=>("0"+clamp(Math.round(v),0,255).toString(16)).slice(-2)).join(""); }
// Smallest alpha whose COMPOSITED pixel clears `floor` against the backing it is painted on.
// Searched over k/255 rather than bisected on a real number, because the compositor quantizes alpha
// to 8 bits: a bisected 0.794 is stored as 202/255 = 0.7922 and lands at 2.97:1 instead of the 3.01
// it was solved for — measured in the browser, not assumed. Contrast is monotone in alpha (the
// composite luminance walks straight from the backing to the colour), so the first hit is the
// minimum. Returns 1 when even the undiluted colour cannot reach the floor, so the caller always
// gets the best available rather than a silent failure.
function solveAlpha(fg, bg, floor){
  for(let k=1;k<=255;k++){
    const a = k/255;
    if(contrast(over(fg,a,bg), bg) >= floor) return a;
  }
  return 1;
}
// Ink for TEXT SITTING ON the accent fill (segment labels, the badge, the median tick).
// PURE white/black, not the site's near-white #f3f6fb and near-black #0a0e16: an accent whose
// luminance sits at the crossover (~0.18) measures 4.24:1 against both of those — under the 4.5
// text floor — where #ffffff/#000000 reach 4.58:1, which is the most any two-ink choice can do
// there. Measured over 30 teams x 2 themes: minimum 4.58:1 (MEM), i.e. AA on every franchise.
// (RC.inkOn would have picked wrong outright on the light accents — it flips at luminance 0.58,
// tuned for the redGreen ramp, and hands a bright #56b6ff white ink at 1.94:1.)
function onFill(rgb){
  return contrast([255,255,255], rgb) >= contrast([0,0,0], rgb) ? "#ffffff" : "#000000";
}
// Largest alpha (<= cap) whose composite stays INSIDE the luminance range team_colors.js certified
// its inks against — never lighter than --grid on dark, never darker than --panel-3 on light. A
// surface tinted this far is provably no worse a ground for text than the worst surface the site
// already ships, so a hovered row or a tinted hero cannot quietly break a contrast guarantee that
// was measured somewhere else. Luminance is monotone in alpha here (the accent is always on the
// far side of the limit from the panel), so the first miss ends the walk.
function boundedWash(fg, bg, limitRGB, light, cap){
  const L = relLum(limitRGB);
  let best = 0;
  for(let k=1;k<=Math.round(cap*255);k++){
    const a = k/255, l = relLum(over(fg,a,bg));
    if(light ? l >= L : l <= L) best = a; else break;
  }
  return best;
}
function cssRGB(name, fallback){
  return toRGB((getComputedStyle(document.documentElement).getPropertyValue(name)||"").trim())
    || fallback;
}
function applyTeamColor(abbr){
  const root = document.documentElement;
  const site = (getComputedStyle(root).getPropertyValue("--accent") || "#56b6ff").trim();
  let accent = site, ink = site;
  try{
    if(typeof window.teamAccent === "function"){ const a = window.teamAccent(abbr); if(a) accent = a; }
    if(typeof window.teamInk === "function"){ const k = window.teamInk(abbr); if(k) ink = k; }
  }catch(e){ accent = site; ink = site; }
  const rgb = toRGB(accent) || toRGB(site) || [86,182,255];
  const A = a => "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+a+")";
  const light = root.getAttribute("data-theme") === "light";
  root.style.setProperty("--team", accent);
  root.style.setProperty("--team-ink", ink);
  // The 95% whisker's alpha is solved against the rail it is actually painted on (--panel-2) for
  // THIS team, every theme flip. The old fixed .18/.26 pair was a guess and it missed on all 30.
  const rail = cssRGB("--panel-2", light ? [238,243,249] : [12,18,27]);
  const panel = cssRGB("--panel", light ? [255,255,255] : [14,20,29]);
  root.style.setProperty("--team-wash", A(solveAlpha(rgb, rail, 3)));
  root.style.setProperty("--team-on", onFill(rgb));
  // the giveback blocks are --neg (they ARE negative), so their label needs the same treatment:
  // white measures 2.78:1 on the dark --neg and black measures 7.4:1, and the light theme flips it
  root.style.setProperty("--neg-on", onFill(cssRGB("--neg", light ? [212,57,58] : [255,107,107])));
  // Row hover and the hero card's tint, both SOLVED and both emitted as SOLID hexes — an rgba here
  // would composite over --bg, not over the panel the row actually sits on, and the measured value
  // would not be the shipped one. Caps: 14% for hover (an affordance, wants to be felt), 5% for the
  // hero (a whisper of the franchise on the identity card).
  const limit = cssRGB(light ? "--panel-3" : "--grid", light ? [227,235,245] : [22,31,44]);
  const tint = over(rgb, boundedWash(rgb, panel, limit, light, 0.05), panel);
  root.style.setProperty("--team-hover", hexOf(over(rgb, boundedWash(rgb, panel, limit, light, 0.14), panel)));
  root.style.setProperty("--team-tint",  hexOf(tint));
  // rank-pill border: the smallest alpha that is still a certified 3:1 mark. Solved against the
  // TINTED hero card, not the plain panel — a pill rides both, and the tint is the ground nearer
  // the accent in luminance on either theme, so clearing it clears the panel too.
  root.style.setProperty("--team-line", A(solveAlpha(rgb, tint, 3)));
  root.style.setProperty("--team-soft", A(0.34));                  // section rules
}

let DATA = null, ABBR = null, ORDER = [];

fetch('projection_2026_27_teams.json')
  .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(d=>{ DATA=d; render(d); })
  .catch(()=>{
    document.getElementById('msg').innerHTML =
      "Couldn't load the 2026-27 team projection."+
      '<br><a href="projection.html">← back to the 2026-27 standings</a>';
  });

function friendly(htmlMsg){
  document.getElementById('wrap').innerHTML =
    '<div class="empty">'+htmlMsg+
    '<br><a href="projection.html" style="font-size:13px">← back to the 2026-27 projected standings</a></div>';
}
function confRank(d, conf, abbr){
  const list = (d && d.conferences && Array.isArray(d.conferences[conf])) ? d.conferences[conf] : [];
  const i = list.findIndex(r=>r && r.abbr===abbr);
  return { rank:(i<0?null:i+1), size:list.length };
}
/* Walk order for the arrows = the standings order, not the alphabet. projection.html sorts each
   conference by projected wins descending and prints East first, then West; d.conferences already
   arrives in exactly that per-conference order, so East-then-West reproduces the standings page. */
function standingsOrder(d){
  const out = [];
  ["East","West"].forEach(c=>{
    const list = (d && d.conferences && Array.isArray(d.conferences[c])) ? d.conferences[c] : [];
    list.forEach((r,i)=>{ if(r && r.abbr) out.push({abbr:r.abbr, name:r.name||r.abbr, conf:c, seed:i+1}); });
  });
  return out;
}
function switcherHTML(cls){
  const i = ORDER.findIndex(t=>t.abbr===ABBR);
  const prev = ORDER[(i-1+ORDER.length)%ORDER.length], next = ORDER[(i+1)%ORDER.length];
  let opts = "";
  ["East","West"].forEach(c=>{
    opts += '<optgroup label="'+(c==="East"?"Eastern":"Western")+' Conference">';
    ORDER.filter(t=>t.conf===c).forEach(t=>{
      opts += '<option value="'+esc(t.abbr)+'"'+(t.abbr===ABBR?' selected':'')+'>'
        + t.seed + '  ' + esc(t.name) + '</option>';
    });
    opts += '</optgroup>';
  });
  return '<div class="switch '+cls+'">'
    + '<button type="button" class="nav" data-go="'+esc(prev.abbr)+'" title="'+esc(prev.name)
      + '" aria-label="Previous team: '+esc(prev.name)+'">‹</button>'
    + '<select aria-label="Jump to a team">'+opts+'</select>'
    + '<button type="button" class="nav" data-go="'+esc(next.abbr)+'" title="'+esc(next.name)
      + '" aria-label="Next team: '+esc(next.name)+'">›</button>'
    + '</div>';
}
function goTeam(ab){ if(ab) location.href = "team2027.html?abbr=" + encodeURIComponent(ab); }

function render(d){
  const abbrRaw = qparam('abbr');
  const abbr = String(abbrRaw || DEFAULT_ABBR).toUpperCase();
  const team = (d && d.teams && d.teams[abbr]) ? d.teams[abbr] : null;
  if(!team){ friendly("No 2026-27 projection found for <b>"+esc(abbrRaw||abbr)+"</b>."); return; }
  ABBR = abbr;
  ORDER = standingsOrder(d);
  applyTeamColor(abbr);
  document.title = (team.name||abbr) + " · 2026-27 Projection · Daily RAPM";

  const teams = Object.values(d.teams||{});

  // ---- league context: every number on this page is ranked against these 30 ----
  const teamF = teamFactors(team);
  const allF = teams.map(teamFactors);
  const leagueAvg = {}, facDev = {}, facBand = {};
  FACS.forEach(f=>{
    const v = allF.map(t=>t[f]).filter(x=>x!=null&&!isNaN(x));
    leagueAvg[f] = v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
    facDev[f] = allF.map(t=>(t[f]||0)-leagueAvg[f]);           // all 30, as deviations
    const s = facDev[f].slice().sort((a,b)=>a-b);
    facBand[f] = [quant(s,0.10), quant(s,0.90)];               // the league's middle 80%
  });
  // plan 50 W3a: team.strength is on the board's RAW scale, whose 30-team mean is ~-3.73, NOT 0.
  // A net rating is by definition relative to league average, and this centring is verified, not
  // assumed: regressing published wins on published strength puts league-mean strength at exactly
  // 41.00 wins (slope 2.255). Uncentred, every team on this page read ~3.73 points too low.
  const allS = teams.map(t=>Number(t && t.strength)).filter(x=>!isNaN(x));
  const leagueNet = allS.length ? allS.reduce((a,b)=>a+b,0)/allS.length : 0;
  const sideSum = (F, side) => side.reduce((a,f)=>a+((F[f]||0)-(leagueAvg[f]||0)),0);
  const oR = sideSum(teamF, OFF), dR = sideSum(teamF, DEF);

  const N = teams.length;
  const rkWins = rankHigh(team.proj_wins, teams.map(t=>t.proj_wins));
  const rkNet  = rankHigh(team.strength,  allS);
  const rkOff  = rankHigh(oR, allF.map(F=>sideSum(F, OFF)));
  const rkDef  = rankHigh(dR, allF.map(F=>sideSum(F, DEF)));

  const cr = confRank(d, team.conf, abbr);
  const confLabel = (team.conf||"") + (cr.rank ? " · "+ord(cr.rank) : "")
    + (cr.rank && cr.size ? " of "+cr.size : "");

  // ---- page header ----
  const logoSrc = team.logo || logoURL(abbr);
  const logoImg = (cls,size)=> '<img '+(cls?'class="'+cls+'" ':'')+'src="'+esc(logoSrc)+'" alt="" '
    + 'width="'+size+'" height="'+size+'" onerror="this.src=\''+esc(logoURL(abbr))
    + '\';this.onerror=function(){this.style.visibility=\'hidden\'}">';
  let html = '<div class="thead">'+logoImg('',46)
    + '<div class="tn"><h1><span class="nm">'+esc(team.name||abbr)+'</span>'
    + '<span class="forwardtag">2026-27 projected</span></h1>'
    + '<div class="conf"><b>'+esc(abbr)+'</b>'+(confLabel?' · '+esc(confLabel):'')+'</div></div>'
    + switcherHTML('head') + '</div>';
  // The only caveat this page cannot drop: nothing here has happened yet. One sentence, above the
  // fold, next to the "2026-27 projected" badge.
  html += '<p class="sub">A forward projection, not a measured result. '
    + 'See all 30 teams in the <a href="projection.html">2026-27 standings</a>.</p>';

  html += '<div class="dash">';

  // ---- PANEL 1 · hero: projected wins + the win distribution --------------
  // The distribution used to be printed as the string "14-45" — the richest thing in the feed,
  // rendered as text. It is now the shape it always was.
  // FENCE: these five quantiles come from THIS feed. projection_2026_27_distribution.json carries
  // an 83-bin win_hist per team, but it is a DIFFERENT Monte Carlo run (distribution minutes mode)
  // that disagrees with the numbers published here — CHI 28.7 / 12–48 / 13.1% against 28.6 / 14–45
  // / 8.7%. Drawing that shape under these captions would put a picture on screen that contradicts
  // its own labels. Five quantiles, this feed, nothing else.
  const p025 = (team.p2_5!=null?team.p2_5:team.p10), p975 = (team.p97_5!=null?team.p97_5:team.p90);
  const X = v => clamp((Number(v)/WIN_MAX)*100, 0, 100);
  // The playoff cut-off is a conference property, read straight off the same board: the 8th team's
  // projected wins (the field is 16, the play-in decides 7-10 into 8 per conference).
  const confList = (d.conferences && d.conferences[team.conf]) ? d.conferences[team.conf] : [];
  const cutTeam = confList[7] || null;
  const cut = cutTeam ? Number(cutTeam.proj_wins) : null;
  const po = (team.playoff_prob!=null) ? (team.playoff_prob*100).toFixed(1)+'%' : '–';

  html += '<section class="panel hero-panel">'
    + '<div class="phead"><h2>Projected wins</h2>'
    + '<span class="psub">82 games · 10,000 simulated seasons</span></div>'
    + '<div class="pbody"><div class="hero">';

  // no repeated "Projected wins" label here — the panel header above already says it, and a label
  // stacked on its own heading is exactly the kind of duplication this rebuild is removing.
  const strF = fmt(team.strength - leagueNet,1);
  const wTxt = num(team.proj_wins,1).split('.');
  html += '<div class="heroid">'
    + '<div class="bignum">'+wTxt[0]+(wTxt.length>1?'<span class="dec">.'+wTxt[1]+'</span>':'')+'</div>'
    + '<div class="x">'+(rkWins?'<b>'+ord(rkWins)+'</b> of '+N+' in the league':'')
    + (cr.rank?' · <b>'+ord(cr.rank)+'</b> in the '+esc(team.conf):'')+'</div>'
    + '<div class="netlock">Projected net <b class="'+strF.cls+'">'+strF.txt+'</b>'
      + rankPill(rkNet, N, 'Projected net')
      + ' <span class="help" data-tip="Points per 100 possessions above or below the league average '
      + 'of all 30 teams.">?</span></div>'
    + '</div>';

  // the band: 95% span, the 10-90 span darker inside it, median tick, mean caret, cut-off line
  let bandHTML = '<div class="band" role="img" aria-label="Win distribution on a fixed 0 to 82 scale.'
    + ' Mean ' + num(team.proj_wins,1) + ', median ' + num(team.p50,0)

    + ', 95% ' + num(p025,0) + ' to ' + num(p975,0)

    bandHTML += '<span class="cutlab" style="'+pos+'">Playoff cut-off <b>'+num(cut,1)+'</b> · '
      + 'odds <b>'+po+'</b></span>';
  }
  bandHTML += '</div><div class="bandmarks">'
    + '<span class="bmean" style="left:'+X(team.proj_wins).toFixed(2)+'%" data-tip="Mean of the '
      + '10,000 simulated seasons: '+num(team.proj_wins,1)+' wins."></span></div>';
  bandHTML += '<div class="bandrail">'
    + '<span class="b95" style="left:'+X(p025).toFixed(2)+'%;width:'+(X(p975)-X(p025)).toFixed(2)+'%" '
      + 'data-tip="95% of simulated seasons land between '+num(p025,0)+' and '+num(p975,0)+' wins."></span>'
    + '<span class="b80" style="left:'+X(team.p10).toFixed(2)+'%;width:'+(X(team.p90)-X(team.p10)).toFixed(2)+'%" '
      + 'data-tip="The middle 80%: '+num(team.p10,0)+' to '+num(team.p90,0)+' wins."></span>'
    + '<span class="b500" style="left:50%"></span>'
    + '<span class="bmed" style="left:'+X(team.p50).toFixed(2)+'%" data-tip="Median season: '
      + num(team.p50,0)+' wins."></span>'
    + (cut!=null ? '<span class="bcut" style="left:'+X(cut).toFixed(2)+'%"></span>' : '')
    + '</div>';
  bandHTML += '<div class="bandaxis"><span style="left:0">0</span>'
    + '<span style="left:50%;transform:translateX(-50%)" data-tip="A .500 season — 41-41.">41</span>'
    + '<span style="right:0">82</span></div>';
  bandHTML += '<div class="bandcap">'
    + '<span class="caplock">Middle 80% <b>'+num(team.p10,0)+'–'+num(team.p90,0)+'</b></span>'
    + '<span class="caplock">95% range <b>'+num(p025,0)+'–'+num(p975,0)+'</b>'
      // 88–97%, not 89–98%: re-read from out/oos/team_band_gate.json 2026-07-28 -> cov95 0.8833
      // (carry_forward) and 0.9722 (realized), both n_team_seasons=360. The old pair had drifted a
      // point in each direction. projection.html carries the SAME sentence and was corrected in the
      // same commit -- two pages disagreeing about a gate-scored number is worse than either being
      // stale, so they move together or not at all.
      + ' <span class="help" data-tip="Measured coverage of this band on 360 replayed team-seasons '
      + 'is 88–97%, re-scored before every deploy.">?</span></span>'
    + '<span class="caplock">Median <b>'+num(team.p50,0)+'</b></span>'
    + '</div></div>';
  html += '<div class="heroband">'+bandHTML+'</div>';
  html += '</div>';   // /.hero
  // the mini-header trigger rides the hero card's bottom edge, out of the grid's flow entirely
  html += '</div><div class="herofoot" id="herofoot"></div></section>';    // /.pbody /.panel

  // ---- PANEL 2 · factor profile, offence beside defence -------------------
  // The radar is DELETED. It restated the diverging bars 40px to their right, on a shape-only
  // scale, worse; the bars now take the full width and carry the league's spread behind them.
  html += '<section class="panel"><div class="phead"><h2>Factor profile</h2>'
    + '<span class="psub">vs league average · rank of '+N+'</span>'
    + ' <span class="help" data-tip="Bar length = distance from the league average, on ONE scale '
    + 'shared by all six rows in both columns, so an offensive bar and a defensive bar of the same '
    + 'length are the same number of points. The two upright rules mark the middle 80% of the 30 '
    + 'teams, so a bar that stops inside them is ordinary and a bar past one is not.">?</span></div>'
    + '<div class="pbody" id="facmount"></div></section>';

  // ---- PANEL 3 · roster: a stacked wins bar, then the list ----------------
  const roster = Array.isArray(team.roster) ? team.roster : [];
  const winsSum = roster.reduce((a,p)=>a+((p && p.proj_wins!=null && !isNaN(p.proj_wins))?Number(p.proj_wins):0),0);
  const totalWins = (team.proj_wins!=null) ? Number(team.proj_wins) : winsSum;
  // Owner 2026-07-26: ONE flag survives the cull as a chip, and only the discriminating one.
  // many_replacement_rows fires on 14 of 30 teams, so it separates a projection built on rated
  // veterans from one built largely on replacement-level fill — which changes how every number in
  // this table should be read. many_rookies (18/30) is already visible per-row as the R badge, and
  // high_rating_uncertainty fires on 30/30, i.e. it discriminates nothing. Neither gets a chip.
  const thin = Array.isArray(team.fallback_flags) && team.fallback_flags.indexOf('many_replacement_rows') >= 0;
  // The flag counts ROWS (it fires at 2), which says nothing about how much of the season those
  // rows actually play. Minute-weighted, the 14 flagged teams run 1.7% (MEM, MIL) to 13.0% (DAL) —
  // so "much of this roster" was told to Boston at 97.5% rated minutes. The chip now publishes the
  // figure it is claiming, computed from the same roster the list below renders.
  let repMin = 0, allMin = 0;
  roster.forEach(p=>{
    const w = (Number(p && p.mpg)||0) * (Number(p && p.exp_gp)||0);
    if(!(w>0)) return;
    allMin += w;
    if(p.model_source === 'replacement') repMin += w;
  });
  const repShare = allMin>0 ? (repMin/allMin)*100 : 0;
  html += '<section class="panel"><div class="phead"><h2>Roster</h2>'
    + '<span class="psub">'+roster.length+' players · grouped by position</span>'
    // Why a listed CENTRE can sit under WINGS. The depth chart these minutes were allocated on files
    // a roster as guards, wings and bigs, and that assignment disagrees with the listed position on
    // 110 of the 444 published rows that carry both — so the reader meets the explanation at the
    // grouping itself. The tip used to offer only the mild case ("a shooting guard who plays on the
    // wing"), which does not prepare anyone for the three loud ones: NYK Andre Drummond (C, 20.8
    // MPG) and OKC Jalen Williams (PG, 33.8) and ATL Devin Carter (PG, 19.8) all render under WINGS.
    // New York is the worst of it, because taking its one wing-filed centre out of BIGS leaves that
    // group with exactly one player (Karl-Anthony Towns) — the only one-player family group in the
    // league, and a shape that reads as a broken join unless the reader was told to expect it. The
    // tip now names the loud case and its consequence, in that order.
    + ' <span class="help" data-tip="Groups are the depth chart\'s own — guards, wings and bigs —'
    + ' not the five listed positions. The two disagree on 110 of the 444 rows carrying both,'
    + ' sometimes loudly: a listed centre or point guard can be filed under WINGS, which can leave'
    + ' BIGS with a single player. Each player\'s listed position, where he has one, sits beside his'
    + ' role.">?</span>'
    + (thin ? ' <span class="badge b-g" data-tip="'+num(repShare,1)+'% of this roster\'s projected'
              + ' minutes go to players with no rated history, filled in at replacement level.">'
              + num(repShare,1)+'% replacement minutes</span>' : '')
    + '</div><div class="pbody">';

  html += winsStackHTML(roster, totalWins);

  html += '<div class="rhead"><div class="rid"></div><div class="rnums">'
    // plan 50 W3c: MPG is MODELLED, never curated — ZERO of the 538 published rows carry a proj_min
    // in depthcharts_2026_27.csv. The chart supplies the roster and the role; the minutes are ours.
    // That distinction stays with the column, in its header tip, where a reader meets the number.
    + '<div class="rnum rn-mpg">MPG <span class="help" data-tip="Modeled minutes per game when active — the depth chart supplies the roster and role, not the minutes.">?</span></div>'
    + '<div class="rnum rn-gp">Exp GP <span class="help" data-tip="Expected games played; the small numbers are the 80% range.">?</span></div>'
    + '<div class="rnum rn-net">Net <span class="help" data-tip="Projected on-court net, points per 100 possessions, for 2026-27. Cold-start rookies use a replacement-level prior.">?</span></div>'
    + '<div class="rnum rn-w">Wins <span class="help" data-tip="Each player\'s share of the team\'s projected wins; the column sums to the team total.">?</span></div>'
    + '</div></div>';

  // The family is a CURATED fact, read straight off the feed — the page does not re-derive one from
  // `pos`. A row with no family is a row nothing in the data can place, never a row we declined to
  // classify.
  const groups = Object.fromEntries(FAMILIES.map(f=>[f[0],[]]));
  const unplaced = [];
  roster.forEach(p=>{ const f = p && p.pos_family; if(groups[f]) groups[f].push(p); else unplaced.push(p||{}); });
  const byContrib = (a,b)=>((b.proj_wins||0)-(a.proj_wins||0));
  const emitGroup = (label, list, tip)=>{
    if(!list.length) return '';
    // a group is a unit: it owns its player count and its share of the projected wins
    const gw = list.reduce((a,p)=>a+((p && p.proj_wins!=null && !isNaN(p.proj_wins))?Number(p.proj_wins):0),0);
    // THE EXPLANATION GETS THE SAME CARRIER AS EVERY OTHER EXPLANATION ON THE PAGE: a circled ?
    // beside the heading. It used to be the heading itself wearing .help with
    // border:none;width:auto;height:auto — which keeps the cursor:help and the bubble but deletes
    // the ring, i.e. deletes the only thing that tells a reader an explanation exists. Nothing on
    // this page hovers what it cannot see is hoverable, so the one tip that most needed finding was
    // the one with no affordance at all. As a flex child of .rgrphead the ? picks up the same
    // var(--sp-2) gap the count and wins chips use.
    let h = '<div class="rgrp"><div class="rgrphead"><b>'+esc(label)+'</b>'
      + (tip?' <span class="help" data-tip="'+esc(tip)+'">?</span>':'')
      + '<span class="gs"><em>'+list.length+'</em> player'+(list.length===1?'':'s')+'</span>'
      // a group can be net-negative (Brooklyn's two point guards run −1.1); num() prints the −
      + '<span class="gs"><em>'+num(gw,1)+'</em> wins</span></div>';
    list.slice().sort(byContrib).forEach(p=>{ h += rosterRow(p, totalWins); });
    return h + '</div>';
  };
  FAMILIES.forEach(f=>{ html += emitGroup(f[1], groups[f[0]], null); });
  // THE HEADING NAMES WHAT IS ACTUALLY TRUE OF THESE ROWS AND OF NO OTHERS (fixed 2026-07-27).
  // It used to read NO POSITION LISTED, which is true of them — and of 75 rows that are NOT under
  // it: measured on the published feed, 94 of the 538 roster rows carry pos=null and 75 of those
  // (32 guard / 17 wing / 26 big) sit happily inside the three family groups on 29 of the 30 teams,
  // because the curated chart placed them without needing a listed position. Golden State puts both
  // sets on one screen — two pos=null players under GUARDS, one under BIGS, five under the residual,
  // all five rows looking identical — so the old heading named a property the reader could see was
  // shared, which reads as a bug in the grouping.
  // What the 19 residual rows uniquely share is the CONJUNCTION in the heading: the curated depth
  // chart has no row for them at all (verified: 0 of the 19 appear in depthcharts_2026_27.json by
  // franchise+key, by pid or by normalised name), AND no listed position exists to fall back on.
  // Both clauses are load-bearing. Six further rows are also missing from the chart but do carry a
  // listed position and are filed by it (PHI LeBron James SF, ATL Jacob Toppin F, CHA Mouhamadou
  // Gueye PF, MIL Pete Nance PF, SAC Adam Flagler PG, UTA Mo Bamba C) — they fail the second clause,
  // which is exactly why they are not here. Drop either clause and the heading over-claims again.
  // 19 of 538 across the league, on 11 of the 30 teams. Nothing is guessed into a group to make the
  // heading disappear.
  html += emitGroup('NOT ON THE DEPTH CHART · NO POSITION LISTED', unplaced,
    'Not on the depth chart these groups come from, and no listed position anywhere either — so '
    + 'nothing in the data can call them a guard, a wing or a big. A gap, not a position. A player '
    + 'the chart also misses but who does have a listed position is filed by that instead, so he is '
    + 'not here.');

  html += '<div class="rrow rtot"><div class="rid">'
    + '<span class="rnm" data-tip="Team projected net against the league average, and the roster\'s'
    + ' wins contributed summed to the projected total.">TOTAL</span>'
    + '<div class="rsub">'+roster.length+' players</div></div>'
    + '<div class="rnums">'
    + '<div class="rnum rn-mpg"><i>MPG</i><b>–</b></div>'
    + '<div class="rnum rn-gp"><i>Exp GP</i><b>–</b></div>'
    // no sign class on these two: in this cluster the sign is the + / − glyph (see .rnum b)
    + '<div class="rnum rn-net"><i>Net</i><b>'+strF.txt+'</b></div>'
    + '<div class="rnum rn-w"><i>Wins</i><b>'+num(totalWins,1)+'</b></div>'
    + '</div></div>';
  html += '</div></section>';   // /.pbody /.panel

  html += '</div>';   // /.dash

  // meta.note is an exporter-side provenance blob (minutes contract, GP model, artifact wording).
  // It is written for us, not for a reader, so it no longer renders; it stays in the JSON.

  document.getElementById('wrap').innerHTML = html;
  drawFactors(teamF, leagueAvg, facDev, facBand, N, [
    {label:'Offense', facs:OFF, val:oR, rank:rkOff,
     tip:'ORAPM: oTS + oTOV + oSC, each measured against the league average.'},
    {label:'Defense', facs:DEF, val:dR, rank:rkDef,
     tip:'DRAPM: dTS + dTOV + dSC, each measured against the league average. Higher is better.'}
  ]);
  fitStackLabels();
  fitHeadTips();
  mountMiniHeader(team, abbr, logoImg, strF);
  wireSwitchers();
}

/* ---- factor rows -------------------------------------------------------- */
function drawFactors(teamF, leagueAvg, facDev, facBand, N, sides){
  const host = document.getElementById('facmount');
  if(!host) return;
  // ONE shared domain across all six rows — and therefore across BOTH columns. Solved over every
  // team's deviation on every factor, exactly as when the six were one stack, so splitting the
  // block in two changed the layout and nothing else: a bar of a given length still means the same
  // number of points whichever column it is in. Per-column domains would have been the easy thing
  // to write and would have quietly made offence and defence unreadable against each other.
  let dom = 0;
  FACS.forEach(f=>{
    facDev[f].forEach(v=>{ dom = Math.max(dom, Math.abs(v)); });
    dom = Math.max(dom, Math.abs(facBand[f][0]), Math.abs(facBand[f][1]));
  });
  dom = Math.max(0.5, Math.ceil(dom*2)/2);
  const X = v => clamp(50 + (v/dom)*50, 0, 100);

  const rowHTML = f=>{
    const raw = teamF[f], mu = leagueAvg[f];
    const dev = (raw==null||isNaN(raw)) ? 0 : raw - mu;
    const rank = rankHigh(raw, facDev[f].map(v=>v+mu));
    const b = facBand[f], x0 = X(b[0]), x1 = X(b[1]), xv = X(dev), x50 = 50;
    const v = fmt(dev,2);
    const tip = FAC_TIP[f] + ' This team ' + num(raw,2) + ', league average ' + num(mu,2) + '.';
    return '<div class="frow">'
      + '<div class="flab">'+f+' <span class="help" data-tip="'+esc(tip)+'">?</span></div>'
      + '<div class="ftrack" data-tip="'+esc(tip)+'">'
        + '<span class="fband" style="left:'+x0.toFixed(2)+'%;width:'+(x1-x0).toFixed(2)+'%"></span>'
        + '<span class="fedge" style="left:'+x0.toFixed(2)+'%"></span>'
        + '<span class="fedge" style="left:'+x1.toFixed(2)+'%"></span>'
        + '<span class="faxis"></span>'
        // the bar wears the SAME pos/neg/zero class as the number to its right and takes its fill
        // from currentColor, so the two can never drift apart
        + '<span class="fbar '+v.cls+'" style="left:'+Math.min(x50,xv).toFixed(2)+'%;width:'
          + Math.abs(xv-x50).toFixed(2)+'%"></span>'
      + '</div>'
      + '<div class="fval '+v.cls+'">'+v.txt+'</div>'
      + '<div class="frank">'+rankPill(rank, N, f)+'</div>'
      + '</div>';
  };

  let h = '<div class="fgrid">';
  sides.forEach(s=>{
    const sv = fmt(s.val,1);
    h += '<div class="fcol"><div class="fchead"><h3>'+esc(s.label)+'</h3>'
      + '<span class="n '+sv.cls+'">'+sv.txt+'</span>'
      + rankPill(s.rank, N, s.label)
      + ' <span class="help" data-tip="'+esc(s.tip)+'">?</span></div>'
      + s.facs.map(rowHTML).join('')
      + '</div>';
  });
  host.innerHTML = h + '</div>';
}

/* ---- the stacked wins bar ----------------------------------------------- */
function winsStackHTML(roster, totalWins){
  const rows = (Array.isArray(roster)?roster:[])
    .filter(p=>p && p.proj_wins!=null && !isNaN(p.proj_wins))
    .map(p=>({name:String(p.name||''), w:Number(p.proj_wins)}))
    .sort((a,b)=>b.w-a.w);
  const pos = rows.filter(r=>r.w > 0), neg = rows.filter(r=>r.w < 0);
  const P = pos.reduce((a,r)=>a+r.w, 0);
  const Nn = neg.reduce((a,r)=>a-r.w, 0);
  if(!(P > 0)) return '';
  const last = n => { const p = n.trim().split(/\s+/); return p.length>1 ? p.slice(1).join(' ') : n; };
  const seg = (r,cls)=>{
    const w = Math.abs(r.w);
    const share = totalWins>0 ? ' · '+num((r.w/totalWins)*100,0)+'% of the projected total' : '';
    return '<span class="'+cls+'" style="width:'+((w/P)*100).toFixed(3)+'%" data-tip="'
      + esc(r.name)+' · '+num(r.w,2)+' wins contributed'+esc(share)+'"><span>'
      + esc(last(r.name))+'</span></span>';
  };
  const T = clamp(((P-Nn)/P)*100, 0, 100);          // where the published total falls on this axis
  let h = '<div class="wstack"><div class="wsbody">'
    + '<div class="wsbar" role="img" aria-label="Wins contributed by player, '
    + 'largest first, summing to '+num(totalWins,1)+' projected wins'
    + (Nn>0 ? ' after '+neg.length+' player'+(neg.length===1?'':'s')+' below replacement give back '
              + num(Nn,1) : '') + '.">'
    + pos.map(r=>seg(r,'wseg')).join('')
    + '</div>';
  if(Nn > 0){
    h += '<div class="wsback">' + neg.slice().reverse().map(r=>seg(r,'wnseg')).join('') + '</div>'
      + '<span class="wsmark" style="left:'+T.toFixed(3)+'%"></span>';
  }
  h += '</div><div class="wsaxis"><span class="z">0</span>'
    + '<span class="t" style="right:'+(100-T).toFixed(3)+'%"><b>'+num(totalWins,1)+'</b> projected wins</span>'
    + '</div>'
    + '<p class="wscap">Each block is one player\'s wins contributed, largest first.'
    + (Nn>0 ? ' The strip beneath is what the '+(neg.length===1?'one player':neg.length+' players')
              + ' below replacement give back.' : '')
    + '</p></div>';
  return h;
}
// A name is drawn inside its block only when the block is wide enough to hold it — measured after
// layout, not guessed from a percentage, because the same 3% block is 29px at 390 and 96px at 1280.
// The label span is absolutely positioned to its block, so scrollWidth > clientWidth is exactly
// "the text does not fit". Re-run on resize; an ellipsis'd "Dilli…" is noise, not a label.
// The same pass also decides which end of a block its tooltip hangs from — both answers depend on
// the block's real width in pixels, so they are settled together, after layout and again on resize.
function fitStackLabels(){
  document.querySelectorAll('.wseg > span, .wnseg > span').forEach(lab=>{
    lab.style.display = '';                       // measure it shown, before the browser paints
    if(lab.scrollWidth > lab.clientWidth) lab.style.display = 'none';
  });
  document.querySelectorAll('.wseg, .wnseg').forEach(seg=>{
    const host = seg.offsetParent;                // .wsbody — the only positioned ancestor
    const w = host ? host.clientWidth : 0;
    if(!(w > 0)) return;
    const centre = (seg.offsetLeft + seg.offsetWidth/2) / w;
    seg.classList.toggle('tipR', centre > 0.72);
    seg.classList.toggle('tipL', centre < 0.28);
  });
}
// Which end a PANEL-HEADER tooltip hangs from. The CSS flip above fixes the vertical clip at every
// width; the horizontal one only appears narrow, where a 260px bubble centred on a chip near one
// edge of a 362px panel loses a chunk off that side. Same .tipL/.tipR the stacked bar defines, same
// reason, and like it, assigned from measured geometry — which carrier sits near an edge depends on
// how the header wraps. 131 = half the bubble's own max width (260 + its 1px borders); erring
// towards anchoring is harmless, a bubble that would have fitted centred still fits hung off an end.
// .rgrphead joins the list because the residual group's heading is long enough to push its ? to the
// right edge of a narrow panel; it keeps the UPWARD bubble (the flip-down CSS above is keyed on
// .phead/.fchead only, and a group heading sits mid-body with room above it), it only borrows the
// horizontal anchoring.
function fitHeadTips(){
  document.querySelectorAll('.phead [data-tip], .fchead [data-tip], .rgrphead [data-tip]').forEach(el=>{
    const panel = el.closest('.panel');
    if(!panel) return;
    const r = el.getBoundingClientRect(), p = panel.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const overR = (cx + 131) - p.right, overL = p.left - (cx - 131);
    el.classList.toggle('tipR', overR > 0 && overR >= overL);
    el.classList.toggle('tipL', overL > 0 && overL > overR);
  });
}
let fitTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(fitTimer);
  fitTimer = setTimeout(()=>{ fitStackLabels(); fitHeadTips(); }, 120);
});

/* ---- roster rows -------------------------------------------------------- */
// The roster groups by the THREE families the curated depth chart actually uses, not by the five
// listed positions (owner 2026-07-26). Grouping by five left 107 of the league's 538 rows in an
// orphan bucket — 94 of them, mostly incoming rookies, carry no listed position at all — while the
// chart the projection is built on had already filed 513 of the 538 as a guard, a wing or a big
// (a further 6 are placed by their listed position; 19 by nothing, see the residual heading below).
// The exporter does that join and ships `pos_family`; this page only renders it.
const FAMILIES = [["guard","GUARDS"],["wing","WINGS"],["big","BIGS"]];
// The feed's model_source is an internal id ("xgb"), and the tooltip was printing it raw as
// "· source xgb". Reader words, or nothing — an id the reader cannot look up is worse than silence.
const SRC_WORDS = { xgb:"from rated history", rookie:"from a rookie prior", replacement:"at replacement level" };
function rosterRow(p, teamW){
  p = p || {};
  const f = Array.isArray(p.f) ? p.f : [];
  const ftip = f.length===6 ? (' · ' + FACS.map((nm,i)=>nm+' '+num(f[i],1)).join(' · ')) : '';
  const ntip = 'Projected net '+num(p.net,1)+' pts/100'
    + (p.age!=null ? ' · age '+num(p.age,0) : '')
    + (p.n_seasons ? ' · '+p.n_seasons+' prior season'+(p.n_seasons===1?'':'s') : '')
    + (SRC_WORDS[p.model_source] ? ' · '+SRC_WORDS[p.model_source] : '') + ftip;
  const rookie = '<span class="rk" title="Cold-start rookie — net is a replacement-level prior,'
    + ' no rated history yet.">R</span>';
  let nm;
  if(!p.cold && p.pid!=null){
    nm = '<a class="rnm" href="index.html?p='+encodeURIComponent(p.pid)+'" title="'+esc(ntip)+'">'+esc(p.name||'')+'</a>';
  } else if(p.gid!=null){
    nm = '<a class="rnm" href="index.html?p='+encodeURIComponent(p.gid)+'" title="'+esc(ntip)+'">'+esc(p.name||'')+'</a>'+rookie;
  } else {
    nm = '<span class="rnm" title="'+esc(ntip)+'">'+esc(p.name||'')+'</span>'+rookie;
  }
  // The red-to-green swatch that used to sit beside this number is gone with the table. It restated
  // the number's own sign and magnitude in a second channel, and in a list that reads down the
  // names it was the loudest thing on the row. What carries the sign now is the + / − glyph fmt()
  // prints on the figure — not the figure's colour, which could not clear the text floor on the
  // light theme's hover row (see .rnum b).
  const nf = fmt(p.net,1);
  const wins = (p.proj_wins!=null) ? Number(p.proj_wins) : null;
  const shareTip = (wins!=null && teamW>0) ? num((wins/teamW)*100,0)+'% of the team\'s projected wins' : '';
  const gp = (p.exp_gp==null) ? '–' : num(p.exp_gp,0);
  // the two small numbers under Exp GP are a range, and nothing on screen says so above 560px —
  // the column header's ? tip is hover-only. One visually-hidden word makes the pair self-naming.
  const rng = (p.gp_lo!=null && p.gp_hi!=null)
    ? '<span class="rng"><span class="vh">80% range </span>'+num(p.gp_lo,0)+'–'+num(p.gp_hi,0)+'</span>' : '';
  // The listed position did not vanish with the grouping, it moved: it rides beside the role for
  // the 444 of 538 rows that genuinely have one (431 of the five, 13 a bare G or F) and is simply
  // absent for the other 94. Same ink as the role — they are peers, and neither is a number.
  const pos = ["PG","SG","SF","PF","C","G","F"].indexOf(String(p.pos||"").toUpperCase()) >= 0
    ? String(p.pos).toUpperCase() : "";
  const sub = [(p.role||'').replace(/^\w/,c=>c.toUpperCase()), pos].filter(Boolean).join(' · ');
  return '<div class="rrow">'
    + '<div class="rid">'+nm
      + '<div class="rsub">'+esc(sub)+'</div></div>'
    + '<div class="rnums">'
      + '<div class="rnum rn-mpg"><i>MPG</i><b>'+num(p.mpg,1)+'</b></div>'
      + '<div class="rnum rn-gp"><i>Exp GP</i><b>'+gp+'</b>'+rng+'</div>'
      + '<div class="rnum rn-net"><i>Net</i><b>'+nf.txt+'</b></div>'
      + '<div class="rnum rn-w"><i>Wins</i><b'
        + (shareTip?' title="'+esc(shareTip)+'"':'')+'>'+num(wins,1)+'</b></div>'
    + '</div></div>';
}

/* ---- sticky mini-header + switcher wiring ------------------------------- */
function mountMiniHeader(team, abbr, logoImg, strF){
  const mount = document.getElementById('minimount');
  if(!mount) return;
  mount.innerHTML = '<div class="minibar" id="minibar">'
    + '<div class="mininner">'+logoImg('',24)
    + '<span class="ab">'+esc(abbr)+'</span>'
    + '<span class="mstat"><i>Wins</i><b>'+num(team.proj_wins,1)+'</b></span>'
    + '<span class="mstat"><i>Net</i><b class="'+strF.cls+'">'+strF.txt+'</b></span>'
    + '<span class="minispace"></span>'+switcherHTML('mini')+'</div></div>';
  const bar = document.getElementById('minibar'), foot = document.getElementById('herofoot');
  if(!bar || !foot || !window.IntersectionObserver) return;
  new IntersectionObserver(entries=>{
    entries.forEach(e=>{ bar.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0); });
  }, {rootMargin:'-56px 0px 0px 0px', threshold:0}).observe(foot);
}
function wireSwitchers(){
  document.querySelectorAll('.switch .nav').forEach(b=>{
    b.addEventListener('click', ()=>goTeam(b.getAttribute('data-go')));
  });
  document.querySelectorAll('.switch select').forEach(s=>{
    s.addEventListener('change', ()=>goTeam(s.value));
  });
}
// Left / right step the standings the same way the arrows do. Skipped whenever the user is typing
// or has a control focused (a focused <select> uses the same keys to change its own option), and
// whenever a modifier is held, so browser and OS shortcuts still work.
document.addEventListener('keydown', e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  if(e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
  const t = e.target, tag = t && t.tagName;
  if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT' || (t && t.isContentEditable)) return;
  if(!ORDER.length || !ABBR) return;
  const i = ORDER.findIndex(x=>x.abbr===ABBR);
  if(i < 0) return;
  e.preventDefault();
  goTeam(ORDER[(i + (e.key==='ArrowRight'?1:-1) + ORDER.length) % ORDER.length].abbr);
});
// Team colour is theme-dependent (teamAccent/teamInk both account for it), so re-derive it when
// the theme toggle flips the attribute rather than leaving a dark-theme hex on a white page.
new MutationObserver(()=>{ if(ABBR) applyTeamColor(ABBR); })
  .observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
</script>
