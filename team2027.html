<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team · 2026-27 Projection · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* ===========================================================================
     2026-27 TEAM DASHBOARD (rebuilt 2026-07-26, reworked 2026-07-27).
     The page it replaces was four sections on four different rhythms — a 6-box
     KPI strip, a 320px radar beside a bar chart that started at an unrelated x,
     a full-width roster table, and a 5-column depth chart repeating the same 16
     players. Nothing shared a grid, so the page read as a pile.
     ONE 12-column grid (.dash) now owns the page, ONE card style (.panel) with
     ONE header treatment (.phead) sits on it, and every section is a panel. All
     spacing comes from --sp-*, all type from --fs-*; the only derived size is
     the hero headline, and it is derived FROM --fs-6 so it moves with the ramp.
     2026-07-27: the roster stopped being a table (a stacked wins bar leads it,
     and the rows are a list), the factor block split into an offence column and
     a defence column, and the team accent went back onto the player names.
     2026-07-28: the roster list stopped being a list. Guards / Wings / Bigs are
     three side-by-side COLUMNS of player chips, and each chip trades the four
     numeric columns for two length-encoded tracks that multiply to its wins —
     see the .rot block for the encoding, the arithmetic behind it, and the two
     alternatives priced and rejected.
     =========================================================================== */

  /* ---- page header: identity + team switcher ------------------------------ */
  .thead{display:flex;align-items:center;gap:var(--sp-3);margin:var(--sp-2) 0 0;flex-wrap:wrap}
  .thead img{width:46px;height:46px;object-fit:contain;flex:0 0 auto}
  .thead .tn{flex:1 1 260px;min-width:0}
  .thead .tn h1{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-1)}
  .thead .tn h1 .nm{color:var(--team-ink,var(--accent))}
  .thead .tn .conf{color:var(--muted);font-size:var(--fs-1);margin-top:2px}
  .thead .tn .conf b{color:var(--text);font-weight:600}
  /* the badge wears the franchise fill, with --team-on for its label: pure white or pure black,
     whichever measures further from the fill (see onFill() — 4.58:1 worst case over 30 teams). */
  .forwardtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;
    color:var(--team-on,var(--accent-ink));background:var(--team,var(--accent));padding:2px 8px;
    border-radius:999px;vertical-align:middle;margin-left:var(--sp-2);text-transform:uppercase}

  /* Prev / next / jump. A native <select> is the jump target on purpose: it is keyboard- and
     screen-reader-complete for free, and it is the one control that must not swallow the
     ArrowLeft/ArrowRight hotkeys — the global handler skips it by tagName. */
  .switch{display:flex;align-items:center;gap:var(--sp-1);flex:0 0 auto;min-width:0}
  .switch .nav{font:inherit;font-size:var(--fs-3);line-height:1;color:var(--muted);cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r-1);padding:6px 10px}
  .switch .nav:hover{color:var(--text);border-color:var(--team,var(--accent))}
  .switch select{font:inherit;font-size:var(--fs-1);color:var(--text);background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r-1);padding:6px 8px;max-width:190px;cursor:pointer}
  .switch select:hover{border-color:var(--team,var(--accent))}
  /* the franchise owns the focus ring on this page too — scoped to the page body and the mini
     header so the shared top nav keeps the site's own ring. */
  .wrap :focus-visible,.minibar :focus-visible{outline:2px solid var(--team,var(--accent));
    outline-offset:2px;border-radius:2px}
  .wrap .help:hover{border-color:var(--team,var(--accent))}

  /* ---- sticky mini-header -------------------------------------------------- */
  /* Fixed at 52px = the topnav's own height, and z-index 40 < the topnav's 50, so it can never
     cover the nav and never fights the nav's position:sticky (two stickies in one scroll parent
     is where that goes wrong). visibility:hidden in the off state keeps its select unfocusable. */
  .minibar{position:fixed;top:52px;left:0;right:0;z-index:40;background:var(--navbg);
    border-bottom:1px solid var(--line);visibility:hidden;opacity:0;transform:translateY(-8px);
    transition:opacity .16s ease,transform .16s ease,visibility 0s linear .16s}
  .minibar.on{visibility:visible;opacity:1;transform:none;transition:opacity .16s ease,transform .16s ease}
  .mininner{max-width:var(--maxw);margin:0 auto;padding:0 22px;height:46px;
    display:flex;align-items:center;gap:var(--sp-3);min-width:0}
  .mininner img{width:24px;height:24px;object-fit:contain;flex:0 0 auto}
  .mininner .ab{font-weight:700;font-size:var(--fs-2);letter-spacing:.3px;flex:0 0 auto;
    color:var(--team-ink,var(--text))}
  .mstat{display:flex;align-items:baseline;gap:var(--sp-1);flex:0 0 auto;white-space:nowrap}
  .mstat i{font-style:normal;font-size:var(--fs-1);color:var(--muted)}
  .mstat b{font-family:var(--font-mono);font-size:var(--fs-2);font-variant-numeric:tabular-nums}
  .minispace{flex:1 1 auto;min-width:0}
  /* On a phone the bar carries logo + abbr + two readouts + the switcher in 362px, so the one
     elastic piece (the jump menu) is what gives — the arrows and the numbers stay full size. */
  @media(max-width:560px){
    .mininner{padding:0 14px;gap:var(--sp-2)}
    .minibar .switch select{max-width:76px;padding:6px 4px}
    .minibar .switch .nav{padding:5px 8px}
  }

  /* ---- the grid + the one card style -------------------------------------- */
  .dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4);margin-top:var(--sp-4)}
  .panel{grid-column:1/-1;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-2);overflow:hidden}
  /* THE 2px TEAM RULE ALONG THE TOP OF THIS CARD IS GONE (owner de-slop pass, 2026-07-27): it was a
     decorative bar carrying no data, and it is not replaced by another one. The franchise still
     owns this card through things that mean something — the distribution band, the mean caret, the
     headline name — plus a tint of the accent solved to stay inside the luminance range every ink
     on the page was certified against (see boundedWash). position:relative so the mini-header
     sentinel can hang off the bottom edge without being laid out — see .herofoot. */
  .panel.hero-panel{position:relative;background:var(--team-tint,var(--panel))}
  /* The sticky mini-header's trigger. It used to be a direct child of .dash, which made it a GRID
     ITEM: a zero-height row that still ate a full var(--sp-4) gap, so the hero sat 32px above the
     factor panel where every other seam is 16px. Out of flow entirely now, pinned to the bottom of
     the hero card, which is the line it was always meant to represent. */
  .herofoot{position:absolute;left:0;right:0;bottom:0;height:1px;pointer-events:none}
  .phead{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
    padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--team-soft,var(--line))}
  /* section heads wear the franchise ink, which teamInk() certifies at >=4.5:1 on every surface of
     the theme. With team_colors.js absent this falls back to the site accent, still a link-grade ink. */
  .phead h2{margin:0;font-size:var(--fs-3);font-weight:700;letter-spacing:.2px;
    color:var(--team-ink,var(--accent))}
  .phead .psub{font-size:var(--fs-1);color:var(--faint);font-weight:400}
  .phead .badge{cursor:help}
  .pbody{padding:var(--sp-4)}
  /* TOOLTIPS INSIDE A PANEL HEADER FLIP DOWN. .panel carries overflow:hidden (it owns a border-
     radius), so it clips the site tooltip's UPWARD bubble out of anything sitting in the panel's own
     header — and that is where this round put the two explanations the panels most depend on.
     Measured at 1280 on CHI: the Factor-profile "?" bubble is 188px tall with 17.5px of room above
     it, so 11.5px of it survived; the Roster chip's is 75px with 15.5px of room, so 9.5px did.
     Flipping down is the same device .wseg already uses, and for the same reason.
     .fchead is in the panel BODY but only 69px below the same clipping edge, so the Defense column's
     75px bubble lost 12px off the top — small enough to miss by eye and still a cut sentence.
     The same border clips SIDEWAYS too, which only bites narrow: at a real 390 the factor bubble ran
     72.3px past the panel's right edge and the roster chip's 33.4px past its left. fitHeadTips()
     hangs those off the near end with the .tipL/.tipR the stacked bar already defines. */
  .phead [data-tip]:hover::after,.fchead [data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .phead [data-tip]:hover::before,.fchead [data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}

  /* league rank — the same pill wherever a number claims a rank. The BORDER carries the franchise
     (solved to exactly 3:1 on the panel, the mark floor, so it is visible without shouting); the
     TEXT stays --muted on purpose. Team ink here would put a near-red numeral one space away from a
     --neg numeral on a red franchise, which is the exact collision this page is fighting. */
  .lgrank{font-family:var(--font-mono);font-size:var(--fs-1);color:var(--muted);white-space:nowrap;
    border:1px solid var(--team-line,var(--line));border-radius:999px;padding:1px 7px;cursor:help}

  /* ---- hero: headline wins + the win distribution ------------------------- */
  .hero{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-4);align-items:start}
  .heroid{grid-column:span 4;min-width:0}
  .heroband{grid-column:span 8;min-width:0}
  @media(max-width:880px){ .heroid,.heroband{grid-column:1/-1} }
  /* Display size, derived from the scale rather than invented beside it: the type ramp still owns
     the page, this is --fs-6 stepped up for the one number the page exists to publish. The decimal
     is set smaller because a mono '.' carries a full character advance — at 50px "28.6" opened a
     visible hole on both sides of the point. */
  .heroid .bignum{font-family:var(--font-mono);font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.03em;line-height:1;color:var(--text);font-size:calc(var(--fs-6) * 1.8);
    margin:0 0 var(--sp-2);display:flex;align-items:baseline}
  .heroid .bignum .dec{font-size:.5em;color:var(--muted);letter-spacing:-.02em}
  .heroid .x{font-size:var(--fs-1);color:var(--faint)}
  .heroid .x b{color:var(--text);font-weight:600}
  /* Projected net used to be one of three cells in a footer strip across the bottom of this card,
     beside Offense and Defense. Those two moved to the factor panel, where they now head the three
     rows each of them is the sum of; printing them twice on one page was duplication, not summary.
     What is left is one lockup — label and value adjacent, value outranking label. */
  .netlock{display:flex;align-items:baseline;gap:var(--sp-1);flex-wrap:wrap;
    margin-top:var(--sp-4);font-size:var(--fs-1);color:var(--muted)}
  .netlock b{font-family:var(--font-mono);font-size:var(--fs-4);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px}

  .band{position:relative;min-width:0}
  .bandanno{position:relative;height:19px}
  .cutlab{position:absolute;top:0;font-size:var(--fs-1);color:var(--muted);white-space:nowrap}
  .cutlab b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .bandmarks{position:relative;height:9px}
  .bmean{position:absolute;bottom:0;width:0;height:0;margin-left:-5px;
    border-left:5px solid transparent;border-right:5px solid transparent;
    border-top:7px solid var(--team,var(--accent));cursor:help}
  .bandrail{position:relative;height:30px;border:1px solid var(--line);border-radius:var(--r-1);
    background:var(--panel-2);overflow:hidden}
  /* WHY THIS IS A BOX-AND-WHISKER AND NOT TWO WASHES OF ONE HUE.
     Both regions used to be the accent at a low alpha (.18/.46 dark, .26/.55 light). Composited on
     --panel-2 that is 1.12-1.38:1 for the 95% span and 1.81-3.44:1 for the middle 80% — 0 of 30
     teams cleared 3:1 on either theme, so the headline of the page was a band you could not see
     (CHI dark: the wash composites to #301423, 1.12:1 on a #0c121b rail).
     Fixed twice over. (a) STRENGTH: the middle 80% is now the accent at FULL strength — team_colors
     already certifies every accent at >=3:1 on the lightest surface of its theme, so on the darker
     rail it lands 3.60-8.53:1 dark / 3.83-7.00:1 light, 30/30 — and the 95% alpha is SOLVED in JS
     against the rail's real composite (solveAlpha), not guessed, landing .50-.88 dark / .56-.83
     light for exactly 3:1. (b) SHAPE: colour alone still could not separate the two regions —
     for the worst accent the two composites differ by only 1.19:1 — so HEIGHT carries the
     distinction. The 95% span is a whisker, the middle 80% is the full-height box on top of it. */
  /* the fallback is the SOLID site accent, not a guessed alpha: if the script never runs, the
     whisker is still a certified >=3:1 mark rather than a wash nobody measured */
  .b95{position:absolute;top:10px;bottom:10px;z-index:1;background:var(--team-wash,var(--accent))}
  .b80{position:absolute;top:0;bottom:0;z-index:1;background:var(--team,var(--accent))}
  /* .500 is a backdrop gridline, so it sits UNDER the distribution and is neutral --zero rather
     than --text at .18 (which measured 1.63:1 dark / 1.45:1 on the bare rail — not a visible mark).
     --zero: 3.46:1 dark, 3.15:1 light. Where the box covers it the axis tick below still says 41. */
  .b500{position:absolute;top:0;bottom:0;z-index:0;width:1px;background:var(--zero)}
  /* the median lands on the box by definition, so it is inked AGAINST the box: --team-on is pure
     white or pure black, whichever measures further from the fill — 4.58:1 worst case. */
  .bmed{position:absolute;top:4px;bottom:4px;z-index:2;width:2px;margin-left:-1px;
    background:var(--team-on,var(--text));border-radius:1px;cursor:help}
  /* The playoff cut-off crosses three different backings — bare rail, the box, and the panel above
     the rail — and no single ink clears 3:1 on all of them (plain --text over the box is 1.42:1).
     A TWO-TONE dash does: the --bg segments are >=3:1 on any certified accent, the --text segments
     are >=14:1 on rail and panel, so one tone or the other is always the visible one. */
  .bcut{position:absolute;top:-9px;bottom:0;z-index:3;width:1.5px;margin-left:-.75px;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--text) 0 3px,var(--bg) 3px 6px)}
  .bandaxis{position:relative;height:17px;margin-top:3px;font-size:11px;color:var(--faint);
    font-family:var(--font-mono)}
  .bandaxis span{position:absolute;top:0}
  .bandcap{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);margin-top:var(--sp-2)}
  /* label + value adjacent = the house lockup; never space-between (owner, 2026-07-26) */
  .caplock{display:flex;align-items:baseline;gap:var(--sp-1);font-size:var(--fs-1);color:var(--muted)}
  .caplock b{color:var(--text);font-weight:600;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* ---- factor profile: two columns, offence and defence ------------------- */
  /* One deviation domain is shared by all SIX rows across BOTH columns (see drawFactors) — split
     per column, an oTS bar and a dTS bar of equal length would mean different numbers of points
     and the two sides would stop being comparable, which is the only reason to put them side by
     side. The column head carries that side's total, so each column is a sum and its three rows. */
  .fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-4) var(--sp-5)}
  @media(max-width:760px){ .fgrid{grid-template-columns:minmax(0,1fr);gap:var(--sp-5)} }
  .fcol{min-width:0}
  .fchead{display:flex;align-items:baseline;gap:var(--sp-2);flex-wrap:wrap;
    padding-bottom:var(--sp-2);border-bottom:1px solid var(--line)}
  .fchead h3{margin:0;font-size:var(--fs-2);font-weight:700;letter-spacing:.2px;
    color:var(--team-ink,var(--accent))}
  .fchead .n{font-family:var(--font-mono);font-size:var(--fs-3);font-weight:600;
    font-variant-numeric:tabular-nums;letter-spacing:-.2px}
  .frow{display:grid;grid-template-columns:52px minmax(0,1fr) 58px 44px;align-items:center;
    gap:var(--sp-2);padding:var(--sp-2) 0;border-bottom:1px solid var(--line-2)}
  .frow:last-child{border-bottom:none}
  .flab{font-size:var(--fs-1);font-weight:700;color:#aebccd;display:flex;align-items:center;
    justify-content:flex-end;gap:3px}
  :root[data-theme=light] .flab{color:#33425a}
  .ftrack{position:relative;height:20px;border:1px solid var(--line);border-radius:3px;min-width:0}
  /* the answer to "is −1.06 unusual or ordinary" — the middle 80% of the 30 teams, behind the bar.
     The FILL can only ever be a hint, not the mark: on the light theme any tint dark enough to be
     seen drops a --pos bar sitting on it below 3:1 (the arithmetic caps a legible tint at 1.12:1
     against the panel), so the tint stops at --panel-3 on dark (1.10:1) and --panel-2 on light
     (1.12:1), where a --pos/--neg/--zero bar keeps >=3.01:1. The EDGES are the real mark. */
  .fband{position:absolute;top:0;bottom:0;z-index:0;background:var(--panel-3)}
  :root[data-theme=light] .fband{background:var(--panel-2)}
  /* The edges have to survive ANY bar length — before this they were emitted before the bar with no
     z-index, so on OKC the right edge was painted over on 4 of 6 rows and the oTS row showed only
     the 26-50% remnant of a 26-77% band, i.e. it said the league's middle 80% is entirely below
     average. Two independent guarantees now: they paint ABOVE the bar, and they overshoot the track
     by 3px top and bottom into the row's own padding, where nothing can ever reach them.
     --line (1.19:1 on --panel) could not carry a mark either; --muted measures 5.39 on panel and
     4.90 on band in dark, 6.03 and 5.41 in light. */
  .fedge{position:absolute;top:-3px;bottom:-3px;z-index:3;width:1px;background:var(--muted)}
  .faxis{position:absolute;top:0;bottom:0;z-index:2;left:50%;width:1px;background:var(--zero)}
  /* THE FILL RAMP IS GONE. drawFactors fed RC.rdbu — a diverging ramp built for a WHITE ground —
     onto a #0e141d panel, so contrast ran backwards: the ramp's extremes (#053061 / #67001f, the
     biggest deviations) measured 1.41 and 1.40:1 while its middle (#f7f7f7, no deviation at all)
     measured 17.25:1. OKC's best factor was its faintest bar. Light inverted the failure — the
     middle measured 1.07:1 on white. An inset hairline patched one side of it and its comment had
     the cause backwards.
     Sign is now --pos/--neg, magnitude is bar length alone, and the bar simply takes currentColor
     from the same pos/neg/zero class the row's number already wears — so the bar and the figure
     beside it are literally one colour, and both extremes are the LOUDEST marks in the panel
     (>=5.98:1 dark, >=3.35:1 light). Green/red is not the sole encoder: direction from the centre
     axis and an explicit +/- on the number both carry the sign independently.
     min-width replaces the hairline: a team a tenth of a point off average rounds to a sub-pixel
     bar, and a mark that rounds away is the same defect in a smaller size. */
  .fbar{position:absolute;top:5px;bottom:5px;z-index:1;min-width:2px;border-radius:2px;
    background:currentColor}
  .fval{font-family:var(--font-mono);font-size:var(--fs-1);text-align:right;
    font-variant-numeric:tabular-nums;font-weight:600}
  .frank{text-align:right}
  @media(max-width:560px){ .frow{grid-template-columns:44px minmax(0,1fr) 54px 42px} }

  /* ---- roster · the stacked wins bar -------------------------------------- */
  /* WHY A STACK AND NOT A SCATTER. Wins contributed is exactly additive: the column sums to the
     projected total the hero prints, so one bar cut into 16-20 pieces is a true picture of where
     the wins come from. Nothing else on this page has that property — minutes here are per-game
     when active and sum to ~393 for Chicago, so anything drawn as a share of a 240-minute game
     would be a lie about its own axis.
     THE SCALE IS THE POSITIVE SUM, not the total. Chicago has two players below replacement; if
     the axis were the published 28.6 the positive blocks would overflow it. So the bar runs
     0..(sum of positives) and the players who give wins BACK are the strip beneath it, right-
     aligned, in --neg — their left edge is where the published total lands, marked by the dashed
     rule. Positives minus that strip is the number in the axis label, every time. */
  .wstack{margin:0 0 var(--sp-5)}
  .wsbody{position:relative}
  .wsbar{display:flex;height:40px;border:1px solid var(--line);border-radius:var(--r-1);
    background:var(--panel-2)}
  /* the giveback strip has NO track of its own — an empty full-width tray under the bar would draw
     a scale where there is no data. Only the blocks hang, flush under the bar's right end.
     SHAPE, NOT COLOUR, is what separates them from the stack: --neg against a red franchise's
     accent measures 1.88:1 (CHI dark) and 1.55:1 (CHI light), i.e. colour alone could not carry it
     — so the blocks are a third the height and hang below the baseline, the same device the win
     distribution uses for its whisker. --neg is still correct here; these ARE negative. */
  .wsback{display:flex;justify-content:flex-end;height:12px}
  /* no overflow:hidden anywhere in here on purpose — the per-segment tooltip is an ::after on the
     segment, and a clipping ancestor eats it. The end caps are rounded per-segment instead. */
  .wseg,.wnseg{position:relative;min-width:2px;cursor:help}
  .wseg{background:var(--team,var(--accent));box-shadow:inset -1px 0 0 var(--panel)}
  .wseg:last-child{box-shadow:none;border-radius:0 3px 3px 0}
  .wseg:first-child{border-radius:3px 0 0 3px}
  .wnseg{background:var(--neg);box-shadow:inset 1px 0 0 var(--panel)}
  .wnseg:first-child{box-shadow:none}
  .wnseg:last-child{border-radius:0 0 3px 0}
  .wseg > span,.wnseg > span{position:absolute;inset:0;display:flex;align-items:center;
    padding:0 6px;overflow:hidden;white-space:nowrap;pointer-events:none;
    font-size:11px;font-weight:700;letter-spacing:.1px;color:var(--team-on,var(--accent-ink))}
  .wnseg > span{color:var(--neg-on,#000000);font-size:9.5px}
  /* tooltips flip DOWN: the bar is the first thing in the panel body, so an upward bubble would
     land on the panel header (same rule as a sticky thead). */
  .wseg[data-tip]:hover::after,.wnseg[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .wseg[data-tip]:hover::before,.wnseg[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
  /* ...and blocks at either end anchor to that end rather than centring on themselves: the card
     clips at its own border, and the site tooltip has no edge logic. The giveback blocks are
     ALWAYS at the right end, so without this the two rows that most need explaining were the two
     whose explanation ran off the card. .tipL/.tipR are assigned from measured geometry, not
     nth-child, because which blocks sit near an end depends on the roster. */
  .tipR[data-tip]:hover::after{left:auto;right:0;transform:none}
  .tipR[data-tip]:hover::before{left:auto;right:7px;transform:none}
  .tipL[data-tip]:hover::after{left:0;transform:none}
  .tipL[data-tip]:hover::before{left:7px;transform:none}
  /* the published total, marked where it actually falls. Two-tone for the same reason as .bcut:
     it crosses the accent fill, the --neg strip and the bare rail, and no single ink clears 3:1
     on all three. */
  .wsmark{position:absolute;top:-3px;bottom:-3px;z-index:4;width:1.5px;margin-left:-.75px;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--text) 0 3px,var(--bg) 3px 6px)}
  .wsaxis{position:relative;height:17px;margin-top:5px;font-size:11px;color:var(--faint);
    font-family:var(--font-mono)}
  .wsaxis .z{position:absolute;left:0;top:0}
  .wsaxis .t{position:absolute;top:0;white-space:nowrap;text-align:right}
  .wsaxis .t b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
  .wscap{margin:var(--sp-2) 0 0;font-size:var(--fs-1);color:var(--muted);line-height:1.5;max-width:840px}

  /* ---- roster · rotation columns ------------------------------------------ */
  /* IT WAS A TABLE, THEN IT WAS A LIST OF ROWS, AND A LIST OF ROWS IS STILL A TABLE (owner,
     2026-07-28). Guards/Wings/Bigs had already shipped, but as three headings stacked down ONE
     column of ruled rows with four right-aligned numeric columns — so the reader still had to scan
     16-24 rows of figures, and multiply two of them, to answer the only questions a roster asks:
     who is here, how good, how much do they play, and how does that become the win total above.
     The three families are now three COLUMNS standing beside each other, and each player is a chip
     carrying two LENGTHS instead of four figures:
       MINUTES — bar = his projected minutes per team game across the whole season (season_mpg),
         with a tick at his rate in the games he plays (mpg). The gap between the two is the playing
         time he does not get; the old table printed the two ends of it in separate columns and left
         the reader to close it. It is NOT bar = tick x ExpGP / 82 — see the .rotcap tip.
       NET     — bar from the league-average axis: the .fbar idiom exactly, sign carried by
         --pos/--neg AND by direction, magnitude by length alone, no ramp.
     Both scales are shared by all three columns and fixed league-wide, so a guard's bar and a big's
     bar — and Memphis's and New York's — mean the same thing.
     THE TWO LENGTHS MULTIPLY TO THE WINS ON THE CHIP'S OWN NAME LINE, and that is arithmetic, not a
     metaphor: fitted over all 538 published rows, proj_wins = 0.0429 x season_mpg x (net + 4.20) at
     r = 0.9974, median residual 0.056 wins. That is why the net track carries a replacement rule
     (see .plrepl) — it is the line where the product, and so the chip's wins, changes sign.
     WHY NOT ONE 240-MINUTE ALLOCATION BAR PER GROUP. Because these minutes do not sum to 240:
     measured on the published feed, sum(season_mpg) per team runs 250.8 (DAL) to 308.8 (MEM), so a
     bar captioned "240 minutes" would be a fabricated axis — the trap the wins stack refuses one
     comment above for the same reason. Shares of the team's OWN minute total are honest, and that
     is what each column head prints instead.
     WHY NOT A RATING-VS-MINUTES SCATTER PER GROUP. The groups run n = 1 to 10 (New York's BIGS is
     one player, Houston's GUARDS ten); a five-point scatter is noise, and in a 311px column every
     point label collides with its neighbour — which would push all four numbers into hover, the one
     thing this page will not do to a reader who came for the numbers. */
  .rot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-5) var(--sp-4);
    margin-top:var(--sp-3)}
  /* two breakpoints, not one: at ~900 a 311px column has become ~200 and the tracks stop carrying
     length, so the grid drops to two columns and then to one. */
  @media(max-width:900px){ .rot{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:620px){ .rot{grid-template-columns:minmax(0,1fr)} }
  .rotcol{min-width:0}
  /* the residual group is not a fourth family — it spans, and flows its chips across the full width */
  .rotcol.wide{grid-column:1/-1}
  .rotcol.wide .rotbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:0 var(--sp-4)}
  /* same head treatment as .fchead in the factor panel — the franchise ink, a rule under it, and
     the group's own subtotals beside it. A group is a unit with a share, not a divider. */
  .rothead{padding:0 var(--sp-2) var(--sp-2);border-bottom:1px solid var(--line);
    margin-bottom:var(--sp-2)}
  .rothead b{font-size:var(--fs-1);letter-spacing:.7px;font-weight:800;
    color:var(--team-ink,var(--accent))}
  /* value before label, value louder than label — the house lockup, same as .rgrphead .gs was. */
  .rotstats{display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);margin-top:3px;
    font-size:var(--fs-1);color:var(--muted)}
  .rotstat{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
  .rotstat em{font-style:normal;font-family:var(--font-mono);font-weight:600;color:var(--text);
    font-variant-numeric:tabular-nums}

  /* ---- one player -------------------------------------------------------- */
  /* NO BORDER AND NO INNER CARD. The chip sits directly on the panel; the two tracks are the only
     ruled things in it, so they are what the eye lands on. A bordered card inside a bordered panel
     would be the second frame around the same content. */
  .pl{padding:var(--sp-2);border-radius:var(--r-1)}
  /* the hover ground is solved (boundedWash) to sit between --panel and --panel-3 in luminance, so
     it is never a worse ground than the site's own table row-hover, and every ink the chip puts on
     it is re-measured against it rather than against --panel. CHI dark #2a1523: --text 14.61:1,
     --muted 6.42:1, name 10.80:1. CHI light #f7e7ec: 14.91:1, 6.16:1, 4.65:1.
     THE CHIP ADDS FIVE MARKS THIS SURFACE HAD NEVER CARRIED, so they were measured too — worst case
     over all 30 franchises x both themes x {panel, hovered}, computed on the rendered variables:
       .plfill (--team)   3.06:1  (ATL light, hovered; 3.27 TOR dark, hovered)
       .plbar  (--neg)    4.59:1  (OKC light, hovered)
       .plbar  (--pos)    4.58:1  (CLE light, hovered)
       .plbar  (--zero)   4.92:1  (ORL dark, hovered)
       .pltick (--muted)  6.12:1  (CLE light, hovered)
       .plrepl (--text)  14.19:1  (ORL dark, hovered)
     30/30 clear the 3:1 mark floor on both grounds. The team fill is the tight one and it is tight
     BY DESIGN — team_colors.js certifies each accent at exactly >=3:1 and this surface is 0.06 off
     it, so anything that lightens the hover cap has to be re-measured here. */
  .pl:hover{background:var(--team-hover,var(--panel-2))}
  .plid{display:flex;align-items:baseline;gap:var(--sp-2)}
  .plwho{flex:1 1 auto;min-width:0}
  /* THE PLAYER NAMES WEAR THE FRANCHISE INK (owner, 2026-07-27). The hazard is real: on a red
     franchise the name ink and --neg are the same FAMILY of red, and no amount of derivation makes
     them different colours. So every mitigation here is NON-COLOUR. The name is 14px in the body
     face at 600 weight; every number is mono, tabular and right-aligned; the net value carries an
     explicit sign glyph no name contains; and the line under the name is words, not figures. No
     figure in this chip is sign-coloured — only the two bars are, and neither is text.
     THE INK IS team_colors.js's TO CHOOSE and this page reads whatever it certifies — including its
     refusal: on light it declines to brand a red or green franchise at all and hands back the site
     accent, so CHI light is #1b68c0 (5.54:1 on the panel, 4.65:1 hovered) while CHI dark keeps
     #ffbdbf (11.69:1 / 10.80:1). Do not re-derive that floor here; it lives in team_colors.js.
     The name WRAPS rather than ellipsing: a truncated name is a name the reader cannot look up, and
     the chips are an independent stack per column — nothing needs them to be the same height. */
  .plnm{font-size:var(--fs-2);font-weight:600;color:var(--team-ink,var(--accent));
    text-decoration:none;overflow-wrap:anywhere}
  .plnm:hover{color:var(--text);text-decoration:underline}
  /* wins rides the NAME line because it is the chip's headline — the one figure that is exactly
     additive up to the stacked bar at the top of this panel and to the hero's projected total. */
  .plw{flex:0 0 auto;font-family:var(--font-mono);font-size:var(--fs-2);font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--text);cursor:help;white-space:nowrap}
  /* the gap before "wins" is a REAL SPACE in the markup, not a margin: with a margin the DOM text
     is "3.6wins" and that is what a screen reader gets handed. nowrap above keeps the lockup whole. */
  .plw i{font-style:normal;font-family:var(--font);font-size:10px;font-weight:600;color:var(--muted)}
  /* role, listed position and expected games: data, not a whisper. --muted is 6.95:1 dark /
     7.36:1 light on the panel and 6.42 / 6.16 on the hover row; --faint measured 3.03:1, under the
     text floor. Exp GP lives here because it is what the minutes tick below is explained BY. */
  .plsub{font-size:var(--fs-1);color:var(--muted);margin-top:1px}

  /* ---- the two tracks ---------------------------------------------------- */
  .plrow{display:flex;align-items:center;gap:var(--sp-2);margin-top:6px}
  /* border only, no fill — the ground is the panel (or the hovered tint), exactly as .ftrack does
     it, so every mark inside is measured against a surface the site already certifies. */
  .pltrack{position:relative;flex:1 1 auto;min-width:0;height:14px;
    border:1px solid var(--line);border-radius:3px}
  .plval{flex:0 0 46px;text-align:right;font-family:var(--font-mono);font-size:var(--fs-1);
    font-weight:600;font-variant-numeric:tabular-nums;color:var(--text);line-height:1.2}
  /* MINUTES. The fill is the franchise — playing time is the team's own resource to hand out, the
     same thing .wseg says with the same colour. Measured, not assumed: see the .pl:hover table. */
  .plfill{position:absolute;top:2px;bottom:2px;left:0;z-index:1;min-width:2px;border-radius:2px;
    background:var(--team,var(--accent))}
  /* the un-played remainder, in the .fband treatment: a HINT (1.10:1 dark / 1.12:1 light), never
     the mark. On light any tint dark enough to be seen drops the fill sitting beside it below 3:1. */
  .plghost{position:absolute;top:0;bottom:0;left:0;z-index:0;background:var(--panel-3)}
  :root[data-theme=light] .plghost{background:var(--panel-2)}
  /* ...so the MARK is the edge, the .fedge idiom exactly: --muted (5.39:1 on panel, 4.90 on the
     band) and overshooting the track 3px top and bottom into the row's own gap, where no fill can
     ever paint over it. This tick is his MPG when active; the fill stops at his season-long rate. */
  .pltick{position:absolute;top:-3px;bottom:-3px;z-index:3;width:1px;background:var(--muted)}
  /* NET. Same three parts as .frow, same reasons: a --zero axis at the league average, and a bar
     that takes currentColor from the pos/neg/zero class its own printed figure wears, so the two
     can never drift apart. */
  .plaxis{position:absolute;top:0;bottom:0;z-index:2;left:50%;width:1px;background:var(--zero)}
  .plbar{position:absolute;top:2px;bottom:2px;z-index:1;min-width:2px;border-radius:2px;
    background:currentColor}
  /* REPLACEMENT LEVEL — the line where a chip's wins change sign, DERIVED from the feed (see the
     REPL block in render()), not typed in. It crosses three backings: the bare track, a --neg bar
     running left past it, and a --pos bar starting right of it — and no single ink clears 3:1 on
     all three, which is the same problem .bcut and .wsmark solve with a two-tone dash. Same device. */
  .plrepl{position:absolute;top:-3px;bottom:-3px;z-index:4;width:1.5px;margin-left:-.75px;
    pointer-events:none;
    background:repeating-linear-gradient(to bottom,var(--text) 0 3px,var(--bg) 3px 6px)}
  /* THE ENCODING IS EXPLAINED ONCE, IN WORDS, ABOVE THE COLUMNS. Two novel tracks with no legend is
     a puzzle; a legend per chip is noise. This sentence replaces the .rhead strip whose four column
     headers used to carry the same four methodology tips. */
  .rotcap{margin:var(--sp-4) 0 0;font-size:var(--fs-1);color:var(--muted);line-height:1.6;
    max-width:840px}
  .rotcap b{color:var(--text);font-weight:600}
  /* THE PER-TRACK LABELS ARE HIDDEN VISUALLY, NOT REMOVED. When the roster stopped being a table it
     lost the thead, row and columnheader semantics that named its numbers, and a bar has no text of
     its own at all — without these a screen reader reads "Jalen Smith 4.5 wins Deep · PF · 62 games
     24.1 +1.5". .rotcap cannot stand in: it is a sibling with no programmatic association to any
     track. So every value names itself, at every width. */
  .vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  /* THE ROOKIE CHIP IS NO LONGER AMBER (fixed 2026-07-27). --amber had no light value at all, so
     #f0b429 measured 1.86:1 on --panel #ffffff and 1.55:1 on the tinted hover row — and the 1px
     border was the same ink, so at 9.5px/800 the entire chip was under the 3:1 MARK floor on light,
     never mind the 4.5:1 text floor. --amber has since been given a light value site-wide, which
     would rescue it; --muted needed no rescue, clearing the floor on the palette that shipped the
     bug (6.03:1 / 5.02:1 light) and on the one that fixed it (7.36:1 / 6.16:1 light, 6.95:1 / 6.42:1
     dark, panel then hover row). One ink for the whole chip, glyph and ring, so the ring is a
     measured mark instead of the --line hairline it would otherwise be — 1.33:1 on white, and a chip
     nobody can see is not an improvement on a chip nobody can read. */
  .rk{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;letter-spacing:.3px;
    color:var(--muted);border:1px solid var(--muted);border-radius:3px;padding:0 4px;
    vertical-align:middle;cursor:help}
  /* THE "TOTAL" FOOTER ROW IS GONE with the table it was the footer of. It printed the team's net
     and the roster's summed wins — both of which are already on this page twice over: the hero's
     .netlock and .bignum, the sticky mini-header, and the wins stack's own axis label at the top of
     this very panel. Three columns of chips have no bottom edge to hang a footer from, and the
     column heads now carry the subtotals that actually add up to it. */
  @media(max-width:620px){
    /* one column, so a chip is full-width and the tracks get longer, not shorter — the encoding
       survives the phone. Nothing needs to be revealed here: unlike the old table's per-cell
       labels, every value in a chip is already named on screen or by its own hidden label. */
    .pl{padding:var(--sp-2) var(--sp-1)}
  }

<body>

<script src="charts.js"></script>
<script src="nav.js"></script>
<!-- Team palette. Written by team_colors.js; the whole feature is guarded, and with the file
     absent the page falls back to the site accent and looks completely normal. -->
<script src="team_colors.js"></script>
<div id="minimount"></div>
<div class="wrap" id="wrap">
  <div class="msg" id="msg">Loading 2026-27 team…</div>
</div>

<script>
"use strict";

const DEFAULT_ABBR = "OKC";
const FACS = ["oTS","oTOV","oSC","dTS","dTOV","dSC"];
const OFF = ["oTS","oTOV","oSC"], DEF = ["dTS","dTOV","dSC"];
const FAC_TIP = {
  oTS:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (projected).",
  oTOV:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive).",
  oSC:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions.",
  dTS:"Defensive true-shooting RAPM — suppressing opponent shot efficiency.",
  dTOV:"Defensive turnover RAPM — forcing turnovers / ball pressure.",
  dSC:"Defensive second-chance RAPM — limiting opponent offensive rebounds."
};
// Every factor is already sign-aligned in the feed — dTS "suppressing opponent shot efficiency" is
// POSITIVE when good, same as oTS — so higher is better on all six, and rank 1 = the highest value
// everywhere on this page. Verified against the old strip, which colours +z blue (good) for defence
// as well as offence, and against ORAPM/DRAPM, which are plain sums of the three.
const WIN_MAX = 82;                  // the win axis is pinned 0..82 so teams are comparable

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// ONE minus glyph on the page. fmt() has always emitted U+2212; num() emitted whatever toFixed
// gave it, so a roster row could show "−1.4" under Proj net and "-0.3" under Wins contributed —
// two different symbols for one idea, in the same row, at 12.5px.
function num(v,dec){
  if(v==null||isNaN(v)) return "–";
  return Number(v).toFixed(dec==null?1:dec).replace("-","−");
}
function fmt(v,dec){
  dec = (dec==null)?1:dec;
  if(v==null || isNaN(v)) return {txt:"–",cls:"zero"};
  const n = Number(v);
  const txt = (n>=0?"+":"−") + Math.abs(n).toFixed(dec);
  let cls = "zero";
  if(n >= 0.05) cls = "pos"; else if(n <= -0.05) cls = "neg";
  return {txt,cls};
}
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function qparam(k){ return new URLSearchParams(location.search).get(k); }
function logoURL(abbr){
  const M={UTA:'utah',NOP:'no',GSW:'gs',SAS:'sa',NYK:'ny',WAS:'wsh'};
  const k=String(abbr||'').toUpperCase();
  return "https://a.espncdn.com/i/teamlogos/nba/500/"+(M[k]||k.toLowerCase())+".png";
}
function ord(n){ if(n==null) return ""; const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
// rank among 30, higher = better (see the sign-alignment note above). Ties share the better rank.
function rankHigh(v, arr){
  if(v==null || isNaN(v)) return null;
  let better = 0;
  arr.forEach(x=>{ if(x!=null && !isNaN(x) && Number(x) > Number(v)) better++; });
  return better + 1;
}
function rankPill(rank, n, label){
  if(rank==null) return '';
  return '<span class="lgrank" data-tip="'+esc(label)+': '+ord(rank)+' of '+n+' teams. 1 = best.">'
    + ord(rank) + '</span>';
}
// linear-interpolated quantile of a SORTED array
function quant(sorted, p){
  const n = sorted.length; if(!n) return 0;
  const i = p*(n-1), lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi]-sorted[lo])*(i-lo);
}

// team six-factor profile = minute-weighted (mpg x exp_gp) mean of roster per-factor values,
// x5 on-floor so the six sum ~ the team's projected net (strength). Computed client-side from
// the roster's f[0..5], so no separate team-factor field is needed.
function teamFactors(team){
  const r = (team && Array.isArray(team.roster)) ? team.roster : [];
  const F = [0,0,0,0,0,0]; let W = 0;
  r.forEach(p=>{
    const w = (Number(p.mpg)||0) * (Number(p.exp_gp)||0);
    if(!(w>0) || !Array.isArray(p.f) || p.f.length!==6) return;
    W += w; for(let k=0;k<6;k++){ const v=Number(p.f[k]); if(!isNaN(v)) F[k]+=w*v; }
  });
  const out = {};
  FACS.forEach((f,k)=>{ out[f] = W>0 ? 5*F[k]/W : 0; });
  return out;
}

/* ---- team colour ---------------------------------------------------------
   Contract (team_colors.js, built alongside this page):
     window.TEAM_COLORS[abbr] -> {name, primary, secondary}
     window.teamAccent(abbr)  -> hex safe for marks/fills on the current theme
     window.teamInk(abbr)     -> hex safe for TEXT on the current theme
   The whole feature is optional: with the file missing every var below resolves to the site
   accent and the page is indistinguishable from an untinted one. Sign colours (--pos/--neg) are
   never touched — red/green encode meaning here and must not become decoration. */
function toRGB(c){
  c = String(c||"").trim();
  let m = c.match(/^#([0-9a-f]{3})$/i);
  if(m) return [0,1,2].map(i=>parseInt(m[1][i]+m[1][i],16));
  m = c.match(/^#([0-9a-f]{6})$/i);
  if(m) return [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16));
  m = c.match(/rgba?\(([^)]+)\)/i);
  if(m){ const p = m[1].split(","); return [+p[0]||0, +p[1]||0, +p[2]||0]; }
  return null;
}
/* WCAG maths, so an alpha on this page is SOLVED rather than picked. Same shape as the bisection
   team_colors.js runs on lightness, and for the same reason: measure the value you actually ship. */
function srgbLin(c){ c/=255; return c<=0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function relLum(p){ return 0.2126*srgbLin(p[0]) + 0.7152*srgbLin(p[1]) + 0.0722*srgbLin(p[2]); }
function contrast(a,b){
  const x = relLum(a), y = relLum(b);
  return (Math.max(x,y)+0.05) / (Math.min(x,y)+0.05);
}
function over(fg, alpha, bg){ return [0,1,2].map(i=>Math.round(fg[i]*alpha + bg[i]*(1-alpha))); }
function hexOf(p){ return "#" + p.map(v=>("0"+clamp(Math.round(v),0,255).toString(16)).slice(-2)).join(""); }
// Smallest alpha whose COMPOSITED pixel clears `floor` against the backing it is painted on.
// Searched over k/255 rather than bisected on a real number, because the compositor quantizes alpha
// to 8 bits: a bisected 0.794 is stored as 202/255 = 0.7922 and lands at 2.97:1 instead of the 3.01
// it was solved for — measured in the browser, not assumed. Contrast is monotone in alpha (the
// composite luminance walks straight from the backing to the colour), so the first hit is the
// minimum. Returns 1 when even the undiluted colour cannot reach the floor, so the caller always
// gets the best available rather than a silent failure.
function solveAlpha(fg, bg, floor){
  for(let k=1;k<=255;k++){
    const a = k/255;
    if(contrast(over(fg,a,bg), bg) >= floor) return a;
  }
  return 1;
}
// Ink for TEXT SITTING ON the accent fill (segment labels, the badge, the median tick).
// PURE white/black, not the site's near-white #f3f6fb and near-black #0a0e16: an accent whose
// luminance sits at the crossover (~0.18) measures 4.24:1 against both of those — under the 4.5
// text floor — where #ffffff/#000000 reach 4.58:1, which is the most any two-ink choice can do
// there. Measured over 30 teams x 2 themes: minimum 4.58:1 (MEM), i.e. AA on every franchise.
// (RC.inkOn would have picked wrong outright on the light accents — it flips at luminance 0.58,
// tuned for the redGreen ramp, and hands a bright #56b6ff white ink at 1.94:1.)
function onFill(rgb){
  return contrast([255,255,255], rgb) >= contrast([0,0,0], rgb) ? "#ffffff" : "#000000";
}
// Largest alpha (<= cap) whose composite stays INSIDE the luminance range team_colors.js certified
// its inks against — never lighter than --grid on dark, never darker than --panel-3 on light. A
// surface tinted this far is provably no worse a ground for text than the worst surface the site
// already ships, so a hovered row or a tinted hero cannot quietly break a contrast guarantee that
// was measured somewhere else. Luminance is monotone in alpha here (the accent is always on the
// far side of the limit from the panel), so the first miss ends the walk.
function boundedWash(fg, bg, limitRGB, light, cap){
  const L = relLum(limitRGB);
  let best = 0;
  for(let k=1;k<=Math.round(cap*255);k++){
    const a = k/255, l = relLum(over(fg,a,bg));
    if(light ? l >= L : l <= L) best = a; else break;
  }
  return best;
}
function cssRGB(name, fallback){
  return toRGB((getComputedStyle(document.documentElement).getPropertyValue(name)||"").trim())
    || fallback;
}
function applyTeamColor(abbr){
  const root = document.documentElement;
  const site = (getComputedStyle(root).getPropertyValue("--accent") || "#56b6ff").trim();
  let accent = site, ink = site;
  try{
    if(typeof window.teamAccent === "function"){ const a = window.teamAccent(abbr); if(a) accent = a; }
    if(typeof window.teamInk === "function"){ const k = window.teamInk(abbr); if(k) ink = k; }
  }catch(e){ accent = site; ink = site; }
  const rgb = toRGB(accent) || toRGB(site) || [86,182,255];
  const A = a => "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+a+")";
  const light = root.getAttribute("data-theme") === "light";
  root.style.setProperty("--team", accent);
  root.style.setProperty("--team-ink", ink);
  // The 95% whisker's alpha is solved against the rail it is actually painted on (--panel-2) for
  // THIS team, every theme flip. The old fixed .18/.26 pair was a guess and it missed on all 30.
  const rail = cssRGB("--panel-2", light ? [238,243,249] : [12,18,27]);
  const panel = cssRGB("--panel", light ? [255,255,255] : [14,20,29]);
  root.style.setProperty("--team-wash", A(solveAlpha(rgb, rail, 3)));
  root.style.setProperty("--team-on", onFill(rgb));
  // the giveback blocks are --neg (they ARE negative), so their label needs the same treatment:
  // white measures 2.78:1 on the dark --neg and black measures 7.4:1, and the light theme flips it
  root.style.setProperty("--neg-on", onFill(cssRGB("--neg", light ? [212,57,58] : [255,107,107])));
  // Row hover and the hero card's tint, both SOLVED and both emitted as SOLID hexes — an rgba here
  // would composite over --bg, not over the panel the row actually sits on, and the measured value
  // would not be the shipped one. Caps: 14% for hover (an affordance, wants to be felt), 5% for the
  // hero (a whisper of the franchise on the identity card).
  const limit = cssRGB(light ? "--panel-3" : "--grid", light ? [227,235,245] : [22,31,44]);
  const tint = over(rgb, boundedWash(rgb, panel, limit, light, 0.05), panel);
  root.style.setProperty("--team-hover", hexOf(over(rgb, boundedWash(rgb, panel, limit, light, 0.14), panel)));
  root.style.setProperty("--team-tint",  hexOf(tint));
  // rank-pill border: the smallest alpha that is still a certified 3:1 mark. Solved against the
  // TINTED hero card, not the plain panel — a pill rides both, and the tint is the ground nearer
  // the accent in luminance on either theme, so clearing it clears the panel too.
  root.style.setProperty("--team-line", A(solveAlpha(rgb, tint, 3)));
  root.style.setProperty("--team-soft", A(0.34));                  // section rules
}

function confRank(d, conf, abbr){
  const list = (d && d.conferences && Array.isArray(d.conferences[conf])) ? d.conferences[conf] : [];
  const i = list.findIndex(r=>r && r.abbr===abbr);
  return { rank:(i<0?null:i+1), size:list.length };
}
/* Walk order for the arrows = the standings order, not the alphabet. projection.html sorts each
   conference by projected wins descending and prints East first, then West; d.conferences already
   arrives in exactly that per-conference order, so East-then-West reproduces the standings page. */
function standingsOrder(d){
  const out = [];
  ["East","West"].forEach(c=>{
    const list = (d && d.conferences && Array.isArray(d.conferences[c])) ? d.conferences[c] : [];
    list.forEach((r,i)=>{ if(r && r.abbr) out.push({abbr:r.abbr, name:r.name||r.abbr, conf:c, seed:i+1}); });
  });
  return out;
}
function switcherHTML(cls){
  const i = ORDER.findIndex(t=>t.abbr===ABBR);
  const prev = ORDER[(i-1+ORDER.length)%ORDER.length], next = ORDER[(i+1)%ORDER.length];
  let opts = "";
  ["East","West"].forEach(c=>{
    opts += '<optgroup label="'+(c==="East"?"Eastern":"Western")+' Conference">';
    ORDER.filter(t=>t.conf===c).forEach(t=>{
      opts += '<option value="'+esc(t.abbr)+'"'+(t.abbr===ABBR?' selected':'')+'>'
        + t.seed + '  ' + esc(t.name) + '</option>';
    });
    opts += '</optgroup>';
  });
  return '<div class="switch '+cls+'">'
    + '<button type="button" class="nav" data-go="'+esc(prev.abbr)+'" title="'+esc(prev.name)
      + '" aria-label="Previous team: '+esc(prev.name)+'">‹</button>'
    + '<select aria-label="Jump to a team">'+opts+'</select>'
    + '<button type="button" class="nav" data-go="'+esc(next.abbr)+'" title="'+esc(next.name)
      + '" aria-label="Next team: '+esc(next.name)+'">›</button>'
    + '</div>';
}

function render(d){

  ABBR = abbr;

  applyTeamColor(abbr);
  document.title = (team.name||abbr) + " · 2026-27 Projection · Daily RAPM";

  const teams = Object.values(d.teams||{});

  // ---- league context: every number on this page is ranked against these 30 ----
  const teamF = teamFactors(team);
  const allF = teams.map(teamFactors);
  const leagueAvg = {}, facDev = {}, facBand = {};
  FACS.forEach(f=>{
    const v = allF.map(t=>t[f]).filter(x=>x!=null&&!isNaN(x));
    leagueAvg[f] = v.length ? v.reduce((a,b)=>a+b,0)/v.length : 0;
    facDev[f] = allF.map(t=>(t[f]||0)-leagueAvg[f]);           // all 30, as deviations
    const s = facDev[f].slice().sort((a,b)=>a-b);
    facBand[f] = [quant(s,0.10), quant(s,0.90)];               // the league's middle 80%
  });
  // plan 50 W3a: team.strength is on the board's RAW scale, whose 30-team mean is ~-3.73, NOT 0.
  // A net rating is by definition relative to league average, and this centring is verified, not
  // assumed: regressing published wins on published strength puts league-mean strength at exactly
  // 41.00 wins (slope 2.255). Uncentred, every team on this page read ~3.73 points too low.
  const allS = teams.map(t=>Number(t && t.strength)).filter(x=>!isNaN(x));
  const leagueNet = allS.length ? allS.reduce((a,b)=>a+b,0)/allS.length : 0;

  const cr = confRank(d, team.conf, abbr);

  // ---- page header ----
