<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tables · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* page-unique: overall-table scroll body */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 4px}
  .toolbar .asof{font-size:11.5px;color:var(--faint);margin-left:auto}
  .selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
  .findbox{flex:0 0 auto;margin-left:auto;position:relative}
  .findbox input{font:inherit;font-size:12.5px;background:var(--panel);border:1px solid var(--line);
    color:var(--text);outline:none;padding:6px 10px;border-radius:var(--r-1);width:180px}
  .findbox input:focus{border-color:var(--accent)}
  .tcap{color:var(--faint);font-size:11px;margin:4px 2px 8px;line-height:1.5;max-width:840px}
  /* mode hint — same rule as the Explorer's (index.html:15); the .seg control itself is the
     shared site.css class, so the toggle looks identical on both pages */
  .modehint{font-size:11.5px;color:var(--faint);margin:7px 0 -4px;line-height:1.55;max-width:840px}
  .modehint b{color:var(--muted);font-weight:600}
  /* a cell the active basis structurally does not carry (ORAPM/DRAPM in box mode) — an em-dash,
     deliberately heavier than fmt()'s en-dash for an ordinary missing value */
  td.na{color:var(--faint);cursor:help}
  /* full static table — no inner scroll; the whole ranked list lays out inline */
  /* header ? tooltips live in the sticky thead at the top of this scroll box;
     the shared tooltip renders upward and gets clipped — flip header tips DOWN */
  .tablebox th .help[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .tablebox th .help[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
  table.tbl thead th .arr{font-size:9px;color:var(--accent);margin-left:3px}
  /* emphasize the header of the currently-sorted column to match its bold body cells */
  table.tbl thead th.net{font-weight:700;color:var(--text)}
  td.pn{font-weight:600}
  td.pn .sub2{color:var(--muted);font-size:11px;font-weight:400;margin-left:7px}
  .nohit{color:var(--muted);font-size:12.5px;padding:18px 10px;text-align:center}
</style></head>
<body>
<nav id="topnav" data-active="tables"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1>RAPM <b>tables</b></h1>
  <p class="sub" id="sub">Six-factor RAPM leaderboards on the NBA-equivalent scale — college &amp; G-League translated.</p>

  <div class="toolbar">
    <span class="asof" id="asof"></span>
  </div>

  <!-- ===================== OVERALL ===================== -->
  <section id="view-overall">
    <div class="selrow">
      <span class="seglab">Table</span>
      <div class="seg" id="tableseg"></div>
      <div class="findbox"><input id="find" type="text" placeholder="Search this table…" autocomplete="off"></div>
    </div>
    <div class="selrow">
      <span class="seglab">Rating</span>
      <!-- Same .seg classes and the same localStorage key ('rapm_mode') as the Explorer's
           #modeseg, so a mode chosen on one page is already selected on the other. Latent is
           deliberately absent here: there is no season-aggregate latent artifact and latent is
           movers-only, so it would be an empty column, not a mode. -->
      <div class="seg" id="modeseg">
        <button data-mode="pure" type="button">Pure RAPM</button>
        <button data-mode="prior" type="button">Prior-informed</button>
        <button data-mode="box" type="button">Box prior</button>
      </div>
    </div>
    <div class="modehint" id="modehint"></div>
    <p class="tcap" id="tcap"></p>
    <div class="scroll"><div class="tablebox"><table class="tbl" id="otable"></table></div></div>
  </section>

  <div class="empty" id="empty">Loading tables…</div>

  <!-- "measured, never projected" is the keeper: these boards are the season that happened. The
       draft clause stops the 2026 board being read as a draft forecast. -->
  <p class="foot">Measured, never projected. Draft picks are ranked by their 2025-26 college / G-League season, not by draft slot.</p>
</div>

<script>
"use strict";
const TIP={
  net:"Net RAPM = ORAPM (oTS+oTOV+oSC) + DRAPM (dTS+dTOV+dSC), points/100 on the NBA-equivalent scale.",
  ORAPM:"Offensive RAPM = oTS + oTOV + oSC, points/100 on the NBA-equivalent scale.",
  DRAPM:"Defensive RAPM = dTS + dTOV + dSC, points/100 on the NBA-equivalent scale.",
  oTS:"Offensive true-shooting RAPM — points/100 from shot-making efficiency (NBA scale).",
  oTOV:"Offensive turnover RAPM — ball-security value (fewer turnovers = positive).",
  oSC:"Offensive second-chance RAPM — value from offensive rebounding / extra possessions.",
  dTS:"Defensive true-shooting RAPM — suppressing opponent shot efficiency.",
  dTOV:"Defensive turnover RAPM — forcing turnovers / ball pressure.",
  dSC:"Defensive second-chance RAPM — limiting opponent offensive rebounds."
};

/* ---- formatting ---------------------------------------------------------- */
function signCls(n){ if(n==null||isNaN(n)) return "zero"; if(n>=0.05) return "pos"; if(n<=-0.05) return "neg"; return "zero"; }
function fmt(v,dec){ dec=(dec==null)?2:dec;
  if(v==null||isNaN(v)) return "–";
  const n=Number(v); return (n>=0?"+":"−")+Math.abs(n).toFixed(dec); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* =========================================================================
   STATE
   ========================================================================= */
let TBL=null;             // table.json
let tableKey=null;        // current overall table key
let query='';             // overall search
let sortKey=null;         // overall sort column (null = file order by rank)
let sortDir=-1;           // -1 desc, +1 asc

/* =========================================================================
   RATING MODE  (mirrors the Explorer's #modeseg; shares localStorage 'rapm_mode')
   ========================================================================= */
const MODELAB={pure:'Pure RAPM', prior:'Prior-informed', box:'Box prior'};
// One line per mode. The box line keeps its "reads cooler" clause: without it a reader compares a
// box number against a board number and concludes the player got worse.
const MODEHINT={
  pure:'The prior-free six-factor solve.',
  prior:'The daily solve, shrunk toward a box-score prior where lineup data is thin. The default.',
  box:'The box-score basis the prior-informed solve shrinks toward, at its own scale — it reads cooler than the board, especially on defense.'};
// Rendered only when the exporter STAMPED the equality (build_table_site.py derives it by
// comparing every emitted cell), so this sentence cannot outlive the fact it describes.
const SAMENOTE=()=>' Same numbers as Prior-informed here — the prior only touches NBA rows.';
// Says what is ON SCREEN: those cells render td.na's em-dash, deliberately heavier than fmt()'s
// en-dash so it reads as "not carried", not as an ordinary missing value. "Blank" was wrong.
const SPLITNOTE=' ORAPM / DRAPM show “—”: this basis publishes the six factors and net, not the split.';
// The board is capped, and each mode ranks a DIFFERENT set into that cap, so table.json ships the
// union of every mode's top-cap and the page slices per mode. Without this a player who is top-500
// in box but 700th in prior would simply not exist on the page. The union size is bookkeeping —
// the reader only needs to know the list is a top-N. Rendered with the table CAPTION, not the mode
// hint: it is a fact about the LIST, not about the rating, and appending it pushed the box hint to
// three sentences (the bar is two).
const CAPNOTE=(cap)=>' Top '+cap+' by the selected rating.';

// MODE is the user's stored preference and is NEVER overwritten by a fallback: a table that
// cannot serve it (or a mode this page does not implement, e.g. 'latent' from the Explorer)
// falls back for display only, so returning to the Explorer still finds the original choice.
let MODE=localStorage.getItem('rapm_mode')||'prior';
// A table.json predating the toggle has no `modes`/`cap`/`m` — treat it as prior-only rather
// than greying out every button, so this page still renders if it is deployed ahead of a
// build_table_site.py run (deploy_site.sh:356 ships them together, but order is not enforced).
function modeOK(m){ const tb=curTable(); return !!(tb&&(tb.modes||['prior']).indexOf(m)>=0); }
function activeMode(){ return modeOK(MODE)?MODE:'prior'; }
function vals(r,m){ return m==='prior'?r:((r&&r.m&&r.m[m])||{}); }

function setMode(m){
  if(!modeOK(m))return;                       // button is disabled anyway
  MODE=m; localStorage.setItem('rapm_mode',m);
  syncMode(); renderOverall();
}
function syncMode(){
  const am=activeMode(), tb=curTable();
  document.querySelectorAll('#modeseg button').forEach(b=>{
    const ok=modeOK(b.dataset.mode);
    b.disabled=!ok; b.classList.toggle('on', ok&&b.dataset.mode===am);
  });
  let hint=MODEHINT[am]||'';
  if(tb&&(tb.same_as_prior||[]).indexOf(am)>=0) hint+=SAMENOTE(am);
  if(am==='box') hint+=SPLITNOTE;
  document.getElementById('modehint').textContent=hint;   // one or two sentences, always
  // The per-mode scale sentence (meta.scales) used to be pasted into the subhead. It is exporter
  // copy written for us — "raw mu_box + calibration offset" — and it duplicated the mode hint
  // directly below it. The hint is now the one place a mode explains itself, box caveat included,
  // so the subhead stays static. meta.scales is still emitted; nothing on this page reads it.
}
document.querySelectorAll('#modeseg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* =========================================================================
   SHARED: segmented control builder
   ========================================================================= */
function buildSeg(id, items, getLabel, cur, onpick){
  const seg=document.getElementById(id); seg.innerHTML='';
  items.forEach(it=>{
    const btn=document.createElement('button'); btn.type='button';
    btn.textContent=getLabel(it);
    btn.classList.toggle('on', it===cur);
    btn.onclick=()=>onpick(it);
    seg.appendChild(btn);
  });
}

/* =========================================================================
   OVERALL view
   ========================================================================= */
const OCOLS=[
  {key:'net',   label:'Net',   grp:false, net:true},
  {key:'ORAPM', label:'ORAPM', grp:true},
  {key:'oTS',   label:'oTS',   grp:false},
  {key:'oTOV',  label:'oTOV',  grp:false},
  {key:'oSC',   label:'oSC',   grp:false},
  {key:'DRAPM', label:'DRAPM', grp:true},
  {key:'dTS',   label:'dTS',   grp:false},
  {key:'dTOV',  label:'dTOV',  grp:false},
  {key:'dSC',   label:'dSC',   grp:false}
];
// Each category tab is inherently sorted by its headline metric (everything -> Net).
// Selecting a tab sets sortKey to that column so BOTH the sort and the bold/emphasis
// land on the column the user came to look at.
const DEFSORT={nba:'net', rookies:'net', draft:'net', gleague:'net', college:'net'};

function curTable(){ return TBL?TBL.tables.find(t=>t.key===tableKey):null; }   // null-safe: the mode
// buttons exist before table.json resolves, and modeOK()/syncMode() run off them.

function sortedRows(){
  const tb=curTable(); if(!tb) return [];
  const m=activeMode(), cap=tb.cap;
  // Slice to the ACTIVE mode's own top-cap. tb.rows is the union of every mode's top-cap, so a
  // row is shown iff this mode ranks it — that is what makes switching mode an honest re-rank
  // instead of a re-sort inside a set some other metric chose.
  let rows=tb.rows.filter(r=>{ const k=vals(r,m).rank; return k!=null && (cap==null||k<=cap); });
  if(query){
    const q=query.toLowerCase();
    rows=rows.filter(r=>String(r.name||'').toLowerCase().includes(q)
                     || String(r.sub||'').toLowerCase().includes(q));
  }
  if(sortKey){
    rows.sort((a,b)=>{
      const av=vals(a,m)[sortKey], bv=vals(b,m)[sortKey];
      const an=(av==null||isNaN(av)), bn=(bv==null||isNaN(bv));
      if(an&&bn) return 0; if(an) return 1; if(bn) return -1;   // nulls last
      return (av-bv)*sortDir;
    });
  }else{
    rows.sort((a,b)=>vals(a,m).rank-vals(b,m).rank);   // this mode's own ranking
  }
  return rows;
}

// Which columns the ACTIVE basis structurally does not carry — derived, not declared: a column
// is "absent" only if every row in this table is null for it under this mode. So if the box basis
// ever starts publishing ORAPM/DRAPM, the em-dashes become numbers with no code change here.
let MISS={};
function computeMiss(){
  const tb=curTable(), m=activeMode(); MISS={};
  if(!tb) return;
  OCOLS.forEach(c=>{ MISS[c.key]=tb.rows.every(r=>vals(r,m)[c.key]==null); });
}

function renderOverall(){
  const tb=curTable();
  const cap=document.getElementById('tcap');
  if(!tb){ cap.textContent=''; document.getElementById('otable').innerHTML=''; return; }
  computeMiss();
  cap.textContent=(tb.sub||'')+((tb.cap&&tb.rows.length>tb.cap)?CAPNOTE(tb.cap):'');

  const shown=sortedRows();   // full ranked list — static, no cap

  // header
  let head='<thead><tr>'+
    '<th class="l">#</th>'+
    '<th class="l">Player</th>';
  OCOLS.forEach(c=>{
    const active=(sortKey===c.key);
    const emph=(sortKey?active:c.net);   // bold the active sort header; default = net (file order)
    const arr=active?'<span class="arr">'+(sortDir<0?'▼':'▲')+'</span>':'';
    const tip=TIP[c.key]?' <span class="help" data-tip="'+esc(TIP[c.key])+'">?</span>':'';
    head+='<th class="sortable'+(c.grp?' grp':'')+(emph?' net':'')+'" data-k="'+c.key+'">'+c.label+tip+arr+'</th>';
  });
  head+='</tr></thead>';

  // body
  let body='';
  if(!shown.length){
    body='<tr><td colspan="11"><div class="nohit">No players match “'+esc(query)+'”.</div></td></tr>';
  }else{
    const m=activeMode();
    for(const r of shown){
      const V=vals(r,m);
      // Name links to the player's Explorer profile. The exporter only emits r.pid for ids that
      // exist in the deployed players.json, so a missing pid = no profile -> plain text, never a
      // dead link (a bogus ?p= silently lands on the Explorer's Jokic default). Styling comes from
      // the global site.css `a` rule, same as the team pages.
      const nm=esc(r.name);
      const pcell=r.pid?'<a href="index.html?p='+encodeURIComponent(r.pid)+'">'+nm+'</a>':nm;
      body+='<tr>'+
        '<td class="rank">'+(V.rank!=null?V.rank:'')+'</td>'+
        '<td class="l pn">'+pcell+
          (r.sub?'<span class="sub2">'+esc(r.sub)+'</span>':'')+'</td>';
      OCOLS.forEach(c=>{
        const v=V[c.key];
        const act=(sortKey?(sortKey===c.key):c.net);   // emphasize the active sort col; default = net (file order)
        // A column the active basis does not carry (ORAPM/DRAPM under box) renders an em-dash,
        // not a number: the split is absent from that basis, so there is nothing honest to print.
        if(v==null && MISS[c.key]){
          body+='<td class="'+(act?'net ':'')+(c.grp?'grp ':'')+'na" title="Not carried on the '
               +MODELAB[m]+' basis">—</td>';
        }else{
          body+='<td class="'+(act?'net ':'')+(c.grp?'grp ':'')+signCls(v)+'">'+fmt(v)+'</td>';
        }
      });
      body+='</tr>';
    }
  }
  document.getElementById('otable').innerHTML=head+'<tbody>'+body+'</tbody>';

  // wire sortable headers
  document.querySelectorAll('#otable th.sortable').forEach(th=>{
    th.onclick=()=>{
      const k=th.getAttribute('data-k');
      if(sortKey===k){ sortDir=-sortDir; }
      else { sortKey=k; sortDir=-1; }      // new column -> desc first
      renderOverall();
    };
  });
}

/* =========================================================================
   refresh
   ========================================================================= */
function refresh(){
  const asof=document.getElementById('asof');
  asof.textContent = TBL?('NBA as of '+TBL.meta.as_of_nba):'';
  if(!TBL) return;
  buildSeg('tableseg', TBL.tables.map(t=>t.key),
    k=>(TBL.tables.find(t=>t.key===k)||{}).title||k, tableKey,
    k=>{ tableKey=k; sortKey=DEFSORT[k]||'net'; sortDir=-1; query=''; document.getElementById('find').value=''; refresh(); });
  syncMode();          // per-table availability + the mode-dependent hint / scale sentence
  renderOverall();
}

/* live search-within (overall) */
document.getElementById('find').addEventListener('input',e=>{
  query=e.target.value.trim();
  renderOverall();
});

/* =========================================================================
   LOAD
   ========================================================================= */
fetch('table.json').then(r=>{ if(!r.ok) throw new Error('table.json '+r.status); return r.json(); })
  .then(t=>{
    TBL=t; tableKey=TBL.tables[0]&&TBL.tables[0].key; sortKey=DEFSORT[tableKey]||'net'; sortDir=-1;
    document.getElementById('empty').style.display='none';
    refresh();
  })
  .catch(()=>{
    document.getElementById('empty').textContent="Couldn't load the tables.";
  });
</script>
</body></html>
