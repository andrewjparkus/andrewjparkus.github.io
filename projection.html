<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026-27 Projection · Daily RAPM</title>
<link rel="stylesheet" href="site.css">
<link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest">
<style>
  /* page-unique: the only forward-looking page */
  .forwardtag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.5px;
    color:var(--accent-ink);background:var(--accent);padding:2px 8px;border-radius:999px;
    vertical-align:middle;margin-left:8px;text-transform:uppercase}
  /* two conference tables side-by-side on desktop, stacked on mobile (mirrors the trade sim) */
  .confs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start}
  @media(max-width:820px){ .confs{grid-template-columns:1fr} }
  .conf{min-width:0}
  .conf h2{font-size:var(--fs-4);font-weight:700;letter-spacing:-.1px;margin:0 0 9px;color:var(--text)}
  .conf h2 span{color:var(--muted);font-weight:500;font-size:12px;margin-left:8px}
  /* compact team cell: logo + abbr (full name only when the tables stack full-width) */
  .teamcell{display:flex;align-items:center;gap:9px;min-width:0}
  .teamcell img{width:22px;height:22px;flex:0 0 auto;object-fit:contain}
  .teamcell .ab{font-weight:700;font-size:13px;letter-spacing:.2px}
  td.projw{font-weight:700;font-size:13px}
  td.range{padding:5px 8px}
  td.range svg{display:block}
  td.po{font-weight:700;font-size:12.5px}
  table.tbl td.cb{color:var(--accent-ink)}    /* color-block cells: readable ink set inline */
  /* header ? tooltips live in a sticky thead inside the .scroll box — flip tips DOWN */
  .scroll thead th .help[data-tip]:hover::after{bottom:auto;top:calc(100% + 6px)}
  .scroll thead th .help[data-tip]:hover::before{bottom:auto;top:calc(100% + 1px);
    border-top-color:transparent;border-bottom-color:var(--line)}
</style></head>
<body>
<nav id="topnav" data-active="proj"></nav>
<script src="charts.js"></script>
<script src="nav.js"></script>
<div class="wrap">
  <h1 style="margin-top:6px">2026-27 <b>projection</b><span class="forwardtag">forward</span></h1>
  <p class="sub" id="sub">The only forward-looking page on the site — every other page is descriptive of play already on the books. This one projects next season.
    <a href="teams.html" style="color:var(--accent)">See 2025-26 team ratings →</a></p>
  <p class="legend" id="legend"></p>

  <div class="confs" id="confs"></div>
  <div class="msg" id="msg">Loading projection…</div>

  <p class="foot" id="foot"></p>
</div>

<script>
"use strict";

/* win-domain for the Proj-W colour ramp only — auto-fit to the league's 95% span in render() */
let W_LO = 0, W_HI = 82;
function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ESPN team logo from the franchise abbr (no extra fetch).
   ESPN slug exceptions (confirmed against teams.json); all others = lowercase abbr. */
function logoURL(abbr){
  const M={UTA:'utah',NOP:'no',GSW:'gs',SAS:'sa',NYK:'ny',WAS:'wsh'};
  const k=String(abbr||'').toUpperCase();
  return "https://a.espncdn.com/i/teamlogos/nba/500/"+(M[k]||k.toLowerCase())+".png";
}

/* color a number cell via the red->green ramp, with readable ink on top */
function colorCell(td, t){
  const bg = RC.redGreen(clamp(t,0,1));
  td.style.background = bg;
  td.style.color = RC.inkOn(bg);
}

/* win-distribution heat strip: one thin bar per win-count 0..82, opacity ∝ P[team wins exactly that
   many games] from the 10k Monte-Carlo, normalized to the team's peak. FIXED 0..82 domain so every
   team shares one scale. Overlaid: the .500 (41) tick, the 95% band edges, and a mean dot. */
const WSTRIP_W = 200, WSTRIP_H = 16;
function winStrip(hist, mean, p025, p975){
  const N = 83, W = WSTRIP_W, H = WSTRIP_H, pad = 1, bw = (W - 2 * pad) / N;
  const x = k => pad + k * bw;
  const svg = RC.el("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, class: "winstrip",
    role: "img", "aria-label": "win-total distribution, projected mean " + mean + ", 95% CI " + p025 + " to " + p975 });
  svg.appendChild(RC.el("rect", { x: 0, y: 0, width: W, height: H, rx: 2, fill: "var(--grid)", "fill-opacity": 0.35 }));
  if (Array.isArray(hist) && hist.length){
    const mx = Math.max.apply(null, hist) || 1;
    for (let k = 0; k < Math.min(N, hist.length); k++){
      const o = Math.pow(hist[k] / mx, 0.6);          // perceptual: lift the tail so rare win-counts still read
      if (o < 0.015) continue;
      svg.appendChild(RC.el("rect", { x: x(k).toFixed(2), y: 1, width: Math.max(bw - 0.12, 0.7).toFixed(2),
        height: H - 2, fill: "var(--accent)", "fill-opacity": o.toFixed(3) }));
    }
  }
  svg.appendChild(RC.el("line", { x1: x(41), y1: 0, x2: x(41), y2: H, stroke: "var(--line)", "stroke-width": 1 }));  // .500
  [p025, p975].forEach(v => { if (v != null) svg.appendChild(RC.el("line", { x1: x(v), y1: 0.5, x2: x(v), y2: H - 0.5,
    stroke: "var(--text)", "stroke-width": 0.75, "stroke-opacity": 0.4 })); });                                    // 95% CI
  svg.appendChild(RC.el("circle", { cx: x(mean), cy: H / 2, r: 2.3, fill: "var(--accent)", stroke: "var(--bg)", "stroke-width": 1 }));  // mean
  return svg;
}

function buildConf(name, teams){
  const sec = document.createElement("section");
  sec.className = "conf";
  const sorted = teams.slice().sort((a,b)=> b.mc_mean_wins - a.mc_mean_wins);

  let head = '<thead><tr>'+
    '<th class="l rank">#</th>'+
    '<th class="l">Team</th>'+
    '<th>Proj W <span class="help" data-tip="Monte-Carlo mean wins over 10k simulated seasons, each on its own re-drawn synthetic schedule.">?</span></th>'+
    '<th class="l">Win distribution <span class="help" data-tip="Monte-Carlo win-total distribution on a fixed 0–82 scale: each thin bar is a win count, shaded by how often the team finished with exactly that many wins across the 10k sims. Faint ticks = 95% CI (p2.5–p97.5), dot = projected mean, vertical line = .500 (41).">?</span></th>'+
    '<th>Playoffs % <span class="help" data-tip="Share of the 10k simulations in which the team reaches the 16-team playoff field, AFTER simulating each conference\'s 7–10 play-in tournament (so finishing 7–10 no longer guarantees a seed). Hover a row for its play-in odds (top-10).">?</span></th>'+
    '</tr></thead>';

  let body = "";
  sorted.forEach((t, i)=>{
    const logo = '<img src="'+logoURL(t.franchise)+'" width="22" height="22" loading="lazy" alt="" '+
      'onerror="this.style.visibility=\'hidden\'">';
    body += '<tr>'+
      '<td class="l rank">'+(i+1)+'</td>'+
      '<td class="l"><a href="team2027.html?abbr='+encodeURIComponent(t.franchise)+'" '+
        'class="teamcell" title="2026-27 team detail">'+logo+
        '<span class="ab">'+esc(t.franchise)+'</span></a></td>'+
      '<td class="projw cb" data-w="'+t.mc_mean_wins+'">'+t.mc_mean_wins.toFixed(1)+'</td>'+
      '<td class="l range" data-hist=\''+JSON.stringify(t.win_hist||[])+'\' data-mean="'+t.mc_mean_wins+'" data-p025="'+t.p2_5_wins+'" data-p975="'+t.p97_5_wins+'"></td>'+
      '<td class="po cb" data-p="'+t.make_playoffs_prob+'" title="Play-in (top 10): '+
        ((t.make_playin_prob!=null?t.make_playin_prob:t.make_playoffs_prob)*100).toFixed(1)+'%">'+
        (t.make_playoffs_prob*100).toFixed(1)+'%</td>'+
      '</tr>';
  });

  sec.innerHTML =
    '<h2>'+esc(name)+'<span>'+sorted.length+' teams</span></h2>'+
    '<div class="scroll"><table class="tbl" style="min-width:360px">'+head+'<tbody>'+body+'</tbody></table></div>';

  // color the Proj W and Playoffs cells; draw the range bars
  sec.querySelectorAll('td.projw').forEach(td=>{
    const w = +td.getAttribute('data-w');
    colorCell(td, (w - W_LO) / (W_HI - W_LO));
  });
  sec.querySelectorAll('td.po').forEach(td=>{
    colorCell(td, +td.getAttribute('data-p'));
  });
  sec.querySelectorAll('td.range').forEach(td=>{
    let hist=[]; try{ hist=JSON.parse(td.getAttribute('data-hist')||'[]'); }catch(e){}
    td.appendChild(winStrip(hist, +td.getAttribute('data-mean'),
      +td.getAttribute('data-p025'), +td.getAttribute('data-p975')));
  });
  return sec;
}

function provNote(meta){
  const p = meta.provenance;
  if (p && typeof p === "object") return p.note || "";
  return (typeof p === "string") ? p : "";
}

function render(data){
  const meta = data.meta || {};
  const teams = data.teams || [];

  // W_LO/W_HI now only scale the Proj-W colour ramp (the win strip is a fixed 0–82 scale).
  // Fit the ramp to the league's 95% win span so colour spreads across the standings.
  if (teams.length){
    W_LO = Math.floor(Math.min.apply(null, teams.map(t=>t.p2_5_wins)) - 1);
    W_HI = Math.ceil(Math.max.apply(null, teams.map(t=>t.p97_5_wins)) + 1);
  }

  // legend: model note + roster-proxy caveat (terse)
  const prov = provNote(meta);
  let legend = esc(meta.note || "");
  if (/carry-forward proxy/i.test(prov) || /carry-forward proxy/i.test(meta.note||"")){
    legend += ' <b>Rosters are a proxy</b> — 2025-26 carried forward and aged a year; no trades, signings, or draft picks reflected.';
  }
  document.getElementById("legend").innerHTML = legend;

  // split by conference, build two tables
  const east = teams.filter(t=> (t.conf||"")==="East");
  const west = teams.filter(t=> (t.conf||"")==="West");
  const confs = document.getElementById("confs");
  confs.innerHTML = "";
  confs.appendChild(buildConf("Eastern Conference", east));
  confs.appendChild(buildConf("Western Conference", west));

  // foot: synthetic schedule + MC + band composition (terse)
  const ng = meta.n_games != null ? meta.n_games : 1230;
  document.getElementById("foot").textContent =
    "Win distribution: 10k Monte-Carlo, each sim on its OWN re-drawn synthetic "+ng+"-game schedule "+
    "(HCA "+(meta.hca!=null?(+meta.hca).toFixed(2):"–")+" pts, σ "+(meta.sigma!=null?(+meta.sigma).toFixed(1):"–")+" pts/game). "+
    "Each sim re-draws its schedule AND every rating from its own uncertainty; the heat strip is the full win-total distribution and the faint ticks mark the 95% CI (p2.5–p97.5). "+
    "Model: "+(meta.projection_model||"carry-forward + aging")+".";

  document.getElementById("msg").style.display = "none";
}

/* RAPM-decomp is the only projection product now (EPM-blend / RAPM-EPM-hybrid toggles removed
   2026-07-08 per owner). Single fetch of the default projection JSON. */
fetch("projection_2026_27.json")
  .then(r=>{ if(!r.ok) throw new Error("projection_2026_27.json "+r.status); return r.json(); })
  .then(d=>{ render(d); })
  .catch(()=>{
    const m = document.getElementById("msg");
    m.style.display = ""; m.textContent = "Couldn't load the 2026-27 projection (projection_2026_27.json).";
  });
</script>
</body></html>
